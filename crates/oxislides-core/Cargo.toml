[package]
name = "oxislides-core"
version = "0.8.2"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Ryujiyasu/oxi"
description = "Core presentation processing engine for OxiSlides (.pptx)"

[dependencies]
oxidocs-common = { version = "0.8.2", path = "../oxidocs-common" }
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
log = "0.4"
