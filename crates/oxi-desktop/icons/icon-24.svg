<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- The 24px cut, the size the taskbar asks for. Two-pixel rules on whole
       pixels, four 6x6 cells, and the inked cell kept because at this size it
       still reads. -->
  <rect width="24" height="24" rx="5" fill="#C7462F"/>
  <rect x="5" y="5" width="6" height="6" fill="#FFFFFF" opacity=".46"/>
  <g fill="#FFFFFF">
    <rect x="3" y="3" width="18" height="2"/>
    <rect x="3" y="19" width="18" height="2"/>
    <rect x="3" y="5" width="2" height="14"/>
    <rect x="19" y="5" width="2" height="14"/>
    <rect x="11" y="3" width="2" height="18"/>
    <rect x="3" y="11" width="18" height="2"/>
  </g>
</svg>
