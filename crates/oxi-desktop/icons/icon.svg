<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Oxi's mark: the cell grid that Japanese layout is set on, which is also a
       spreadsheet's cells. One cell is inked, the way a manuscript sheet shows a
       character set into it. This file is the master every size is cut from;
       tools/make-icons.mjs turns it into the PNGs and the .ico. -->
