[package]
name = "oxidocs-model"
version = "0.9.0"
edition = "2021"
license = "MPL-2.0"
description = "A lossless, schema-ordered WordprocessingML document model that builds .docx packages from data"
repository = "https://github.com/Ryujiyasu/oxi"

[dependencies]
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
