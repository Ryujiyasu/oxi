[package]
name = "oxidocs-cli"
version = "0.9.0"
edition = "2021"
license = "MPL-2.0"
description = "Convert .docx to PDF, and read, check and seal the VBA inside Office files"
repository = "https://github.com/Ryujiyasu/oxi"

[[bin]]
name = "oxidocs"
path = "src/main.rs"

[[bin]]
name = "oxicells"
path = "src/cells.rs"
required-features = ["vba-execution"]

[features]
vba-execution = ["dep:oxidocs-wasm"]

[dependencies]
oxidocs-common = { version = "0.9.0", path = "../oxidocs-common" }
oxidocs-core = { version = "0.9.0", path = "../oxidocs-core" }
oxidocs-fonts = { version = "0.9.0", path = "../oxidocs-fonts" }
oxivba-core = { version = "0.9.0", path = "../oxivba-core" }
oxislides-core = { version = "0.9.0", path = "../oxislides-core" }
oxipdf-core = { version = "0.9.0", path = "../oxipdf-core" }
serde_json = "1"
oxidocs-wasm = { version = "0.9.0", path = "../oxidocs-wasm", features = ["suite", "external-font-catalog"], optional = true }
oxicells-core = { version = "0.9.0", path = "../oxicells-core", features = ["print"] }
quick-xml = "0.37"
encoding_rs = "0.8"
subsetter = "0.2.6"
rustybuzz = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
ovba = "0.7.1"
oxihanko = { version = "0.9.0", path = "../oxihanko", features = ["ring"] }
ring = "0.17.14"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# musl's allocator is slow enough to cost the static Linux build ~40% of its
# speed; the glibc builds keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Time", "Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
