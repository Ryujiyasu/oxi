[package]
name = "oxidocs-cli"
version = "0.8.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/Ryujiyasu/oxi"

[[bin]]
name = "oxidocs"
path = "src/main.rs"

[dependencies]
oxidocs-common = { version = "0.8.0", path = "../oxidocs-common" }
oxidocs-core = { version = "0.8.0", path = "../oxidocs-core" }
oxidocs-fonts = { version = "0.8.0", path = "../oxidocs-fonts" }
oxivba-core = { version = "0.8.0", path = "../oxivba-core" }
oxipdf-core = { version = "0.8.0", path = "../oxipdf-core" }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
ovba = "0.7.1"
oxihanko = { version = "0.8.0", path = "../oxihanko", features = ["ring"] }
ring = "0.17.14"
