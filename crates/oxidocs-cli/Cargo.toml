[package]
name = "oxidocs-cli"
version = "0.9.0"
edition = "2021"
license = "MPL-2.0"
description = "Convert .docx to PDF, and read, check and seal the VBA inside Office files"
repository = "https://github.com/Ryujiyasu/oxi"

[[bin]]
name = "oxidocs"
path = "src/main.rs"

[dependencies]
oxidocs-common = { version = "0.9.0", path = "../oxidocs-common" }
oxidocs-core = { version = "0.9.0", path = "../oxidocs-core" }
oxidocs-fonts = { version = "0.9.0", path = "../oxidocs-fonts" }
oxivba-core = { version = "0.9.0", path = "../oxivba-core" }
oxipdf-core = { version = "0.9.0", path = "../oxipdf-core" }
serde_json = "1"
encoding_rs = "0.8"
subsetter = "0.2.6"
rustybuzz = "0.20"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
ovba = "0.7.1"
oxihanko = { version = "0.9.0", path = "../oxihanko", features = ["ring"] }
ring = "0.17.14"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

# musl's allocator is slow enough to cost the static Linux build ~40% of its
# speed; the glibc builds keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
