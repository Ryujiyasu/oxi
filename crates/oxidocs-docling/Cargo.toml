[package]
name = "oxidocs-docling"
version = "0.9.0"
edition = "2021"
license = "MPL-2.0"
description = "Export an Oxi-laid-out .docx as a DoclingDocument with page and bounding-box provenance"
repository = "https://github.com/Ryujiyasu/oxi"

[dependencies]
oxidocs-core = { version = "0.9.0", path = "../oxidocs-core" }
serde_json = "1"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
