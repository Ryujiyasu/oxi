[package]
name = "oxidocs-wasm"
version = "0.8.9"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for Oxidocs — Word-compatible .docx parsing, layout, rendering and PDF export"
repository = "https://github.com/Ryujiyasu/oxi"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ttf-parser = "=0.25.1"
oxidocs-core = { version = "0.8.9", path = "../oxidocs-core" }
oxidocs-fonts = { version = "0.8.9", path = "../oxidocs-fonts" }
oxicells-core = { version = "0.8.9", path = "../oxicells-core", optional = true }
oxicells-calc = { version = "0.8.9", path = "../oxicells-calc", optional = true }
oxivba-core = { version = "0.8.9", path = "../oxivba-core", optional = true }
oxislides-core = { version = "0.8.9", path = "../oxislides-core", optional = true }
oxipdf-core = { version = "0.8.9", path = "../oxipdf-core" }
oxihanko = { version = "0.8.9", path = "../oxihanko", optional = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
oxidocs-common = { version = "0.8.9", path = "../oxidocs-common", optional = true }
ovba = { version = "0.7.1", optional = true }
codepage = { version = "0.1.2", optional = true }
cfb = { version = "0.10", optional = true }
uuid = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.37", optional = true }
serde_json = "1.0.151"

[features]
default = []
# Full-suite bindings (spreadsheet/presentation/generic-PDF/hanko) used by the
# in-repo web editor; the published npm package is the default docs-only build.
suite = ["dep:oxicells-core", "dep:oxicells-calc", "dep:oxivba-core", "dep:oxislides-core", "dep:oxihanko", "dep:oxidocs-common", "dep:ovba", "dep:codepage", "dep:quick-xml", "dep:cfb", "dep:uuid", "dep:zip"]
oxidocs-common = ["dep:oxidocs-common"]
ovba = ["dep:ovba"]
# Leave the ~34 MB per-face metric catalog out of the module; the page fetches
# the members a document needs (font_catalog_missing / font_catalog_register).
external-font-catalog = ["oxidocs-core/external-font-catalog"]
