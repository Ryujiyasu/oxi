[package]
name = "oxidocs-core"
version = "0.8.2"
edition = "2021"
license = "MPL-2.0"
description = "Word-compatible .docx parser, layout and rendering engine"
repository = "https://github.com/Ryujiyasu/oxi"

[dependencies]
oxidocs-common = { path = "../oxidocs-common", version = "0.8.2" }
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
skrifa = "0.26"
encoding_rs = "0.8"
flate2 = "1"
rustybuzz = "0.20"
