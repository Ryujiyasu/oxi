// ── Taking it back ──────────────────────────────────────────────────────────
//
// An editor without undo is one people use carefully rather than freely, and
// carefully is the wrong way to use a spreadsheet: half of what anyone does to
// one is worth trying to see how it looks. So every action that writes cells
// is bracketed into a step, and a step can be put back.

const undone = [];
const redone = [];
const backButton = document.getElementById('back');
const onButton = document.getElementById('on');

// The keyboard is how anyone actually undoes something, but a control that is
// never shown is a feature people do not know they have.
function markSteps() {
  if (backButton) backButton.disabled = undone.length === 0;
  if (onButton) onButton.disabled = redone.length === 0;
}
// The step being built. While this is a list, every write records what the
// cell held before, so it can be handed back.
let step = null;
// A cap, so a long afternoon does not grow without end. Excel keeps a hundred.
const DEPTH = 100;

/** Run `what` so that everything it writes can be undone in one go. */
function change(what) {
  if (step) { what(); return; }   // already inside a step: do not nest
  step = {
    sheet: shown, cells: [], columns: [], lines: [], panes: [], books: [], merges: [],
  };
  const built = step;
  try {
    what();
  } finally {
    step = null;
  }
  if (built.cells.length === 0 && built.columns.length === 0
    && built.lines.length === 0 && built.panes.length === 0
    && built.books.length === 0 && built.merges.length === 0) return;
  // Whatever was marked for a cut is no longer what the clipboard holds.
  if (cutFrom) cutFrom = null;
  recompute();
  undone.push(built);
  if (undone.length > DEPTH) undone.shift();
  // A fresh change is a fork: what was undone is no longer ahead of us.
  redone.length = 0;
  markSteps();
}

/** Put the cells of `step` back to `side`, and leave them selected. */
function restore(built, side) {
  if (built.sheet !== shown) {
    shown = built.sheet;
    describe();
  }
  const was = step;
  step = null;                    // putting a step back is not itself a step
  // A whole-workbook swap comes first: the cell deltas of the same step, if it
  // somehow had any, are about the workbook this puts back.
  for (let i = (built.books || []).length - 1; i >= 0; i--) {
    book = built.books[i][side];
    beyondValues = true;
  }
  for (let i = built.cells.length - 1; i >= 0; i--) {
    const one = built.cells[i];
    put(one.row, one.col, one[side], side === 'was' ? one.wasStyle : one.nowStyle);
  }
  const sheet = sheetNow();
  // A merge belongs to the sheet it was made on, which need not be the one in
  // front of us — every other slot of a step is read back through `sheetNow`,
  // and this one was written with the sheet it touched.
  for (let i = built.merges.length - 1; i >= 0; i--) {
    const one = built.merges[i];
    one.sheet.merge_cells = one[side];
    beyondValues = true;
  }
  for (let i = built.columns.length - 1; i >= 0; i--) {
    const one = built.columns[i];
    if (sheet) sheet.col_widths[one.col] = one[side];
    beyondValues = true;
  }
  for (let i = built.panes.length - 1; i >= 0; i--) {
    const [rows, cols] = built.panes[i][side];
    if (sheet) {
      sheet.frozen_rows = rows;
      sheet.frozen_cols = cols;
    }
    beyondValues = true;
  }
  for (let i = built.lines.length - 1; i >= 0; i--) {
    const one = built.lines[i];
    const line = sheet && sheet.rows.find((held) => held.index === one.row);
    if (line) {
      line.height = one[side];
      line.custom_height = side === 'was' ? one.wasChosen : one.nowChosen;
    }
    beyondValues = true;
  }
  step = was;
  recompute();
  if ((built.books || []).length > 0) {
    // The sheet is a different shape now, so everything drawn from it has to
    // be worked out again rather than patched.
    weighCalc();
    describe();
  }
  draw();
  sayBands();
  // Show what moved. Excel selects the cells an undo touched, which is the
  // difference between trusting it and hunting for what it did.
  if (built.cells.length === 0) {
    paint();
    return;
  }
  const rows = built.cells.map((one) => one.row);
  const cols = built.cells.map((one) => one.col);
  at = { row: Math.min(...rows), col: Math.min(...cols) };
  anchor = { row: at.row, col: at.col };
  reach = { row: Math.max(...rows), col: Math.max(...cols) };
  paint();
  const holds = heldAt(at.row, at.col);
  formulaBox.value = contentOf(holds);
  if (holds) describeCell(columnName(at.col) + at.row, holds);
  else cellBox.innerHTML = '<dd class="none">empty</dd>';
}

function undo() {
  const built = undone.pop();
  if (!built) return;
  restore(built, 'was');
  redone.push(built);
  markSteps();
}

function redo() {
  const built = redone.pop();
  if (!built) return;
  restore(built, 'now');
  undone.push(built);
  markSteps();
}

for (const [id, run] of [
  ['freeze', freezeHere],
  ['bold', () => toggle('bold')],
  ['italic', () => toggle('italic')],
  ['under', () => toggle('underline')],
  ['left', () => alignTo('left')],
  ['centre', () => alignTo('center')],
  ['right', () => alignTo('right')],
  ['wrap', () => toggle('wrap_text')],
]) {
  const button = document.getElementById(id);
  if (button) button.addEventListener('click', () => { run(); focusGrid(); });
}

if (findBox) {
  findBox.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    sayFound(findNext(findBox.value, event.shiftKey), findBox.value);
  });
}
if (rulesBox) {
  // A menu of actions rather than of states: what the cells are already
  // wearing is not one of the choices, so it goes back to its own name once
  // the choice is made.
  rulesBox.addEventListener('change', () => {
    wearRules(rulesBox.value);
    rulesBox.value = '';
    focusGrid();
  });
}
if (faceBox) {
  // Enter applies it and hands the keyboard back; leaving the box applies it
  // too, since typing a name and clicking away plainly means it.
  faceBox.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    wearFace(faceBox.value);
    focusGrid();
  });
  faceBox.addEventListener('change', () => wearFace(faceBox.value));
}
if (sizeBox) {
  sizeBox.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    wearSize(sizeBox.value);
    focusGrid();
  });
  sizeBox.addEventListener('change', () => wearSize(sizeBox.value));
}
if (inkBox) {
  inkBox.addEventListener('input',
    () => wearInk(inkBox.value.replace('#', '').toUpperCase()));
}
if (autoInkButton) {
  autoInkButton.addEventListener('click', () => { wearInk(null); focusGrid(); });
}
if (mergeBox) {
  // Like the rules menu, a list of actions rather than of states: the name
  // comes back once the choice is made.
  mergeBox.addEventListener('change', () => {
    wearMerge(mergeBox.value);
    mergeBox.value = '';
    focusGrid();
  });
}
if (fillBox) {
  // `input` rather than `change`: a colour picker reports as it is dragged,
  // and seeing the sheet follow is how anyone knows they have the right one.
  fillBox.addEventListener('input', () => wearFill(fillBox.value.replace('#', '').toUpperCase()));
}
if (noFillButton) {
  noFillButton.addEventListener('click', () => { wearFill(null); focusGrid(); });
}
if (formatBox) {
  // Enter applies it and hands the keyboard back to the grid; leaving the box
  // applies it too, since typing a code and clicking away plainly means it.
  formatBox.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    wearFormat(formatBox.value);
    focusGrid();
  });
  formatBox.addEventListener('change', () => wearFormat(formatBox.value));
}
if (addBandButton) {
  addBandButton.addEventListener('click', () => { shiftBand(1); focusGrid(); });
}
if (cutBandButton) {
  cutBandButton.addEventListener('click', () => { shiftBand(-1); focusGrid(); });
}
if (backButton) backButton.addEventListener('click', () => { undo(); focusGrid(); });
if (onButton) onButton.addEventListener('click', () => { redo(); focusGrid(); });

// After pressing a control, the keyboard belongs to the sheet again — nobody
// wants their next arrow key to move between buttons.
function focusGrid() {
  if (sheetBox) sheetBox.focus();
}

// ── Selecting more than one cell ────────────────────────────────────────────
//
// A sheet where you can only ever be on one cell is a form. Everything people
// actually do with a spreadsheet — total a column, copy a block into an email,
// paste a table someone sent — starts by selecting a range, so the range is
// what the rest of this hangs off.

// A selection needs three cells, not two, and conflating any pair of them
// gives a grid that feels almost right. `anchor` is the corner it was started
// from and `reach` is the corner being dragged; the block is the rectangle
// between them. `at` — declared with the rest of the cursor state below — is
// the ACTIVE cell: the white one inside the block that takes what you type and
// that the formula bar describes. Drag A1 to C5 in Excel and your typing still
// goes into A1, because extending a selection moves `reach` and leaves `at`
// where it was.
let anchor = { row: 1, col: 0 };
let reach = { row: 1, col: 0 };
// True only while the mouse is down and dragging out a range, which is the one
// time Excel shows the size instead of the address in the name box.
let dragging = false;
// Set while a drag started on a header, so the drag takes whole columns or
// whole rows rather than the cells the pointer happens to cross.
let headDrag = null;

const countBox = document.getElementById('tally');

function region() {
  return {
    top: Math.min(anchor.row, reach.row),
    left: Math.min(anchor.col, reach.col),
    bottom: Math.max(anchor.row, reach.row),
    right: Math.max(anchor.col, reach.col),
  };
}

function spread() {
  const box = region();
  return box.top !== box.bottom || box.left !== box.right;
}

function eachInRegion(visit) {
  const box = region();
  for (let row = box.top; row <= box.bottom; row++) {
    for (let col = box.left; col <= box.right; col++) visit(row, col);
  }
}

// Fifteen significant digits, which is the precision Excel works to. Fewer
// throws away real value — a third of sixteen is 5.33333333333333, and cutting
// it at ten decimals would be a different number. More keeps the tail that
// binary floating point leaves behind: a tenth plus two tenths is not three
// tenths in a double, and nobody wants to be shown that.
function trim(value) {
  return String(Number(value.toPrecision(15)));
}

// Excel's status bar: how many cells hold something, and — when any of them are
// numbers — what they come to. It is the fastest way to check a column without
// writing a formula anywhere, which is most of what it gets used for.
function tally() {
  if (!countBox) return;
  if (!spread()) { countBox.textContent = ''; return; }
  let held = 0;
  let numbers = 0;
  let sum = 0;
  eachInRegion((row, col) => {
    const cell = heldAt(row, col);
    const text = contentOf(cell);
    if (text === '') return;
    held++;
    const value = cell && typeof cell.value === 'object' && cell.value !== null
      ? cell.value.Number
      : undefined;
    if (typeof value === 'number') { numbers++; sum += value; }
  });
  const parts = [`Count ${held}`];
  if (numbers > 0) {
    parts.unshift(`Sum ${trim(sum)}`);
    parts.unshift(`Average ${trim(sum / numbers)}`);
  }
  countBox.textContent = parts.join('   ');
}

function takeColumn(col, extend) {
  if (!extend) { at = { row: 1, col }; anchor = { row: 1, col }; }
  goTo(extent().rows, col, false, true);
}

function takeRow(row, extend) {
  if (!extend) { at = { row, col: 0 }; anchor = { row, col: 0 }; }
  goTo(row, extent().cols, false, true);
}

function takeAll() {
  const bounds = extent();
  at = { row: 1, col: 0 };
  anchor = { row: 1, col: 0 };
  goTo(bounds.rows, bounds.cols, false, true);
}

// Set while a column's edge is being dragged. Excel resizes as you pull rather
// than on release, so the sheet reflows under the pointer and you can see what
// you are choosing.
let sizing = null;
// How close to the edge counts as being on it.
const EDGE = 4;


/** Show a column at `pixels` wide without writing anything down yet. */
function showWidth(col, pixels) {
  if (!geom || col > geom.lastCol) return;
  // The sheet is not written to until the drag ends; the width is put into
  // the geometry alone, so the repaint shows it and undo has nothing to say.
  const was = geom.cols[col + 1] - geom.cols[col];
  const now = Math.max(0, Math.round(pixels));
  for (let after = col + 1; after < geom.cols.length; after += 1) {
    geom.cols[after] += now - was;
  }
  geom.across = geom.cols[geom.lastCol + 1];
  paintSheet();
}

/** Write the dragged width into the sheet. */
function setWidth(col, pixels) {
  const sheet = sheetNow();
  if (!sheet) return;
  const width = widthForPixels(pixels);
  const was = sheet.col_widths[col] || 0;
  if (Math.abs(width - was) < 1e-6) return;
  change(() => {
    if (step) step.columns.push({ col, was, now: width });
    while (sheet.col_widths.length <= col) sheet.col_widths.push(0);
    sheet.col_widths[col] = width;
    beyondValues = true;
  });
  draw();
  paint();
}


/** Show a row at `pixels` tall without writing anything down yet. */
function showHeight(row, pixels) {
  if (!geom || row > geom.lastRow) return;
  const was = geom.tops[row + 1] - geom.tops[row];
  const now = Math.max(0, Math.round(pixels));
  for (let after = row + 1; after < geom.tops.length; after += 1) {
    geom.tops[after] += now - was;
  }
  geom.down = geom.tops[geom.lastRow + 1];
  paintSheet();
}

/** Write the dragged height into the sheet. */
function setHeight(row, pixels) {
  const sheet = sheetNow();
  if (!sheet) return;
  // The file states a height in points; the drag is in pixels.
  const points = Math.max(0, pixels) * 72 / 96;
  let line = sheet.rows.find((one) => one.index === row);
  const was = line ? line.height : null;
  const wasChosen = line ? Boolean(line.custom_height) : false;
  if (was !== null && Math.abs(points - was) < 1e-6 && wasChosen) return;
  change(() => {
    if (!line) {
      line = { index: row, cells: [], height: null };
      sheet.rows.push(line);
      sheet.rows.sort((a, b) => a.index - b.index);
    }
    if (step) {
      step.lines.push({ row, was, wasChosen, now: points, nowChosen: true });
    }
    line.height = points;
    // A drag is a choice, and the flag is what stops Excel working the height
    // out again the next time the file is opened.
    line.custom_height = true;
    beyondValues = true;
  });
  draw();
  paint();
}


function paint() {
  // Whether whole rows or whole columns are selected decides whether Insert
  // and Delete mean anything, and that changes with every movement.
  sayBands();
  sayFormat();
  sayFill();
  sayFace();
  if (rulesBox) rulesBox.disabled = !book;
  if (findBox) findBox.disabled = !book;
  // Merging needs more than one cell, and unmerging needs one that is already
  // merged; with a single unmerged cell picked the menu has nothing to offer.
  if (mergeBox) {
    const sheet = sheetNow();
    mergeBox.disabled = !sheet || (!spread() && mergesMet(sheet).length === 0);
  }
  // The block is painted rather than dressed in classes, so moving the cursor
  // repaints what is on screen: at a few thousand visible cells that is one
  // frame, and it keeps one description of the sheet rather than two.
  reveal(reach.row, reach.col);
  paintSheet();
  const box = region();
  whereBox.textContent = dragging || headDrag
    ? `${box.bottom - box.top + 1}R x ${box.right - box.left + 1}C`
    : columnName(at.col) + at.row;
  tally();
}

// ── Dragging the corner ─────────────────────────────────────────────────────
//
// The small square on the bottom-right of a selection is the fill handle, and
// pulling it is how most spreadsheet work actually gets done: number a column,
// carry a formula down a table, repeat a heading.
//
// It looks like one gesture and is several rules, and Excel picks between them
// by what was selected. Measured with `tools/metrics/_xlsx_fill_series.py`,
// which pulls each shape of selection down a real sheet and reads back what
// landed:
//
//     [5]            -> 5, 5, 5          a lone number repeats
//     [1, 2]         -> 3, 4, 5          two set the step
//     [1, 2, 4]      -> 5.33, 6.83       a line fitted through them, not the last gap
//     ['Item 1']     -> Item 2, Item 3   trailing digits count up
//     ['a', 'b']     -> a, b, a, b       with no series in it, the block repeats
//     ['Mon']        -> Tue, Wed         a list Excel knows continues
//     [1, 'a']       -> 1, a, 2, a, 3    and here is the rule behind all of it
//
// That last one is the shape of the whole thing. Excel does not read the
// selection as one series: it splits it into runs of neighbouring cells of the
// same kind, and continues each run on its own, at its own stride. So the `1`
// and the `a` interleave, each following its own rule — and a number that would
// repeat when selected alone counts up when it sits in a block, because then it
// is a run being continued rather than a cell being copied.

// Set while the handle is being pulled; holds where the pull started.
let filling = null;

// The lists Excel continues rather than repeats, read out of Excel itself with
// `Application.GetCustomListContents` rather than guessed at. This install
// carries eleven; a Japanese Excel knows the weekdays and months twice over,
// the old month names, the zodiac and the ten stems.
const LISTS = [
  ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
  ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
   'September', 'October', 'November', 'December'],
  ['日', '月', '火', '水', '木', '金', '土'],
  ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'],
  ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
  ['第1四半期', '第2四半期', '第3四半期', '第4四半期'],
  ['睦月', '如月', '弥生', '卯月', '皐月', '水無月', '文月', '葉月', '長月',
   '神無月', '霜月', '師走'],
  ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'],
  ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'],
];

// A trailing run of digits counts up and everything before it is kept, so
// "Item 1" becomes "Item 2". The digits have to be at the END: "2026年度" has
// none there and is left alone.
const TAIL = /^(.*?)(\d+)$/;

/** Wrap `index` into `length`, for indices that run off either end. */
function wrapped(index, length) {
  return ((index % length) + length) % length;
}

function numberOf(cell) {
  if (!cell || cell.formula) return null;
  const value = typeof cell.value === 'object' && cell.value !== null
    ? cell.value.Number
    : undefined;
  return typeof value === 'number' ? value : null;
}

// Excel fits a straight line through the selected numbers rather than taking
// the last gap: 1, 2, 4 continues 5.33, not 6. With evenly spaced values the
// two agree, which is why the difference goes unnoticed until they are not.
function fitLine(values) {
  const n = values.length;
  if (n === 1) return { slope: 0, base: values[0] };
  let sumX = 0;
  let sumY = 0;
  let sumXY = 0;
  let sumXX = 0;
  for (let i = 0; i < n; i++) {
    sumX += i;
    sumY += values[i];
    sumXY += i * values[i];
    sumXX += i * i;
  }
  const under = n * sumXX - sumX * sumX;
  const slope = under === 0 ? 0 : (n * sumXY - sumX * sumY) / under;
  return { slope, base: (sumY - slope * sumX) / n };
}

// What kind of thing a cell is, finely enough to say whether it belongs in the
// same run as its neighbour. Number and text is not fine enough: "Item 1" and
// "a" are both text, and Excel counts the first up while repeating the second,
// so they cannot be one run. Two numbered texts DO join, but only when they
// share a prefix — which is what makes them a series rather than a coincidence.
// What a number's format says it IS, as the step it moves by when it is
// filled on its own. Excel's format codes settle it: a `y` or a `d` outside
// quotes makes it a date, an `h` or an `s` without them a time. An `m` alone is
// no help — it means a month beside y and d, and minutes beside h.
//
// Measured: a lone date moves a day (46052 -> 46053), a lone time an hour
// (10:30 -> 11:30), where a lone plain number would just repeat.
function unitOf(cell) {
  const format = cell && cell.style && cell.style.number_format;
  if (!format) return null;
  const bare = format.replace(/"[^"]*"/g, '').replace(/\\./g, '');
  if (/[yd]/i.test(bare)) return 1;
  if (/[hs]/i.test(bare)) return 1 / 24;
  return null;
}

// Excel counts days from the last day of 1899, so that 1 January 1900 is day
// one. Everything here works in UTC: a fill that changed the answer between
// one side of midnight and the other would be a fine way to lose a day.
const DAY = 86400000;
const EPOCH = Date.UTC(1899, 11, 30);

const asDate = (serial) => new Date(EPOCH + serial * DAY);
const asSerial = (year, month, day) =>
  Math.round((Date.UTC(year, month, day) - EPOCH) / DAY);
const monthLength = (year, month) => new Date(Date.UTC(year, month + 1, 0)).getUTCDate();

/**
 * The calendar-month series running through `serials`, or null for anything
 * else.
 *
 * Two things have to hold. The dates must all fall on the same day of the
 * month, or all be the last day of theirs — a 29-day gap that happens to end
 * on 28 February is not a month, and Excel does not treat it as one. And the
 * months between them must be evenly spaced, by some number that is not zero:
 * two dates in the same month are a gap in days, not in months.
 */
function monthSeries(serials) {
  if (serials.length < 2) return null;
  // Only whole days. A serial with a time on it is a different question and
  // was not measured, so it goes down the ordinary numeric path.
  if (serials.some((one) => !Number.isInteger(one))) return null;
  const dates = serials.map(asDate);
  const days = dates.map((one) => one.getUTCDate());
  const ends = dates.map((one) =>
    one.getUTCDate() === monthLength(one.getUTCFullYear(), one.getUTCMonth()));
  const sameDay = days.every((one) => one === days[0]);
  if (!sameDay && !ends.every(Boolean)) return null;

  const months = dates.map((one) => one.getUTCFullYear() * 12 + one.getUTCMonth());
  const step = months[1] - months[0];
  if (step === 0) return null;
  for (let at = 1; at < months.length; at++) {
    if (months[at] - months[at - 1] !== step) return null;
  }
  return { from: months[0], step, day: days[0] };
}

/** The serial a month series holds at `index`, counting from its first date. */
function monthAt(plan, index) {
  const reach = plan.from + plan.step * index;
  const year = Math.floor(reach / 12);
  const month = reach - year * 12;
  // The first date's day of the month, as far as this month allows: 31 January
  // gives 30 April, and 31 May again after it.
  return asSerial(year, month, Math.min(plan.day, monthLength(year, month)));
}

function kindOf(cell) {
  if (cell && cell.formula) return 'formula';
  if (numberOf(cell) !== null) return 'number';
  const text = contentOf(cell);
  const found = inList(text);
  if (found) return 'list:' + LISTS.indexOf(found.list);
  const parts = TAIL.exec(text);
  return parts ? 'counted:' + parts[1] : 'text';
}

/** Split a line of cells into runs of neighbours of the same kind. */
function runsOf(line) {
  const out = [];
  line.forEach((cell, at) => {
    const kind = kindOf(cell);
    const last = out[out.length - 1];
    if (last && last.kind === kind) last.cells.push(cell);
    else out.push({ kind, at, cells: [cell] });
  });
  return out;
}

/** The list holding `text`, and where in it, or null. */
function inList(text) {
  for (const list of LISTS) {
    const at = list.indexOf(text);
    if (at >= 0) return { list, at };
  }
  return null;
}

/**
 * Work out how a run carries on, once, so that asking for the value at each
 * index afterwards is only arithmetic.
 *
 * `alone` is true when the whole selection is a single cell, which is the one
 * case where a number is copied rather than counted up.
 */
function planRun(run, alone) {
  const kind = run.kind.split(':')[0];
  if (kind === 'number') {
    const values = run.cells.map(numberOf);
    // Dates a whole number of months apart are a calendar series rather than a
    // straight line, and the difference is not small: 31 Jan and 28 Feb
    // continue 31 Mar under one rule and 28 Mar under the other.
    if (values.length > 1 && unitOf(run.cells[0]) === 1) {
      const months = monthSeries(values);
      if (months) return { kind: 'months', months, style: run.cells[0].style };
    }
    const line = fitLine(values);
    if (values.length === 1) {
      // A single number in a block still counts up, by one — measured on
      // [2, 'a'], which gives 3 and 4, not 3 and 5 or 2 and 2. A date or a
      // time counts up even on its own, by its own unit.
      const unit = unitOf(run.cells[0]);
      line.slope = unit !== null ? unit : (alone ? 0 : 1);
    }
    return { kind: 'number', line, style: run.cells[0].style };
  }
  if (kind === 'formula') {
    return { kind: 'formula', cells: run.cells, style: run.cells[0].style };
  }
  const texts = run.cells.map((cell) => contentOf(cell));
  if (kind === 'list') {
    // Members of one list carry on along it, so long as they sit at an even
    // stride within it; anything else is not a series and simply repeats.
    const found = texts.map(inList);
    const first = found[0];
    const stride = found.length > 1
      ? wrapped(found[1].at - first.at, first.list.length)
      : 1;
    if (found.every((one, i) =>
      wrapped(one.at - first.at, first.list.length) === i * stride)) {
      return { kind: 'list', list: first.list, at: first.at, stride,
               style: run.cells[0].style };
    }
  }
  {
    // Text that differs only in the digits it ends with is a series in those
    // digits: Item 1, Item 2 carries on to Item 3.
    const parts = texts.map((text) => TAIL.exec(text));
    if (parts.every((one) => one) && parts.every((one) => one[1] === parts[0][1])) {
      const line = fitLine(parts.map((one) => Number(one[2])));
      // Numbered text always counts up, even on its own — "Item 1" pulled down
      // gives Item 2, where a lone `1` would have given 1. The digits are what
      // make it a series, so there is nothing for a single one to be ambiguous
      // about.
      if (parts.length === 1) line.slope = 1;
      return {
        kind: 'counted',
        before: parts[0][1],
        width: parts[0][2].length,
        padded: parts[0][2].startsWith('0'),
        line,
        style: run.cells[0].style,
      };
    }
  }
  return { kind: 'repeat', texts, style: run.cells[0].style };
}

/** What a planned run holds at `index`, counting from its own first cell. */
function runValue(plan, index, spot, source) {
  if (plan.kind === 'months') return String(monthAt(plan.months, index));
  if (plan.kind === 'number') return trim(plan.line.base + plan.line.slope * index);
  if (plan.kind === 'list') {
    return plan.list[wrapped(plan.at + index * plan.stride, plan.list.length)];
  }
  if (plan.kind === 'counted') {
    const next = Math.round(plan.line.base + plan.line.slope * index);
    const digits = String(next);
    // A number written with leading zeros keeps its width: 001 goes to 002.
    return plan.before + (plan.padded ? digits.padStart(plan.width, '0') : digits);
  }
  if (plan.kind === 'repeat') {
    return plan.texts[wrapped(index, plan.texts.length)];
  }
  const cell = plan.cells[wrapped(index, plan.cells.length)];
  if (!cell) return '';
  try {
    return '=' + translate_formula('=' + cell.formula,
      spot.row - source.row, spot.col - source.col);
  } catch (error) {
    // A formula the engine cannot read is left exactly as it was rather than
    // moved by guesswork: a reference that should have moved and did not is
    // easier to notice than one moved wrongly.
    return '=' + cell.formula;
  }
}

/** The values of the selected block, read column by column or row by row. */
function seriesOf(box, down) {
  const out = [];
  if (down) {
    for (let col = box.left; col <= box.right; col++) {
      const line = [];
      for (let row = box.top; row <= box.bottom; row++) line.push(heldAt(row, col));
      out.push(line);
    }
  } else {
    for (let row = box.top; row <= box.bottom; row++) {
      const line = [];
      for (let col = box.left; col <= box.right; col++) line.push(heldAt(row, col));
      out.push(line);
    }
  }
  return out;
}

/**
 * Everything one line of the block puts into the cells beyond it.
 *
 * `steps` cells are filled, and `q` counts on from the block: the cell just
 * past it is `q = length`, and pulling backwards runs `q` negative. Which
 * position of the block that lands on, and which turn round it is, together
 * say which run answers and at what index.
 */
function fillLine(line, steps, forwards, place) {
  const runs = runsOf(line);
  const plans = runs.map((run) => planRun(run, line.length === 1));
  const written = [];
  for (let step = 1; step <= steps; step++) {
    const q = forwards ? line.length - 1 + step : -step;
    const seat = wrapped(q, line.length);
    const turn = Math.floor(q / line.length);
    const which = runs.findIndex((run, i) =>
      seat >= run.at && seat < run.at + run.cells.length);
    const run = runs[which];
    const spot = place(step);
    const index = turn * run.cells.length + (seat - run.at);
    const source = place(step, run.at + wrapped(index, run.cells.length) - seat);
    written.push({
      spot,
      text: runValue(plans[which], index, spot, source),
      style: plans[which].style,
    });
  }
  return written;
}

/** Fill from the selection out to `row`/`col`, whichever direction that is. */
function fillTo(row, col) {
  const box = region();
  const below = row > box.bottom || row < box.top;
  const beside = col > box.right || col < box.left;
  if (!below && !beside) return;
  // One direction at a time, the way the handle behaves: whichever the pointer
  // has travelled further along wins.
  const down = below
    && (!beside || Math.abs(row - box.bottom) >= Math.abs(col - box.right));
  const forwards = down ? row > box.bottom : col > box.right;
  const steps = down
    ? (forwards ? row - box.bottom : box.top - row)
    : (forwards ? col - box.right : box.left - col);
  if (steps <= 0) return;

  const lines = seriesOf(box, down);
  change(() => {
    lines.forEach((line, which) => {
      // Where the cell filled at `step` sits, and — with `back` — where in the
      // block the value it copies came from.
      const place = (step, back) => down
        ? {
          row: back === undefined
            ? (forwards ? box.bottom + step : box.top - step)
            : box.top + back,
          col: box.left + which,
        }
        : {
          row: box.top + which,
          col: back === undefined
            ? (forwards ? box.right + step : box.left - step)
            : box.left + back,
        };
      for (const { spot, text, style } of fillLine(line, steps, forwards, place)) {
        put(spot.row, spot.col, text, style);
      }
    });
  });
  draw();
  // The filled cells join the selection, so the whole run is there to be
  // pulled again or taken back.
  if (down) {
    anchor = { row: forwards ? box.top : row, col: box.left };
    at = { row: anchor.row, col: anchor.col };
    goTo(forwards ? row : box.bottom, box.right, false, true);
  } else {
    anchor = { row: box.top, col: forwards ? box.left : col };
    at = { row: anchor.row, col: anchor.col };
    goTo(box.bottom, forwards ? col : box.right, false, true);
  }
}

// ── Carrying cells in and out ───────────────────────────────────────────────
//
// Tab-separated text is what every spreadsheet puts on the clipboard and what
// every one of them reads back, so a range copied here lands in Excel as cells
// rather than as one long line, and a block copied from Excel arrives here the
// same way. The HTML flavour goes alongside because that is what Excel reaches
// for first when it is the one pasting.

function fieldOf(text) {
  // A field holding a tab, a newline or a quote has to be quoted, or the other
  // end will read the one cell as several.
  return /[\t\n\r"]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}

function selectionText() {
  const box = region();
  const lines = [];
  for (let row = box.top; row <= box.bottom; row++) {
    const cells = [];
    for (let col = box.left; col <= box.right; col++) {
      cells.push(fieldOf(contentOf(heldAt(row, col))));
    }
    lines.push(cells.join('\t'));
  }
  return lines.join('\n');
}

function selectionHtml() {
  const box = region();
  const safe = (text) => text.replace(/[&<>]/g, (one) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
  })[one]);
  const lines = [];
  for (let row = box.top; row <= box.bottom; row++) {
    const cells = [];
    for (let col = box.left; col <= box.right; col++) {
      cells.push('<td>' + safe(contentOf(heldAt(row, col))) + '</td>');
    }
    lines.push('<tr>' + cells.join('') + '</tr>');
  }
  return '<table>' + lines.join('') + '</table>';
}

// Split pasted text back into a grid, honouring the quoting above: a quoted
// field may itself contain tabs and newlines, and splitting on the separators
// alone would tear such a cell into pieces.
function asGrid(text) {
  const rows = [[]];
  let field = '';
  let quoted = false;
  let seen = 0;
  const push = () => { rows[rows.length - 1].push(field); field = ''; };
  while (seen < text.length) {
    const ch = text[seen];
    if (quoted) {
      if (ch === '"' && text[seen + 1] === '"') { field += '"'; seen += 2; continue; }
      if (ch === '"') { quoted = false; seen++; continue; }
      field += ch;
      seen++;
      continue;
    }
    if (ch === '"' && field === '') { quoted = true; seen++; continue; }
    if (ch === '\t') { push(); seen++; continue; }
    if (ch === '\r' || ch === '\n') {
      push();
      rows.push([]);
      seen += ch === '\r' && text[seen + 1] === '\n' ? 2 : 1;
      continue;
    }
    field += ch;
    seen++;
  }
  push();
  // A trailing newline is a line ending, not an empty last row.
  const last = rows[rows.length - 1];
  if (rows.length > 1 && last.length === 1 && last[0] === '') rows.pop();
  return rows;
}

/**
 * Write `grid` into the sheet from the selection.
 *
 * `moving` is the block a cut marked, when this paste is completing one. The
 * cells it names have already been emptied, but their styles are wanted at the
 * far end: cutting a column of dates and pasting it somewhere else should not
 * turn them into serial numbers on the way.
 */
function pasteGrid(grid, moving) {
  if (grid.length === 0) return;
  const box = region();
  // One value into a selected block fills the block — the way it does in Excel,
  // and the reason anyone selects a block before pasting one thing.
  const single = grid.length === 1 && grid[0].length === 1;
  if (single && spread()) {
    change(() => eachInRegion((row, col) => put(row, col, grid[0][0])));
    draw();
    paint();
    return;
  }
  const top = single ? at.row : box.top;
  const left = single ? at.col : box.left;
  change(() => grid.forEach((line, down) => {
    line.forEach((text, across) => {
      put(top + down, left + across, text,
        moving ? moving.styles.get(`${down},${across}`) : undefined);
    });
  }));
  draw();
  const wide = Math.max(...grid.map((line) => line.length));
  at = { row: top, col: left };
  anchor = { row: top, col: left };
  goTo(top + grid.length - 1, left + wide - 1, false, true);
}

function clearSelection() {
  change(() => eachInRegion((row, col) => put(row, col, '')));
  draw();
  paint();
}

function busyElsewhere() {
  return !book || editor || document.activeElement === formulaBox;
}

document.addEventListener('copy', (event) => {
  if (busyElsewhere()) return;
  event.clipboardData.setData('text/plain', selectionText());
  event.clipboardData.setData('text/html', selectionHtml());
  event.preventDefault();
});

// The block a cut has marked, or null. A cut takes nothing away: it says
// which cells are going to move, and they move when they are pasted. Escape
// calls it off, and so does anything else that writes to the sheet — which is
// what makes cutting something you can change your mind about.
let cutFrom = null;

document.addEventListener('cut', (event) => {
  if (busyElsewhere()) return;
  event.clipboardData.setData('text/plain', selectionText());
  event.clipboardData.setData('text/html', selectionHtml());
  event.preventDefault();
  // The formatting travels with the cells. Cutting a column of dates and
  // pasting it elsewhere should not turn them into serial numbers on the way,
  // and by the time the paste runs the source has already been emptied.
  const box = region();
  const styles = new Map();
  for (let row = box.top; row <= box.bottom; row++) {
    for (let col = box.left; col <= box.right; col++) {
      const held = heldAt(row, col);
      if (held) styles.set(`${row - box.top},${col - box.left}`, { ...held.style });
    }
  }
  cutFrom = { sheet: shown, ...box, styles };
  paint();
});

/** Take the dashed border away; the cells it was round stay where they are. */
function dropCut() {
  if (!cutFrom) return;
  cutFrom = null;
  paint();
}

document.addEventListener('paste', (event) => {
  if (busyElsewhere()) return;
  const text = event.clipboardData.getData('text/plain');
  if (!text) return;
  event.preventDefault();
  // A cut and its paste are one action: the cells arrive and the ones they
  // came from empty, and taking that back has to undo both halves at once.
  const moving = cutFrom && cutFrom.sheet === shown ? cutFrom : null;
  cutFrom = null;
  change(() => {
    if (moving) {
      for (let row = moving.top; row <= moving.bottom; row++) {
        for (let col = moving.left; col <= moving.right; col++) put(row, col, '');
      }
    }
    pasteGrid(asGrid(text), moving);
  });
  paint();
});

// ── Keeping what was typed ──────────────────────────────────────────────────
//
// An edit you cannot save is not an edit. The file is patched rather than
// rewritten: `edit_xlsx` opens the bytes that arrived, changes the cells it is
// told about and hands the archive back, so the parts nobody touched come
// through untouched.

const saveButton = document.getElementById('save');

// The type has to travel with the value, because the same text means different
// things: `=A1` is a formula, `12` a number, `12a` text, and an empty box
// means clear the cell rather than write the empty string into it.
function edited(text) {
  if (text === '') return { value_type: 'empty', new_value: '' };
  if (text.startsWith('=')) return { value_type: 'formula', new_value: text };
  if (text.trim() !== '' && Number.isFinite(Number(text))) {
    return { value_type: 'number', new_value: text };
  }
  return { value_type: 'string', new_value: text };
}

// What each cell held before this session first wrote to it. A cell put back
// to that has nothing to save, whether by hand or by undo, and counting it
// would claim an edit the file does not need.
const pristine = new Map();

function remember(row, col, text, before) {
  const key = `${shown},${row},${col}`;
  if (!pristine.has(key)) pristine.set(key, before);
  if (pristine.get(key) === text) changes.delete(key);
  else changes.set(key, { sheet_index: shown, row, col, ...edited(text) });
  markSaved();
}

function markSaved() {
  if (!saveButton) return;
  const count = changes.size;
  // A column's width and a cell's formatting are changes with no cell value
  // behind them, so counting values alone would leave the button dark with
  // work outstanding.
  saveButton.disabled = count === 0 && !beyondValues;
  saveButton.textContent = count === 0
    ? 'Save'
    : `Save (${count} cell${count === 1 ? '' : 's'})`;
}

async function save() {
  if (!source || changes.size === 0) return;
  const was = saveButton.textContent;
  saveButton.disabled = true;
  saveButton.textContent = 'Saving…';
  try {
    // Values alone go by the narrow path, which patches only the cells named.
    // Once formatting has moved, the whole workbook has to cross, because a
    // list of values has nowhere to say what a cell should look like.
    const written = beyondValues
      ? edit_xlsx_from_workbook(source, book)
      : edit_xlsx(source, [...changes.values()]);
    const blob = new Blob([written], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName.replace(/\.xlsx$/i, '') + '-edited.xlsx';
    link.click();
    URL.revokeObjectURL(link.href);
    // What was saved is now what the file holds: the next save starts from
    // the bytes just written, so two saves in a row do not send the first
    // batch of edits twice.
    source = written;
    changes.clear();
    pristine.clear();
    beyondValues = false;
    markSaved();
  } catch (error) {
    saveButton.textContent = was;
    saveButton.disabled = false;
    stateBox.style.display = 'block';
    stateBox.textContent = `Oxi could not save: ${error}`;
  }
}

if (saveButton) saveButton.addEventListener('click', save);

// Nothing here is written to disk until Save is pressed, so leaving with edits
// outstanding loses them. The browser will only show its own wording, but it
// will show it.
window.addEventListener('beforeunload', (event) => {
  if (changes.size === 0) return;
  event.preventDefault();
  event.returnValue = '';
});

// ── Living in the grid ──────────────────────────────────────────────────────
//
// What separates a sheet from a table is that you never reach for the mouse.
// The cell you are on takes what you type, the arrows walk it, and Enter puts
// the value in and steps down ready for the next one. Excel's habits here are
// specific enough that getting them nearly right feels wrong, so they are
// spelled out rather than approximated.

let at = { row: 1, col: 0 };
// Where a run of Tabs began. Excel remembers it: Tab across three cells, press
// Enter, and you land under the cell you STARTED tabbing from, not under the
// last one. It is what makes filling in a row of a form feel like a form.
let tabHome = null;
let editor = null;

const whereBox = document.getElementById('where');
const formulaBox = document.getElementById('formula');

/** Whether there is a grid on screen to talk about. */
function tableNow() {
  return geom;
}

function sheetNow() {
  return book && book.sheets && book.sheets[shown];
}

function heldAt(row, col) {
  const sheet = sheetNow();
  if (!sheet) return undefined;
  const line = sheet.rows.find((one) => one.index === row);
  return line && line.cells.find((one) => one.col === col);
}

// What the formula bar shows: the formula if there is one, else what is
// STORED — not what is displayed. A date shows as a date in the grid and as
// its own number here, which is the distinction Excel draws too.
function contentOf(cell) {
  if (!cell) return '';
  if (cell.formula) return '=' + cell.formula;
  const raw = typeof cell.value === 'object' && cell.value !== null
    ? Object.values(cell.value)[0]
    : (cell.value === 'Empty' ? '' : cell.value);
  return raw === undefined || raw === null ? '' : String(raw);
}

function extent() {
  if (!geom) return { rows: 1, cols: 0 };
  return { rows: geom.lastRow, cols: geom.lastCol };
}

// `extend` keeps the anchor where it is and drags the far corner of the
// selection to the new cell, which is what Shift does to every movement key.
function goTo(row, col, keepTabHome, extend) {
  const bounds = extent();
  const spot = {
    row: Math.min(Math.max(1, row), bounds.rows),
    col: Math.min(Math.max(0, col), bounds.cols),
  };
  reach = { row: spot.row, col: spot.col };
  if (!extend) {
    at = { row: spot.row, col: spot.col };
    anchor = { row: spot.row, col: spot.col };
  }
  if (!keepTabHome) tabHome = null;
  if (!geom) return;
  paint();
  // The panel and the formula bar always describe the ACTIVE cell, not the
  // range: with a block selected it is still one cell you are about to type
  // into, and showing the block's first cell instead would be a lie about
  // where the next keystroke lands.
  const held = heldAt(at.row, at.col);
  formulaBox.value = contentOf(held);
  if (held) describeCell(columnName(at.col) + at.row, held);
  else cellBox.innerHTML = '<dd class="none">empty</dd>';
}

// Ctrl with an arrow runs to the edge of the block you are in: to the last
// written cell if you are on written ground, else to the next written one.
// It is how anyone moves about a large sheet, and stepping a row at a time is
// not the same thing.
function runTo(dRow, dCol, extend) {
  const bounds = extent();
  let row = extend ? reach.row : at.row;
  let col = extend ? reach.col : at.col;
  const filled = (r, c) => contentOf(heldAt(r, c)) !== '';
  const started = filled(row + dRow, col + dCol);
  let moved = false;
  for (;;) {
    const nextRow = row + dRow;
    const nextCol = col + dCol;
    if (nextRow < 1 || nextRow > bounds.rows || nextCol < 0 || nextCol > bounds.cols) break;
    if (started && !filled(nextRow, nextCol)) break;
    row = nextRow;
    col = nextCol;
    moved = true;
    if (!started && filled(row, col)) break;
  }
  if (moved) goTo(row, col, false, extend);
}

// Typing over a cell replaces it; F2 opens it with what is already there.
function edit(seed) {
  if (editor || !geom) return;
  reveal(at.row, at.col);
  paintSheet();
  const rect = rectOf(at.row, at.col);
  const input = document.getElementById('entry');
  if (!rect || !input) return;
  const held = heldAt(at.row, at.col);
  const style = (held && held.style) || {};
  input.style.display = 'block';
  // The box sits exactly where the cell is, in the cell's own face, so what
  // is typed is where it will land rather than somewhere near it.
  input.style.left = `${sheetBox.scrollLeft + rect.x}px`;
  input.style.top = `${sheetBox.scrollTop + rect.y}px`;
  input.style.width = `${Math.max(40, rect.w)}px`;
  input.style.height = `${Math.max(16, rect.h)}px`;
  input.style.font = fontOf(style);
  input.style.textAlign = style.horizontal_align === 'right' ? 'right'
    : style.horizontal_align === 'center' ? 'center' : 'left';
  input.value = seed === null ? contentOf(held) : seed;
  editor = { input, row: at.row, col: at.col };
  input.focus();
  if (seed === null) input.select();
  else input.setSelectionRange(input.value.length, input.value.length);
}

// Put the typed text into the sheet. Excel decides then and there whether it
// is a number: `12` right-aligns, `12a` does not, and for most people that is
// the only sign a column will add up.
function put(row, col, text, style) {
  const sheet = sheetNow();
  if (!sheet) return;
  const holding = heldAt(row, col);
  const before = contentOf(holding);
  // A cell that was not there wore the empty style, not "no style": undo has
  // to be able to put a cell back to bare, and `undefined` here would mean
  // leave whatever it is wearing alone.
  const wasStyle = holding ? holding.style : {};
  // A fill hands over the style of the cell it copied from; everything else
  // leaves whatever the cell already wore.
  const nowStyle = style === undefined ? wasStyle : style;
  if (before === text && sameStyle(wasStyle, nowStyle)) return;
  if (step) step.cells.push({ row, col, was: before, now: text, wasStyle, nowStyle });
  let line = sheet.rows.find((one) => one.index === row);
  if (!line) {
    line = { index: row, cells: [], height: null };
    sheet.rows.push(line);
    sheet.rows.sort((a, b) => a.index - b.index);
  }
  let cell = line.cells.find((one) => one.col === col);
  if (!cell) {
    cell = { col: col, value: 'Empty', style: {}, formula: null, runs: [] };
    line.cells.push(cell);
    line.cells.sort((a, b) => a.col - b.col);
  }
  // Only when the text has actually changed. Working out afresh what a cell
  // holds from the text it shows is lossy — a cell holding the string "007"
  // shows "007" and would come back as the number seven — so changing only a
  // cell's look must not send it round that loop.
  if (before !== text) {
    cell.formula = text.startsWith('=') ? text.slice(1) : null;
    if (cell.formula) anyFormulas = true;
    if (cell.formula) cell.value = { String: '' };
    else if (text === '') cell.value = 'Empty';
    else if (text.trim() !== '' && Number.isFinite(Number(text))) {
      cell.value = { Number: Number(text) };
    } else cell.value = { String: text };
  }
  if (style !== undefined) {
    cell.style = { ...style };
    // Only the wide save path carries a cell's style, and it costs a crossing
    // of the whole workbook, so it is taken only when a style has actually
    // moved. Without it a filled date saves as the bare number underneath it.
    beyondValues = true;
  }
  remember(row, col, text, before);
}

/**
 * Change how the selected cells look, without touching what they hold.
 *
 * `alter` is handed a copy of each cell's style and gives one back. Excel
 * turns a whole selection on if any of it is off — press Ctrl+B on a block
 * where one cell is bold and the rest are not and everything goes bold — so
 * the decision is taken once, over the block, and then applied.
 */
/// Change the style of every cell in the selection.
///
/// `alter` is handed the row and column as well, because some changes depend
/// on where in the selection a cell falls: an outline rules the top of the top
/// row and nothing else.
function restyle(alter) {
  change(() => eachInRegion((row, col) => {
    const held = heldAt(row, col);
    const was = held ? held.style : {};
    const now = alter(was, row, col);
    if (sameStyle(was, now)) return;
    // Writing the text back unchanged is how the style rides in; put() knows
    // not to work the value out again when the text has not moved.
    put(row, col, contentOf(held), now);
  }));
  draw();
  paint();
}

/** Is every cell in the selection already wearing this? */
function allWear(has) {
  let seen = false;
  let all = true;
  eachInRegion((row, col) => {
    const held = heldAt(row, col);
    seen = true;
    if (!has(held ? held.style : {})) all = false;
  });
  return seen && all;
}

/** Turn a yes-or-no part of the style on, or off if it is on everywhere. */
function toggle(name) {
  const off = allWear((style) => Boolean(style[name]));
  restyle((style) => ({ ...style, [name]: !off }));
}

/** Line the selected cells up, or take an alignment away if it is set. */
function alignTo(where) {
  const off = allWear((style) => style.horizontal_align === where);
  restyle((style) => {
    const next = { ...style };
    if (off) delete next.horizontal_align;
    else next.horizontal_align = where;
    return next;
  });
}

/** Do two cells wear the same style? A missing one is the empty one. */
function sameStyle(one, two) {
  return JSON.stringify(one || {}) === JSON.stringify(two || {});
}

// With a block selected, Enter and Tab do not leave it: Enter walks down the
// column and wraps to the top of the next one, Tab walks across and wraps to
// the start of the next row. It is how a range gets filled in without ever
// steering, and it is why people select the block first.
function stepInside(down, across) {
  const box = region();
  const tall = box.bottom - box.top + 1;
  const wideness = box.right - box.left + 1;
  let seat = down !== 0
    ? (at.col - box.left) * tall + (at.row - box.top) + down
    : (at.row - box.top) * wideness + (at.col - box.left) + across;
  const seats = tall * wideness;
  seat = ((seat % seats) + seats) % seats;
  const spot = down !== 0
    ? { row: box.top + (seat % tall), col: box.left + Math.floor(seat / tall) }
    : { row: box.top + Math.floor(seat / wideness), col: box.left + (seat % wideness) };
  at = spot;
  paint();  // `anchor` and `reach` stay put: the block is unchanged.
  const held = heldAt(at.row, at.col);
  formulaBox.value = contentOf(held);
  if (held) describeCell(columnName(at.col) + at.row, held);
  else cellBox.innerHTML = '<dd class="none">empty</dd>';
}

function commit(then) {
  if (!editor) return;
  const text = editor.input.value;
  const spot = { row: editor.row, col: editor.col };
  editor.input.style.display = 'none';
  editor = null;
  change(() => put(spot.row, spot.col, text));
  draw();
  goTo(at.row, at.col, true);
  focusGrid();
  if (then) then();
}

function cancel() {
  if (!editor) return;
  editor.input.style.display = 'none';
  editor = null;
  goTo(at.row, at.col, true);
  focusGrid();
}

function onKey(event) {
  if (!book) return;
  const bounds = extent();
  if (editor) {
    if (event.key === 'Escape') {
      event.preventDefault();
      cancel();
    } else if (event.key === 'Enter') {
      event.preventDefault();
      const down = event.shiftKey ? -1 : 1;
      const back = tabHome;
      const inside = spread();
      commit(() => inside
        ? stepInside(down, 0)
        : goTo(at.row + down, back === null ? at.col : back));
    } else if (event.key === 'Tab') {
      event.preventDefault();
      const step = event.shiftKey ? -1 : 1;
      if (spread()) { commit(() => stepInside(0, step)); return; }
      if (tabHome === null) tabHome = at.col;
      commit(() => goTo(at.row, at.col + step, true));
    }
    return;
  }
  const jump = event.ctrlKey || event.metaKey;
  const wide = event.shiftKey;
  // Shift walks the corner being dragged; without it, the active cell.
  const from = wide ? reach : at;
  switch (event.key) {
    case 'ArrowUp':
      event.preventDefault();
      if (jump) runTo(-1, 0, wide); else goTo(from.row - 1, from.col, false, wide);
      break;
    case 'ArrowDown':
      event.preventDefault();
      if (jump) runTo(1, 0, wide); else goTo(from.row + 1, from.col, false, wide);
      break;
    case 'ArrowLeft':
      event.preventDefault();
      if (jump) runTo(0, -1, wide); else goTo(from.row, from.col - 1, false, wide);
      break;
    case 'ArrowRight':
      event.preventDefault();
      if (jump) runTo(0, 1, wide); else goTo(from.row, from.col + 1, false, wide);
      break;
    case 'Tab':
      event.preventDefault();
      if (spread()) { stepInside(0, event.shiftKey ? -1 : 1); break; }
      if (tabHome === null) tabHome = at.col;
      goTo(at.row, at.col + (event.shiftKey ? -1 : 1), true);
      break;
    case 'Enter':
      event.preventDefault();
      if (spread()) stepInside(event.shiftKey ? -1 : 1, 0);
      else if (tabHome !== null) goTo(at.row + 1, tabHome);
      else goTo(at.row + (event.shiftKey ? -1 : 1), at.col);
      break;
    case 'Home':
      event.preventDefault();
      goTo(jump ? 1 : from.row, 0, false, wide);
      break;
    case 'End':
      event.preventDefault();
      goTo(jump ? bounds.rows : from.row, bounds.cols, false, wide);
      break;
    case 'PageDown':
      event.preventDefault();
      goTo(from.row + 20, from.col, false, wide);
      break;
    case 'PageUp':
      event.preventDefault();
      goTo(from.row - 20, from.col, false, wide);
      break;
    case 'z':
    case 'Z':
      if (!jump) break;
      event.preventDefault();
      if (event.shiftKey) redo(); else undo();
      break;
    case 'y':
    case 'Y':
      if (!jump) break;
      event.preventDefault();
      redo();
      break;
    case 'a':
    case 'A':
      if (!jump) break;
      event.preventDefault();
      takeAll();
      break;
    case 'f':
    case 'F':
      if (!jump) break;
      // The browser's own find would search the rows the grid has drawn,
      // which on a long sheet is a fraction of it, and would leave the cursor
      // where it was.
      event.preventDefault();
      if (findBox) { findBox.focus(); findBox.select(); }
      break;
    // Excel puts the common number formats on Ctrl+Shift and the digit row.
    // The digits themselves are what arrive on a US layout; `event.code` is
    // what arrives on the others, so both are read.
    case '!': case '"': case '#': case '$': case '%': case '&':
    case '~': case '`':
      if (!jump || !event.shiftKey) break;
      event.preventDefault();
      wearFormat(FORMAT_KEYS[event.code] || FORMAT_KEYS[event.key] || '');
      break;
    // Excel's own shortcuts. Which character the plus key reports depends on
    // the keyboard and on whether Shift is down, so every spelling of it is
    // taken rather than guessing at one.
    case '+':
    case ';':
    case '=':
      if (!jump) break;
      event.preventDefault();
      shiftBand(1);
      break;
    case '-':
      if (!jump) break;
      event.preventDefault();
      shiftBand(-1);
      break;
    case 'b':
    case 'B':
      if (!jump) break;
      event.preventDefault();
      toggle('bold');
      break;
    case 'i':
    case 'I':
      if (!jump) break;
      event.preventDefault();
      toggle('italic');
      break;
    case 'u':
    case 'U':
      if (!jump) break;
      event.preventDefault();
      toggle('underline');
      break;
    case 'F2':
      event.preventDefault();
      edit(null);
      break;
    case 'Escape':
      event.preventDefault();
      dropCut();
      break;
    case 'Delete':
    case 'Backspace':
      event.preventDefault();
      clearSelection();
      break;
    default:
      // A printable key starts a new value, the way it does in Excel: you do
      // not open the cell first, you just type.
      if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        edit(event.key);
      }
  }
}

// ─── The pointer on the drawing ────────────────────────────────────────────
//
// A canvas has no cells to hang listeners on, so every gesture is the same
// two numbers put through `whatIsAt`. That is the whole of the difference:
// what the pointer means is worked out once, in one place, rather than being
// spread across a mousedown on a `th`, another on a `td`, and a `closest()`
// call that quietly picks the wrong one when a merge is in the way.

sheetBox.tabIndex = 0;

sheetBox.addEventListener('mousedown', (event) => {
  if (event.button !== 0) return;
  const spot = whatIsAt(event);
  if (!spot) return;
  if (spot.edgeCol !== undefined) {
    sizing = {
      col: spot.edgeCol,
      from: event.clientX,
      was: geom.cols[spot.edgeCol + 1] - geom.cols[spot.edgeCol],
    };
    event.preventDefault();
    return;
  }
  if (spot.edgeRow !== undefined) {
    sizing = {
      row: spot.edgeRow,
      from: event.clientY,
      was: geom.tops[spot.edgeRow + 1] - geom.tops[spot.edgeRow],
    };
    event.preventDefault();
    return;
  }
  if (editor) commit();
  if (spot.all) { takeAll(); focusGrid(); event.preventDefault(); return; }
  if (spot.headCol !== undefined) {
    takeColumn(spot.headCol, event.shiftKey);
    headDrag = 'col';
    focusGrid();
    event.preventDefault();
    return;
  }
  if (spot.headRow !== undefined) {
    takeRow(spot.headRow, event.shiftKey);
    headDrag = 'row';
    focusGrid();
    event.preventDefault();
    return;
  }
  if (spot.handle) {
    filling = { row: at.row, col: at.col };
    focusGrid();
    event.preventDefault();
    return;
  }
  // Shift extends from wherever the selection already starts; a plain click
  // starts a new one and arms the drag.
  goTo(spot.row, spot.col, false, event.shiftKey);
  if (!event.shiftKey) dragging = true;
  focusGrid();
  event.preventDefault();
});

sheetBox.addEventListener('mousemove', (event) => {
  if (sizing) return;
  const spot = whatIsAt(event);
  if (!spot) return;
  sheetBox.style.cursor = spot.edgeCol !== undefined ? 'col-resize'
    : spot.edgeRow !== undefined ? 'row-resize'
      : spot.handle ? 'crosshair'
        : (spot.headCol !== undefined || spot.headRow !== undefined || spot.all)
          ? 'default' : 'cell';
  if (filling) {
    if (spot.row !== undefined) filling.to = { row: spot.row, col: spot.col };
    return;
  }
  if (headDrag) {
    if (headDrag === 'col' && spot.headCol !== undefined) takeColumn(spot.headCol, true);
    else if (headDrag === 'row' && spot.headRow !== undefined) takeRow(spot.headRow, true);
    return;
  }
  if (!dragging || spot.row === undefined) return;
  goTo(spot.row, spot.col, false, true);
});

sheetBox.addEventListener('dblclick', (event) => {
  const spot = whatIsAt(event);
  if (!spot) return;
  // On a column's edge it fits the column; anywhere else on a header it does
  // not mean anything, and opening a cell for editing certainly is not it.
  if (spot.edgeCol !== undefined) { fitColumn(spot.edgeCol); return; }
  if (spot.edgeRow !== undefined || spot.headCol !== undefined
      || spot.headRow !== undefined || spot.all) return;
  edit(null);
});

// Scrolling moves the drawing, not the page: the canvas covers the viewport
// and is repainted where it now stands.
sheetBox.addEventListener('scroll', () => {
  if (editor) {
    const rect = rectOf(editor.row, editor.col);
    if (rect) {
      editor.input.style.left = `${sheetBox.scrollLeft + rect.x}px`;
      editor.input.style.top = `${sheetBox.scrollTop + rect.y}px`;
    }
  }
  paintSheet();
}, { passive: true });

window.addEventListener('resize', () => { if (geom) paintSheet(); });

// Resizing has to hear the pointer wherever it goes: a drag that leaves the
// table is still a drag.
document.addEventListener('mousemove', (event) => {
  if (!sizing) return;
  event.preventDefault();
  if (sizing.row !== undefined) {
    showHeight(sizing.row, sizing.was + (event.clientY - sizing.from));
  } else {
    showWidth(sizing.col, sizing.was + (event.clientX - sizing.from));
  }
});

document.addEventListener('mouseup', (event) => {
  if (sizing) {
    const held = sizing;
    sizing = null;
    if (held.row !== undefined) {
      setHeight(held.row, held.was + (event.clientY - held.from));
    } else {
      setWidth(held.col, held.was + (event.clientX - held.from));
    }
    return;
  }
  headDrag = null;
  if (filling) {
    const to = filling.to;
    filling = null;
    if (to) fillTo(to.row, to.col);
    return;
  }
  if (!dragging) return;
  dragging = false;
  // The name box goes back to the anchor's address now the size has been read.
  paint();
});

document.addEventListener('keydown', (event) => {
  if (document.activeElement === formulaBox) {
    if (event.key === 'Enter') {
      event.preventDefault();
      change(() => put(at.row, at.col, formulaBox.value));
      draw();
      goTo(at.row + 1, at.col);
      focusGrid();
    } else if (event.key === 'Escape') {
      event.preventDefault();
      formulaBox.value = contentOf(heldAt(at.row, at.col));
      focusGrid();
    }
    return;
  }
  onKey(event);
});

async function open(data, name) {
  try {
    source = new Uint8Array(data).slice();
    fileName = name || 'workbook.xlsx';
    changes.clear();
    pristine.clear();
    beyondValues = false;
    undone.length = 0;
    redone.length = 0;
    markSaved();
    markSteps();
    book = parse_spreadsheet(new Uint8Array(data));
  } catch (error) {
    stateBox.style.display = 'block';
    stateBox.textContent = `Oxi could not read ${name}: ${error}`;
    geom = null;
    return;
  }
  shown = 0;
  weighCalc();
  markFrozen();
  const style = book.default_style || {};
  digitWidth = measureDigit(style.font_name, style.font_size);
  draw();
  describe();
  // Which faces to offer is a question about the whole workbook, so it is
  // asked once when one is opened rather than on every movement.
  sayFaces();
  // A new workbook starts at its own A1 rather than wherever the last one was
  // left, and with nothing selected from it.
  goTo(1, 0);
}

async function openSample() {
  stateBox.style.display = 'block';
  stateBox.textContent = 'Reading the sample…';
  const reply = await fetch(SAMPLE);
  if (!reply.ok) {
    stateBox.textContent =
      'The sample could not be fetched. Serve this folder over http rather than opening the file directly.';
    return;
  }
  await open(await reply.arrayBuffer(), 'the sample');
}

document.getElementById('reset').onclick = openSample;
document.getElementById('pick').onchange = async (event) => {
  const file = event.target.files[0];
  if (file) await open(await file.arrayBuffer(), file.name);
};

for (const kind of ['dragenter', 'dragover']) {
  sheetBox.addEventListener(kind, (event) => {
    event.preventDefault();
    dropBox.classList.add('over');
  });
}
for (const kind of ['dragleave', 'drop']) {
  sheetBox.addEventListener(kind, (event) => {
    event.preventDefault();
    dropBox.classList.remove('over');
  });
}
sheetBox.addEventListener('drop', async (event) => {
  const file = event.dataTransfer.files[0];
  if (file) await open(await file.arrayBuffer(), file.name);
});

await init();
await openSample();
</script>
</body>
</html>
