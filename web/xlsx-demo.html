<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxi — Spreadsheet Demo</title>
<style>
:root {
  --accent: #217346;
  --accent-d: #1B5E3A;
  --accent-l: #E4F0E9;
  --rule: #D0D7DE;
  --head: #F3F5F7;
  --txt: #24292F;
  --dim: #656D76;
  --bg: #FFFFFF;
  --code: #F6F8FA;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Hiragino Sans',
    'Noto Sans JP', sans-serif;
  color: var(--txt);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: var(--accent);
  color: #fff;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
header .name { font-weight: 700; letter-spacing: .3px; }
header .what { opacity: .9; font-size: 13px; }
header .spacer { flex: 1; }
header button, header label.file {
  background: rgba(255, 255, 255, .16);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, .3);
  border-radius: 4px;
  padding: 5px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
header button:hover, header label.file:hover { background: rgba(255, 255, 255, .28); }
header input[type=file] { display: none; }

main { flex: 1; display: flex; min-height: 0; }

#sheet {
  flex: 1;
  overflow: auto;
  background: #fff;
  position: relative;
}
table { border-collapse: collapse; table-layout: fixed; }
th, td {
  border: 1px solid var(--rule);
  font-size: 13px;
  padding: 0 3px;
  overflow: hidden;
  white-space: nowrap;
  height: 20px;
}
th {
  background: var(--head);
  color: var(--dim);
  font-weight: 400;
  font-size: 11px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 2;
}
th.row { position: sticky; left: 0; z-index: 1; width: 40px; }
td.picked { outline: 2px solid var(--accent); outline-offset: -2px; }
/* The box Excel draws round the cell you are on, and the little square at its
   corner. Both are what tells you at a glance where typing will land. */
td.here {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  position: relative;
}
td.here::after {
  content: '';
  position: absolute;
  right: -3px;
  bottom: -3px;
  width: 5px;
  height: 5px;
  background: var(--accent);
  border: 1px solid #FFF;
}
td input.inline {
  font: inherit;
  border: none;
  outline: none;
  width: 100%;
  height: 100%;
  padding: 0;
  background: #FFF;
  color: inherit;
  text-align: inherit;
}
.bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  flex-shrink: 0;
}
.bar #where {
  min-width: 78px;
  font-size: 13px;
  padding: 3px 8px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--head);
}
.bar .fx { color: var(--dim); font-style: italic; font-size: 13px; }
.bar input {
  flex: 1;
  font: inherit;
  font-size: 13px;
  padding: 3px 8px;
  border: 1px solid var(--rule);
  border-radius: 3px;
}
.bar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
td.right { text-align: right; }
td.centre { text-align: center; }
td.bold { font-weight: 700; }

aside {
  width: 340px;
  border-left: 1px solid var(--rule);
  overflow-y: auto;
  padding: 14px 16px;
  background: #FBFCFD;
  flex-shrink: 0;
}
aside h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--dim);
  margin: 18px 0 8px;
  font-weight: 600;
}
aside h2:first-child { margin-top: 0; }
aside dl { display: grid; grid-template-columns: 108px 1fr; gap: 5px 10px; font-size: 13px; }
aside dt { color: var(--dim); }
aside dd { word-break: break-all; }
aside code {
  font-family: 'Cascadia Mono', Consolas, monospace;
  background: var(--code);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 1px 4px;
  font-size: 12px;
}
aside .sum { font-size: 13px; line-height: 1.6; color: var(--dim); }
aside .none { color: var(--dim); font-style: italic; font-size: 13px; }
aside ul { list-style: none; font-size: 13px; }
aside ul li { padding: 3px 0 3px 14px; position: relative; }
aside ul li::before { content: '·'; position: absolute; left: 4px; color: var(--dim); }

.tabs {
  display: flex;
  gap: 2px;
  padding: 4px 10px;
  border-top: 1px solid var(--rule);
  background: var(--head);
  flex-shrink: 0;
}
.tabs button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font: inherit;
  font-size: 13px;
  padding: 4px 12px;
  cursor: pointer;
  color: var(--dim);
}
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

#drop {
  position: absolute;
  inset: 0;
  background: rgba(33, 115, 70, .08);
  border: 2px dashed var(--accent);
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--accent-d);
  font-size: 15px;
  z-index: 5;
}
#drop.over { display: flex; }
#state { padding: 40px; color: var(--dim); font-size: 14px; }
:root { --rule-firm: #8a8f98; }

/* Said once, quietly, beside the formula it applies to. */
.bar #calcNote {
  flex: none;
  padding: 0 12px;
  color: var(--dim);
  font-size: 11px;
  white-space: nowrap;
}

/* The two arrows sit together as one control, the way a toolbar pairs them. */
header .step { font-size: 15px; line-height: 1; padding: 5px 9px; }
header .dress { min-width: 30px; padding: 5px 7px; line-height: 1; }
header #left { margin-left: 6px; }
header #back { margin-left: 6px; }
header #on { margin-right: 4px; }

/* A selected block is washed, and the block's outer edge is ruled, so the eye
   reads one rectangle rather than a scatter of tinted cells. The active cell
   inside it keeps its own outline and is left unwashed, the way Excel leaves
   the cell you are about to type into. */
td.pick { background: rgba(33, 115, 70, .10); }
th.lit { background: var(--accent); color: #fff; }
/* Rows and columns the sheet asks to be kept in view. They are ordinary cells
   pinned where they are, so they need a background of their own — without one
   the rows sliding underneath show through. */
td.held, th.held { position: sticky; z-index: 3; background: #fff; }
th.held { background: var(--head); }
/* A cell held in both directions passes over the ones held in only one. */
td.held.both, th.held.both { z-index: 4; }
/* The last held row and column are ruled, so it is clear what is pinned and
   what is sliding under it. */
td.held.edge-hold-b, th.held.edge-hold-b { box-shadow: inset 0 -2px 0 0 var(--rule-firm); }
td.held.edge-hold-r, th.held.edge-hold-r { box-shadow: inset -2px 0 0 0 var(--rule-firm); }
td.held.edge-hold-b.edge-hold-r, th.held.edge-hold-b.edge-hold-r {
  box-shadow: inset 0 -2px 0 0 var(--rule-firm), inset -2px 0 0 0 var(--rule-firm);
}

/* Cells a cut has marked. They are still there — this says where they will
   move from, and Escape takes it back. */
td.cut { outline: 2px dashed var(--accent); outline-offset: -2px; }
th[data-head-col], th[data-head-row], th[data-all] { cursor: cell; }
td.pick.here { background: transparent; }
td.edge-t { box-shadow: inset 0 1px 0 0 var(--accent); }
td.edge-b { box-shadow: inset 0 -1px 0 0 var(--accent); }
td.edge-l { box-shadow: inset 1px 0 0 0 var(--accent); }
td.edge-r { box-shadow: inset -1px 0 0 0 var(--accent); }
td.edge-t.edge-l { box-shadow: inset 0 1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent); }
td.edge-t.edge-r { box-shadow: inset 0 1px 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }
td.edge-b.edge-l { box-shadow: inset 0 -1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent); }
td.edge-b.edge-r { box-shadow: inset 0 -1px 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }
/* The fill handle: the corner of the selection, and the only part of it the
   pointer treats differently. */
td.edge-b.edge-r::after, td.here:not(.pick)::after {
  content: '';
  position: absolute;
  right: -3px;
  bottom: -3px;
  width: 6px;
  height: 6px;
  background: var(--accent);
  border: 1px solid #fff;
  cursor: crosshair;
}
td { position: relative; }
td.edge-t.edge-b.edge-l { box-shadow: inset 0 1px 0 0 var(--accent), inset 0 -1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent); }
td.edge-t.edge-b.edge-r { box-shadow: inset 0 1px 0 0 var(--accent), inset 0 -1px 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }
td.edge-t.edge-l.edge-r { box-shadow: inset 0 1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }
td.edge-b.edge-l.edge-r { box-shadow: inset 0 -1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }

/* What the selection comes to, where Excel puts it: the far end of the strip
   the sheet tabs sit in. */
#tally {
  margin-left: auto;
  padding: 0 14px;
  color: var(--dim);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
/* Dragging a range means passing the pointer over cell after cell; without
   this the browser starts selecting their text instead. */
table { user-select: none; }
</style>
</head>
<body>

<header>
  <span class="name">Oxi</span>
  <span class="what">Spreadsheet rendering, in the browser, with no server</span>
  <span class="spacer"></span>
  <button id="freeze" title="Hold everything above and left of the cursor in view">Freeze</button>
  <button id="bold" class="dress" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="italic" class="dress" title="Italic (Ctrl+I)"><i>I</i></button>
  <button id="under" class="dress" title="Underline (Ctrl+U)"><u>U</u></button>
  <button id="left" class="dress" title="Align left">&#8676;</button>
  <button id="centre" class="dress" title="Centre">&#8677;&#8676;</button>
  <button id="right" class="dress" title="Align right">&#8677;</button>
  <input id="find" disabled placeholder="Find" title="Find (Ctrl+F). Enter for the next, Shift+Enter for the one before." />
  <select id="rules" disabled title="Rules around the cells">
    <option value="">Rules</option>
    <option value="all">All</option>
    <option value="outline">Outline</option>
    <option value="top">Top</option>
    <option value="bottom">Bottom</option>
    <option value="left">Left</option>
    <option value="right">Right</option>
    <option value="none">None</option>
  </select>
  <input id="fill" type="color" disabled title="Fill colour" />
  <button id="nofill" disabled title="No fill">&#8709;</button>
  <input id="numfmt" list="numfmts" disabled placeholder="Format"
         title="How the numbers look. Any Excel format code, or pick one." />
  <datalist id="numfmts">
    <option value="General">1234.5678 &#8594; 1234.5678</option>
    <option value="0">1234.5678 &#8594; 1235</option>
    <option value="0.00">1234.5678 &#8594; 1234.57</option>
    <option value="#,##0">1234.5678 &#8594; 1,235</option>
    <option value="#,##0.00">1234.5678 &#8594; 1,234.57</option>
    <option value="0%">0.15 &#8594; 15%</option>
    <option value="0.00%">0.15 &#8594; 15.00%</option>
    <option value="$#,##0.00">1234.5678 &#8594; $1,234.57</option>
    <option value="&#165;#,##0">1234.5678 &#8594; &#165;1,235</option>
    <option value="&#8364;#,##0.00">1234.5678 &#8594; &#8364;1,234.57</option>
    <option value="yyyy-mm-dd">45297 &#8594; 2024-01-06</option>
    <option value="d mmm yyyy">45297 &#8594; 6 Jan 2024</option>
    <option value="h:mm">0.75 &#8594; 18:00</option>
    <option value="h:mm AM/PM">0.75 &#8594; 6:00 PM</option>
    <option value="0.00E+00">1234.5678 &#8594; 1.23E+03</option>
  </datalist>
  <button id="addBand" disabled title="Insert rows or columns (Ctrl+Shift+Plus)">Insert</button>
  <button id="cutBand" disabled title="Delete rows or columns (Ctrl+Minus)">Delete</button>
  <button id="back" class="step" disabled title="Undo (Ctrl+Z)">&#8630;</button>
  <button id="on" class="step" disabled title="Redo (Ctrl+Y)">&#8631;</button>
  <button id="save" disabled>Save</button>
  <button id="reset">Sample workbook</button>
  <label class="file">Open a .xlsx<input type="file" id="pick" accept=".xlsx"></label>
</header>

<div class="bar">
  <span id="where">A1</span>
  <span class="fx">fx</span>
  <input id="formula" spellcheck="false" autocomplete="off">
  <span id="calcNote" style="display:none"></span>
</div>

<main>
  <div id="sheet">
    <div id="state">Loading the engine…</div>
    <div id="drop">Drop a .xlsx here</div>
  </div>
  <aside>
    <h2>What Oxi read</h2>
    <dl id="facts"></dl>
    <h2>Column width</h2>
    <p class="sum" id="widthRule"></p>
    <h2>Selected cell</h2>
    <dl id="cellFacts"><dd class="none">Click a cell</dd></dl>
    <h2>Not yet drawn</h2>
    <ul id="missing"><li class="none">—</li></ul>
  </aside>
</main>

<div class="tabs" id="tabs"><span id="tally"></span></div>

<script type="module">
import init, { parse_spreadsheet, format_cell_number, edit_xlsx,
               edit_xlsx_from_workbook, recalculate_spreadsheet,
               translate_formula, shift_band } from './oxidocs_wasm.js';

const SAMPLE = './samples/quarterly-sales.xlsx';
/// A stored column width already carries the gutter either side of a cell's
/// text, so it is not the width a person types into Excel: typing 10 stores
/// 10.625. Pixels come back out of it by OOXML's own rule, confirmed to the
/// pixel against a ruled worksheet.

const sheetBox = document.getElementById('sheet');
const stateBox = document.getElementById('state');
const dropBox = document.getElementById('drop');
const factsBox = document.getElementById('facts');
const cellBox = document.getElementById('cellFacts');
const missingBox = document.getElementById('missing');
const widthBox = document.getElementById('widthRule');
const tabsBox = document.getElementById('tabs');

let book = null;
let shown = 0;
// The file as it arrived. Saving patches THAT rather than writing a workbook
// out afresh: everything the sheet carries and this page never modelled —
// charts, pictures, print settings, the styles of cells nobody touched —
// stays exactly as its author left it. A save that rebuilds the file from
// what the screen knows is how an editor quietly throws that away.
let source = null;
let fileName = 'workbook.xlsx';
// One entry per cell that has been changed, keyed by sheet/row/column so
// typing into the same cell twice sends one edit, not two.
const changes = new Map();
// Whether anything has changed that a list of cell values cannot express: a
// column's width, or the formatting a fill carried across. Saving those needs
// the whole workbook to travel, and a date that arrives without its format is
// a five-figure number.
let beyondValues = false;
let digitWidth = 7;

/// The width of a digit in the workbook's standard font, which is the unit a
/// column width is stated in.
/** How wide `text` is, drawn the way the cell holding it is drawn. */
function inkOf(text, style) {
  const canvas = inkOf.canvas || (inkOf.canvas = document.createElement('canvas'));
  const pen = canvas.getContext('2d');
  const standard = (book && book.default_style) || {};
  const points = style.font_size || standard.font_size || 11;
  const family = style.font_name || standard.font_name || 'Calibri';
  pen.font = `${style.italic ? 'italic ' : ''}${style.bold ? 'bold ' : ''}`
    + `${points * 96 / 72}px "${family}", Calibri, sans-serif`;
  return pen.measureText(text).width;
}

// The room Excel leaves either side of the text. Twelve pixels at the sizes
// anyone actually uses, growing by two for every seven pixels of em: ten at
// 6pt, twelve to 11.5, fourteen to 16.5, sixteen to 22, eighteen to 27.
function padFor(points) {
  const em = (points || 11) * 96 / 72;
  return 10 + 2 * Math.max(0, 1 + Math.floor((em - 26 / 3) / 7));
}

// An indent pushes the text in, and the column has to make room for it:
// "Hello" comes out 47px plain and 83px indented three.
const INDENT = 12;

/**
 * How wide column `col` has to be to show everything in it.
 *
 * Returns null when there is nothing to fit, which is not the same as a width
 * of nothing: a column of merged cells has no answer, and Excel leaves it
 * exactly as it is rather than closing it up.
 */
function fitWidth(col) {
  const sheet = sheetNow();
  if (!sheet) return null;
  const covered = new Set();
  for (const merge of sheet.merge_cells || []) {
    for (let row = merge.start_row; row <= merge.end_row; row++) {
      for (let across = merge.start_col; across <= merge.end_col; across++) {
        covered.add(`${row},${across}`);
      }
    }
  }
  let widest = null;
  for (const line of sheet.rows) {
    const cell = line.cells.find((one) => one.col === col);
    if (!cell) continue;
    // Merged cells are ignored, which is why autofit so often looks like it
    // did nothing at all. And a wrapped cell is not fitted to its text either:
    // Excel picks a width to suit the row's height there, and the same words
    // in the same font came out two different widths in two sheets.
    if (covered.has(`${line.index},${col}`)) continue;
    if (cell.style.wrap_text) continue;
    const text = shownText(cell);
    if (text === '') continue;
    const points = cell.style.font_size;
    const wants = inkOf(text, cell.style)
      + (cell.style.indent || 0) * INDENT
      + padFor(points);
    if (widest === null || wants > widest) widest = wants;
  }
  return widest;
}

/** Make column `col` as wide as its contents, as a double-click does. */
function fitColumn(col) {
  const wants = fitWidth(col);
  if (wants === null) return;
  setWidth(col, Math.ceil(wants));
}

function measureDigit(name, points) {
  const canvas = measureDigit.canvas ||= document.createElement('canvas');
  const pen = canvas.getContext('2d');
  const family = name ? `"${name}"` : 'Calibri';
  pen.font = `${(points || 11) * 96 / 72}px ${family}, Calibri, sans-serif`;
  return Math.round(pen.measureText('0').width);
}

/// Excel's own default when a sheet names no width of its own.
const DEFAULT_CHARACTERS = 8.43;

function widthOf(sheet, column) {
  const named = sheet.col_widths[column];
  if (named > 0) return named;
  return sheet.default_col_width > 0 ? sheet.default_col_width : DEFAULT_CHARACTERS;
}

// The width to store for a column someone has dragged to `pixels` wide.
//
// A stored width times the digit width IS the pixel width: Excel stores 10.625
// for a column typed as 10, and 10.625 x 8 is the 85 pixels it draws. The
// gutter either side of the text is already inside the stored number, which is
// why it is not the number Excel's own box shows.
function widthForPixels(pixels) {
  return Math.max(0, pixels) / digitWidth;
}

function columnPixels(width) {
  const padding = Math.trunc(128 / digitWidth);
  return Math.trunc(((256 * width + padding) / 256) * digitWidth);
}

function columnName(index) {
  let name = '';
  for (let n = index; n >= 0; n = Math.floor(n / 26) - 1) {
    name = String.fromCharCode(65 + (n % 26)) + name;
  }
  return name;
}

/// What a cell shows, which is its value put through its number format.
/// How OOXML's rules are drawn, by the name the file gives each.
///
/// The widths are what a spreadsheet shows: one pixel for the light rules, two
/// for medium, three for thick. `double` is a pair of lines and the browser
/// needs three pixels to find room for them. A hair rule is a single pixel of
/// something fainter than black, which is the nearest a screen gets to the
/// mark a printer would make.
const RULES = {
  thin: '1px solid',
  hair: '1px solid',
  dotted: '1px dotted',
  dashed: '1px dashed',
  dashDot: '1px dashed',
  dashDotDot: '1px dashed',
  medium: '2px solid',
  mediumDashed: '2px dashed',
  mediumDashDot: '2px dashed',
  mediumDashDotDot: '2px dashed',
  slantDashDot: '2px dashed',
  thick: '3px solid',
  double: '3px double',
};

/// Put one of a cell's four rules on it, if it has one there.
///
/// A rule the file does not name is not drawn, and the cell keeps the faint
/// grid line the stylesheet gives every cell — that is the line Excel shows
/// where a sheet has no rule of its own.
function rule(cell, side, line) {
  if (!line || !line.style) return;
  const drawn = RULES[line.style];
  if (!drawn) return;
  // A hair rule names no width of its own, so it is told apart by colour.
  const ink = line.color ? `#${line.color}`
    : (line.style === 'hair' ? 'var(--rule)' : '#000');
  cell.style[`border${side}`] = `${drawn} ${ink}`;
}

function shownText(cell) {
  const value = cell.value;
  if (value === null || value === undefined) return '';
  // A variant that carries nothing arrives as its own name, not as an object.
  if (typeof value === 'string') return value === 'Empty' ? '' : value;
  if (typeof value === 'object') {
    if ('Number' in value) {
      return cell.style.number_format
        ? format_cell_number(value.Number, cell.style.number_format)
        : String(value.Number);
    }
    if ('String' in value) return value.String;
    if ('Boolean' in value) return value.Boolean ? 'TRUE' : 'FALSE';
    if ('Error' in value) return value.Error;
  }
  return '';
}

function isNumber(cell) {
  return typeof cell.value === 'object' && cell.value !== null && 'Number' in cell.value;
}

/**
 * Hold everything above and left of the cursor, or let it all go again.
 *
 * Excel freezes at the active cell rather than at a chosen line: standing on
 * C4 and freezing holds three rows and two columns. The same command undoes
 * it once a sheet is frozen, which is why this is one control and not two.
 */
function freezeHere() {
  const sheet = sheetNow();
  if (!sheet) return;
  const on = (sheet.frozen_rows || 0) > 0 || (sheet.frozen_cols || 0) > 0;
  const rows = on ? 0 : at.row - 1;
  const cols = on ? 0 : at.col;
  if (rows === (sheet.frozen_rows || 0) && cols === (sheet.frozen_cols || 0)) return;
  change(() => {
    if (step) {
      step.panes.push({
        was: [sheet.frozen_rows || 0, sheet.frozen_cols || 0],
        now: [rows, cols],
      });
    }
    sheet.frozen_rows = rows;
    sheet.frozen_cols = cols;
    beyondValues = true;
  });
  draw();
  paint();
  markFrozen();
}

/** Say whether the sheet on screen is frozen, on the control that does it. */
function markFrozen() {
  const button = document.getElementById('freeze');
  if (!button) return;
  const sheet = sheetNow();
  const on = sheet && ((sheet.frozen_rows || 0) > 0 || (sheet.frozen_cols || 0) > 0);
  button.textContent = on ? 'Unfreeze' : 'Freeze';
  button.title = on
    ? 'Let the held rows and columns scroll again'
    : 'Hold everything above and left of the cursor in view';
}

/**
 * Keep the sheet's frozen rows and columns in view while the rest scrolls.
 *
 * A workbook says `<pane ySplit="1" state="frozen"/>` to mean "hold the top
 * row", counting in cells. The header strip is already pinned at the top, so a
 * held row sits below it, and each held row below the one before — which is
 * why the offsets are added up from the sizes the browser actually gave them
 * rather than from the sizes the file asked for.
 */
function holdPanes(table, sheet) {
  const rows = Math.max(0, sheet.frozen_rows || 0);
  const cols = Math.max(0, sheet.frozen_cols || 0);
  if (rows === 0 && cols === 0) return;

  // Down the page: the header strip first, then each held row under it.
  const head = table.rows[0];
  let down = head ? head.getBoundingClientRect().height : 0;
  const tops = [];
  for (let at = 1; at <= rows && at < table.rows.length; at++) {
    tops.push(down);
    down += table.rows[at].getBoundingClientRect().height;
  }
  // Across: the row-number column first, then each held column beside it.
  const corner = head && head.children[0];
  let across = corner ? corner.getBoundingClientRect().width : 0;
  const lefts = [];
  for (let at = 0; at < cols; at++) {
    lefts.push(across);
    const cell = head && head.children[at + 1];
    across += cell ? cell.getBoundingClientRect().width : 0;
  }

  for (let at = 1; at < table.rows.length; at++) {
    const row = table.rows[at];
    const held = at <= rows;
    for (const cell of row.children) {
      // A merged cell spans several columns, so its own column is the one it
      // starts in — the header's position tells us nothing about it.
      const col = cell.dataset.col === undefined ? -1 : Number(cell.dataset.col);
      const isRowLabel = cell.dataset.headRow !== undefined;
      const acrossHeld = isRowLabel || (col >= 0 && col < cols);
      if (!held && !acrossHeld) continue;
      cell.classList.add('held');
      if (held) cell.style.top = `${tops[at - 1]}px`;
      if (acrossHeld) cell.style.left = `${isRowLabel ? 0 : lefts[col]}px`;
      if (held && acrossHeld) cell.classList.add('both');
      if (held && at === rows) cell.classList.add('edge-hold-b');
      if (acrossHeld && !isRowLabel && col === cols - 1) {
        cell.classList.add('edge-hold-r');
      }
      if (acrossHeld && isRowLabel && cols === 0) cell.classList.add('edge-hold-r');
    }
  }
  // The header strip has to hold its held columns too, or they slide out from
  // under the cells they are heading.
  if (head) {
    for (let at = 0; at < cols && at + 1 < head.children.length; at++) {
      const cell = head.children[at + 1];
      cell.classList.add('held', 'both');
      cell.style.left = `${lefts[at]}px`;
      if (at === cols - 1) cell.classList.add('edge-hold-r');
    }
    if (corner) {
      corner.classList.add('held', 'both');
      corner.style.left = '0px';
    }
  }
}

function draw() {
  const sheet = book.sheets[shown];
  const merged = new Map();
  for (const merge of sheet.merge_cells || []) {
    for (let row = merge.start_row; row <= merge.end_row; row++) {
      for (let col = merge.start_col; col <= merge.end_col; col++) {
        const anchor = row === merge.start_row && col === merge.start_col;
        merged.set(`${row},${col}`, anchor ? merge : null);
      }
    }
  }

  let lastRow = 0;
  let lastColumn = 0;
  for (const row of sheet.rows) {
    for (const cell of row.cells) {
      const text = shownText(cell);
      if (text === '') continue;
      lastRow = Math.max(lastRow, row.index);
      lastColumn = Math.max(lastColumn, cell.col);
    }
  }
  lastColumn = Math.max(lastColumn, 3);
  lastRow = Math.max(lastRow, 8);

  const held = new Map();
  for (const row of sheet.rows) held.set(row.index, row);

  const table = document.createElement('table');
  const head = table.insertRow();
  const corner = document.createElement('th');
  corner.className = 'row';
  corner.dataset.all = '1';
  head.appendChild(corner);
  for (let col = 0; col <= lastColumn; col++) {
    const cell = document.createElement('th');
    cell.textContent = columnName(col);
    cell.dataset.headCol = col;
    cell.style.width = `${columnPixels(widthOf(sheet, col))}px`;
    head.appendChild(cell);
  }

  for (let index = 1; index <= lastRow; index++) {
    const row = table.insertRow();
    const label = document.createElement('th');
    label.className = 'row';
    label.textContent = index;
    label.dataset.headRow = index;
    row.appendChild(label);

    const source = held.get(index);
    const height = source && source.height ? source.height : sheet.default_row_height;
    // A height in points becomes whole pixels by truncation, the way Excel
    // draws it.
    if (height) row.style.height = `${Math.trunc(height * 96 / 72)}px`;

    for (let col = 0; col <= lastColumn; col++) {
      const box = merged.get(`${index},${col}`);
      if (box === null) continue;   // covered by a merge that is drawn already
      const cell = row.insertCell();
      if (box) {
        cell.colSpan = box.end_col - box.start_col + 1;
        cell.rowSpan = box.end_row - box.start_row + 1;
      }
      // Every cell answers to the keyboard, whether it holds anything or
      // not: in Excel the empty ones are where you type next, and a grid you
      // can only click the written cells of is a table, not a sheet.
      cell.dataset.row = index;
      cell.dataset.col = col;
      cell.tabIndex = -1;
      const held = source && source.cells.find((one) => one.col === col);
      if (!held) continue;
      cell.textContent = shownText(held);
      const align = held.style.horizontal_align;
      if (align === 'center') cell.classList.add('centre');
      else if (align === 'right') cell.classList.add('right');
      else if (!align && isNumber(held)) cell.classList.add('right');
      if (held.style.bold) cell.classList.add('bold');
      if (held.style.underline) cell.style.textDecoration = 'underline';
      if (held.style.italic) cell.style.fontStyle = 'italic';
      if (held.style.font_size) {
        cell.style.fontSize = `${held.style.font_size * 96 / 72}px`;
      }
      if (held.style.font_name) cell.style.fontFamily = `"${held.style.font_name}", sans-serif`;
      if (held.style.font_color) cell.style.color = `#${held.style.font_color}`;
      if (held.style.bg_color) cell.style.background = `#${held.style.bg_color}`;
      rule(cell, 'Top', held.style.border_top);
      rule(cell, 'Bottom', held.style.border_bottom);
      rule(cell, 'Left', held.style.border_left);
      rule(cell, 'Right', held.style.border_right);
    }
  }
  // The whole grid is written in the workbook's own font at its own size,
  // rather than at whatever the stylesheet happens to say. A cell that names
  // neither is drawn in this, which is what Excel does with it.
  const standard = (book && book.default_style) || {};
  table.style.fontSize = `${(standard.font_size || 11) * 96 / 72}px`;
  if (standard.font_name) {
    table.style.fontFamily = `"${standard.font_name}", Calibri, sans-serif`;
  }
  table.tabIndex = 0;
  table.addEventListener('mousedown', (event) => {
    const head = event.target.closest('th');
    if (head) {
      const under = onRowEdge(head, event);
      if (under !== null) {
        sizing = {
          row: under,
          from: event.clientY,
          was: head.getBoundingClientRect().height,
        };
        event.preventDefault();
        return;
      }
      const edge = onEdge(head, event);
      if (edge !== null) {
        sizing = {
          col: edge,
          from: event.clientX,
          was: head.getBoundingClientRect().width,
        };
        event.preventDefault();
        return;
      }
      if (head.dataset.all) takeAll();
      else if (head.dataset.headCol !== undefined) {
        takeColumn(Number(head.dataset.headCol), event.shiftKey);
        headDrag = 'col';
      } else if (head.dataset.headRow !== undefined) {
        takeRow(Number(head.dataset.headRow), event.shiftKey);
        headDrag = 'row';
      }
      table.focus();
      event.preventDefault();
      return;
    }
    const cell = event.target.closest('td');
    if (!cell || !cell.dataset.row) return;
    if (onHandle(cell, event)) {
      filling = { row: at.row, col: at.col };
      table.focus();
      event.preventDefault();
      return;
    }
    // Shift extends from wherever the selection already starts; a plain click
    // starts a new one and arms the drag.
    goTo(Number(cell.dataset.row), Number(cell.dataset.col), false, event.shiftKey);
    if (!event.shiftKey) dragging = true;
    table.focus();
    event.preventDefault();
  });
  table.addEventListener('mousemove', (event) => {
    const head = event.target.closest('th');
    if (!head) return;
    head.style.cursor = onEdge(head, event) !== null
      ? 'col-resize'
      : (onRowEdge(head, event) !== null ? 'row-resize' : '');
  });
  table.addEventListener('mouseover', (event) => {
    if (filling) {
      const cell = event.target.closest('td');
      if (cell && cell.dataset.row) {
        filling.to = { row: Number(cell.dataset.row), col: Number(cell.dataset.col) };
      }
      return;
    }
    if (headDrag) {
      const head = event.target.closest('th');
      if (!head) return;
      if (headDrag === 'col' && head.dataset.headCol !== undefined) {
        takeColumn(Number(head.dataset.headCol), true);
      } else if (headDrag === 'row' && head.dataset.headRow !== undefined) {
        takeRow(Number(head.dataset.headRow), true);
      }
      return;
    }
    if (!dragging) return;
    const cell = event.target.closest('td');
    if (!cell || !cell.dataset.row) return;
    goTo(Number(cell.dataset.row), Number(cell.dataset.col), false, true);
  });
  table.addEventListener('dblclick', (event) => {
    const head = event.target.closest('th');
    if (head) {
      // On the edge it fits the column; anywhere else on a header it does not
      // mean anything, and opening a cell for editing certainly is not it.
      const edge = onEdge(head, event);
      if (edge !== null) fitColumn(edge);
      return;
    }
    const cell = event.target.closest('td');
    if (cell && cell.dataset.row) edit(null);
  });

  stateBox.style.display = 'none';
  const previous = sheetBox.querySelector('table');
  if (previous) previous.remove();
  sheetBox.appendChild(table);
  // Only once it is on the page: how far down a frozen row sits, and how far
  // across a frozen column, can only be read from what was actually laid out.
  holdPanes(table, sheet);
}

function describe() {
  const sheet = book.sheets[shown];
  const style = book.default_style || {};
  const cells = sheet.rows.reduce((count, row) => count + row.cells.length, 0);
  factsBox.innerHTML = '';
  const facts = [
    ['Sheets', book.sheets.length],
    ['Rows', sheet.rows.length],
    ['Cells', cells],
    ['Standard font', style.font_name ? `${style.font_name} ${style.font_size || 11}` : 'not named'],
    ['Merged', (sheet.merge_cells || []).length],
    ['Filter', sheet.auto_filter ? 'yes' : 'no'],
  ];
  for (const [term, value] of facts) {
    factsBox.insertAdjacentHTML('beforeend', `<dt>${term}</dt><dd>${value}</dd>`);
  }

  const characters = widthOf(sheet, 0);
  const padding = Math.trunc(128 / digitWidth);
  widthBox.innerHTML =
    `A width counts digits of the standard font, with the cell's gutter already ` +
    `in it. A digit here measures <code>${digitWidth}px</code>, so column A at ` +
    `<code>${characters}</code> comes to ` +
    `<code>trunc(((256 × ${characters} + ${padding}) ÷ 256) × ${digitWidth}) = ` +
    `${columnPixels(characters)}px</code>.`;

  const gaps = sheet.unsupported_elements || [];
  missingBox.innerHTML = gaps.length
    ? gaps.map((one) => `<li>${one}</li>`).join('')
    : '<li class="none">Nothing this sheet uses is unread</li>';

  tabsBox.innerHTML = '';
  book.sheets.forEach((one, index) => {
    const tab = document.createElement('button');
    tab.textContent = one.name;
    if (index === shown) tab.className = 'on';
    tab.onclick = () => {
      shown = index;
      draw();
      describe();
      // Each sheet gets its own cursor rather than inheriting a position that
      // may not exist here; the selection does not survive the move either.
      goTo(1, 0);
      markFrozen();
    };
    tabsBox.appendChild(tab);
  });
  // Redrawing the tabs empties the strip they live in, and the selection's
  // total lives at the far end of that same strip. Put it back.
  if (countBox) tabsBox.appendChild(countBox);
}

function describeCell(address, cell) {
  const raw = typeof cell.value === 'object' && cell.value !== null
    ? Object.values(cell.value)[0]
    : (cell.value === 'Empty' ? undefined : cell.value);
  const rows = [
    ['Address', address],
    ['Stored', raw === undefined ? 'empty' : `<code>${raw}</code>`],
    ['Shows', `<code>${shownText(cell) || '(blank)'}</code>`],
    ['Format', cell.style.number_format ? `<code>${cell.style.number_format}</code>` : 'General'],
    ['Font', cell.style.font_name || 'the standard one'],
    ['Formula', cell.formula ? `<code>=${cell.formula}</code>` : 'none'],
  ];
  cellBox.innerHTML = rows
    .map(([term, value]) => `<dt>${term}</dt><dd>${value}</dd>`)
    .join('');
}

// ── Working out what a formula comes to ─────────────────────────────────────
//
// Typing `=B2+C2` and seeing nothing is the moment a grid stops being a
// spreadsheet, so the engine is asked for the answer after every edit. It is
// the same evaluator that reads the corpus, not a second one written for the
// browser — a formula must not mean one thing here and another when the file
// is opened.
//
// It cannot always be asked. What it costs is now almost entirely the crossing
// itself: the whole workbook goes over the wasm bridge and comes back, which is
// paid per CELL. The engine works out only what a change reaches, so the
// formulas are close to free beside it. On the median workbook the whole thing
// is a few milliseconds; on the largest in the corpus — 936,000 cells — it is
// forty seconds, and a workbook of the same size with NO formulas at all still
// takes twenty-two. So the page works out whether it can afford the answer
// before asking for it, and says plainly when it cannot.

// Anything past this and the sheet would visibly stop responding.
const PATIENCE = 300;
let liveCalc = true;
let anyFormulas = false;
let weight = 0;
const calcNote = document.getElementById('calcNote');

/** Roughly what a recalculation of this workbook will cost, in milliseconds. */
function calcCost() {
  let cells = 0;
  let formulas = 0;
  for (const sheet of (book ? book.sheets : [])) {
    for (const row of sheet.rows) {
      cells += row.cells.length;
      for (const cell of row.cells) if (cell.formula) formulas += 1;
    }
  }
  anyFormulas = formulas > 0;
  // Measured through the bridge from this side, middle of three runs:
  //
  //        cells  formulas   recalc
  //          149       139      7ms
  //        2,207       133     46ms
  //       14,568     2,529    344ms
  //        5,465         0     88ms
  //      645,209         0  22,077ms
  //      936,444    22,864  42,136ms
  //
  // A cell costs 13µs at a thousand of them and 34µs at six hundred thousand,
  // so the per-cell term is deliberately heavy: the point is to catch what
  // would hang, and erring that way costs a note rather than a frozen page.
  // The fixed part is the call itself.
  //
  // Erring the other way is cheap as well, which is what makes this safe to
  // keep near the measurements: `recompute` times what it really took and
  // shuts the gate itself if this was optimistic.
  return 10 + cells / 30 + formulas / 20;
}

function sayCalc(why) {
  if (!calcNote) return;
  calcNote.textContent = why || '';
  calcNote.style.display = why ? '' : 'none';
}

function weighCalc() {
  weight = calcCost();
  liveCalc = weight <= PATIENCE;
  sayCalc(liveCalc ? '' :
    'too large to work out formulas as you type — Excel will do it on open');
}

/** Ask the engine what everything comes to now. */
function recompute() {
  if (!book || !anyFormulas || !liveCalc) return;
  const started = performance.now();
  try {
    // The browser has no clock the engine can reach, so it is told what the
    // moment is. A serial: whole days since the last day of 1899, and the
    // time of day after the point, taken in local time because that is the
    // day the person at the keyboard is having.
    const now = new Date();
    const noon = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.round((noon - new Date(1899, 11, 30)) / 86400000);
    const part = (now - noon) / 86400000;
    book = recalculate_spreadsheet(book, days + part);
  } catch (error) {
    // A formula the evaluator cannot read is not a reason to stop showing the
    // sheet; leave every cached value as it was.
    liveCalc = false;
    sayCalc(`formulas could not be worked out: ${error}`);
    return;
  }
  // The estimate is a guess about a machine this code has never run on. What
  // it actually took is not, so let that have the last word.
  if (performance.now() - started > PATIENCE) {
    liveCalc = false;
    sayCalc('too slow to work out formulas as you type — Excel will do it on open');
  }
}

// ── Finding something ───────────────────────────────────────────────────────
//
// What is searched is what a cell SHOWS, because that is what the person is
// looking at: a date is found by the date on the screen rather than by the
// number underneath it, and a formula by its answer. Excel can be told to look
// at the formulas instead; this cannot, and says so rather than pretending the
// difference is not there.

const findBox = document.getElementById('find');

/// Move the cursor to the next cell showing `text`, wrapping at the end.
///
/// Starts from the cell AFTER the cursor, so pressing Enter again walks on
/// rather than finding the same cell for ever. Returns whether it found one.
function findNext(text, backwards) {
  const wanted = text.trim().toLowerCase();
  if (!wanted || !book) return false;
  const bounds = extent();
  const wide = bounds.cols + 1;
  const many = bounds.rows * wide;
  if (many <= 0) return false;
  // One number for the whole sheet, so walking on and wrapping round is
  // arithmetic rather than two nested loops with an exception at each end.
  const here = (at.row - 1) * wide + at.col;
  for (let step = 1; step <= many; step++) {
    const spot = (((here + (backwards ? -step : step)) % many) + many) % many;
    const row = Math.floor(spot / wide) + 1;
    const col = spot % wide;
    const held = heldAt(row, col);
    if (!held) continue;
    if (!shownText(held).toLowerCase().includes(wanted)) continue;
    goTo(row, col);
    paint();
    return true;
  }
  return false;
}

/// Say whether the last search found anything, on the line the sheet uses for
/// everything else it has to tell you.
function sayFound(found, text) {
  if (!text.trim()) { sayCalc(''); return; }
  sayCalc(found ? '' : `nothing shows ${text.trim()}`);
}

// ── Ruling a block of cells ─────────────────────────────────────────────────
//
// A rule belongs to a cell's edge, and two cells that meet share the line
// between them — so ruling the bottom of one row and the top of the next comes
// to the same mark. Only one of them has to be written, and the drawing
// settles which is shown.

const rulesBox = document.getElementById('rules');

// The one everybody means. Excel's own button rules thin unless told otherwise.
const THIN = { style: 'thin', color: null };

/// Rule the selection: all four edges of every cell, the outside of the block
/// only, one named edge of it, or none at all.
function wearRules(kind) {
  if (!kind) return;
  const box = region();
  restyle((was, row, col) => {
    switch (kind) {
      case 'all':
        return {
          ...was,
          border_top: THIN, border_bottom: THIN,
          border_left: THIN, border_right: THIN,
        };
      case 'none':
        return {
          ...was,
          border_top: null, border_bottom: null,
          border_left: null, border_right: null,
        };
      // The outside of the block, which is why the cell's place matters.
      case 'outline':
        return {
          ...was,
          border_top: row === box.top ? THIN : was.border_top,
          border_bottom: row === box.bottom ? THIN : was.border_bottom,
          border_left: col === box.left ? THIN : was.border_left,
          border_right: col === box.right ? THIN : was.border_right,
        };
      // One edge of the BLOCK rather than of every cell in it: ruling the
      // bottom of a selection means one line under it, not a line under every
      // row of it.
      case 'top':
        return { ...was, border_top: row === box.top ? THIN : was.border_top };
      case 'bottom':
        return {
          ...was,
          border_bottom: row === box.bottom ? THIN : was.border_bottom,
        };
      case 'left':
        return { ...was, border_left: col === box.left ? THIN : was.border_left };
      case 'right':
        return {
          ...was,
          border_right: col === box.right ? THIN : was.border_right,
        };
      default:
        return was;
    }
  });
}

// ── What colour a cell is ───────────────────────────────────────────────────
//
// A colour input cannot say "none" — it can only say white, and a white cell
// and an uncoloured one are not the same thing in a file: one names a fill and
// the other leaves the sheet's own background showing. So taking the colour
// off is a separate control rather than a value of the same one.

const fillBox = document.getElementById('fill');
const noFillButton = document.getElementById('nofill');

/// Colour every cell in the selection, or take the colour off with `null`.
function wearFill(colour) {
  restyle((was) => ({ ...was, bg_color: colour }));
}

/// Show the selection's colour, when they agree on one.
function sayFill() {
  const can = Boolean(book);
  if (fillBox) fillBox.disabled = !can;
  if (noFillButton) noFillButton.disabled = !can;
  if (!fillBox || !can) return;
  let seen = null;
  let agree = true;
  eachInRegion((row, col) => {
    const held = heldAt(row, col);
    const held_colour = (held && held.style && held.style.bg_color) || '';
    if (seen === null) seen = held_colour;
    else if (seen !== held_colour) agree = false;
  });
  // With nothing agreed, or nothing set, the input shows white — which is what
  // it would offer anyway, and is not the same as the cell being white.
  fillBox.value = agree && seen ? `#${seen}` : '#ffffff';
}

// ── How the numbers look ────────────────────────────────────────────────────
//
// A number format decides what a cell SHOWS without touching what it holds:
// 0.15 under `0%` is fifteen per cent and is still 0.15 to everything that
// reads it. The engine has known how to render them all along — the page had
// no way to choose one.

const formatBox = document.getElementById('numfmt');

// Excel's Ctrl+Shift shortcuts, by the key and by the physical key — a
// keyboard that is not American sends a different character for the same
// place on the row, and it is the place Excel means.
const FORMAT_KEYS = {
  Digit1: '#,##0.00', '!': '#,##0.00',
  Digit2: 'h:mm', '"': 'h:mm', '@': 'h:mm',
  Digit3: 'd mmm yy', '#': 'd mmm yy',
  Digit4: '$#,##0.00', '$': '$#,##0.00',
  Digit5: '0%', '%': '0%',
  Digit6: '0.00E+00', '^': '0.00E+00', '&': '0.00E+00',
  // General, which is the absence of a format.
  Backquote: '', '~': '', '`': '',
};

/// Put `code` on every cell in the selection. An empty code means General,
/// which is the absence of a format rather than a format of its own.
function wearFormat(code) {
  const wanted = code.trim();
  restyle((was) => ({
    ...was,
    number_format: wanted === '' || wanted.toLowerCase() === 'general'
      ? null
      : wanted,
  }));
}

/// Show the selection's format, or nothing when they disagree.
function sayFormat() {
  if (!formatBox) return;
  formatBox.disabled = !book;
  if (!book || document.activeElement === formatBox) return;
  let seen = null;
  let agree = true;
  eachInRegion((row, col) => {
    const held = heldAt(row, col);
    const held_format = (held && held.style && held.style.number_format) || '';
    if (seen === null) seen = held_format;
    else if (seen !== held_format) agree = false;
  });
  formatBox.value = agree && seen ? seen : '';
  formatBox.placeholder = agree ? 'General' : 'Mixed';
}

// ── Whole rows and whole columns ────────────────────────────────────────────
//
// Putting a row in moves more of a workbook than any other edit: every formula
// that names a row below it, on this sheet and on any other; the merges over
// it; the table it falls inside; the frozen rows above it. The engine does all
// of that, so the page's part is only to say which band and how many, and to
// be able to put it back.

const addBandButton = document.getElementById('addBand');
const cutBandButton = document.getElementById('cutBand');

/// Which band the selection covers, or null when it covers neither.
///
/// Excel's Insert takes whole rows or whole columns. A selection that reaches
/// from the first row to the last IS a column selection, however it was made —
/// dragging the headers and dragging the cells come to the same thing.
function bandOfSelection() {
  const bounds = extent();
  const box = region();
  const wholeColumns = box.top <= 1 && box.bottom >= bounds.rows;
  const wholeRows = box.left <= 0 && box.right >= bounds.cols;
  // A sheet one row tall makes every selection "whole columns" as well as
  // "whole rows"; rows are the commoner intent, so they win.
  if (wholeRows) return { rows: true, at: box.top, count: box.bottom - box.top + 1 };
  if (wholeColumns) return { rows: false, at: box.left, count: box.right - box.left + 1 };
  return null;
}

function sayBands() {
  const can = Boolean(book) && Boolean(bandOfSelection());
  if (addBandButton) addBandButton.disabled = !can;
  if (cutBandButton) cutBandButton.disabled = !can;
}

/// Put rows or columns in, or take them out, and remember enough to undo it.
///
/// A structural change rewrites the whole sheet, so it cannot be recorded as
/// the cell-by-cell deltas an ordinary edit is. It does not have to be:
/// `shift_band` builds a NEW workbook rather than changing this one, so the
/// one we had is still whole and can simply be kept. Undo is then a swap.
function shiftBand(count) {
  const band = bandOfSelection();
  if (!band || !book) return;
  const sheet = sheetNow();
  if (!sheet) return;
  change(() => {
    const was = book;
    try {
      book = shift_band(book, sheet.name, band.rows, band.at, count * band.count);
    } catch (error) {
      book = was;
      sayCalc(`rows could not be moved: ${error}`);
      return;
    }
    step.books = [{ was, now: book }];
  });
  beyondValues = true;
  weighCalc();
  describe();
  draw();
  paint();
  sayBands();
}

// ── Taking it back ──────────────────────────────────────────────────────────
//
// An editor without undo is one people use carefully rather than freely, and
// carefully is the wrong way to use a spreadsheet: half of what anyone does to
// one is worth trying to see how it looks. So every action that writes cells
// is bracketed into a step, and a step can be put back.

const undone = [];
const redone = [];
const backButton = document.getElementById('back');
const onButton = document.getElementById('on');

// The keyboard is how anyone actually undoes something, but a control that is
// never shown is a feature people do not know they have.
function markSteps() {
  if (backButton) backButton.disabled = undone.length === 0;
  if (onButton) onButton.disabled = redone.length === 0;
}
// The step being built. While this is a list, every write records what the
// cell held before, so it can be handed back.
let step = null;
// A cap, so a long afternoon does not grow without end. Excel keeps a hundred.
const DEPTH = 100;

/** Run `what` so that everything it writes can be undone in one go. */
function change(what) {
  if (step) { what(); return; }   // already inside a step: do not nest
  step = { sheet: shown, cells: [], columns: [], lines: [], panes: [], books: [] };
  const built = step;
  try {
    what();
  } finally {
    step = null;
  }
  if (built.cells.length === 0 && built.columns.length === 0
    && built.lines.length === 0 && built.panes.length === 0
    && built.books.length === 0) return;
  // Whatever was marked for a cut is no longer what the clipboard holds.
  if (cutFrom) cutFrom = null;
  recompute();
  undone.push(built);
  if (undone.length > DEPTH) undone.shift();
  // A fresh change is a fork: what was undone is no longer ahead of us.
  redone.length = 0;
  markSteps();
}

/** Put the cells of `step` back to `side`, and leave them selected. */
function restore(built, side) {
  if (built.sheet !== shown) {
    shown = built.sheet;
    describe();
  }
  const was = step;
  step = null;                    // putting a step back is not itself a step
  // A whole-workbook swap comes first: the cell deltas of the same step, if it
  // somehow had any, are about the workbook this puts back.
  for (let i = (built.books || []).length - 1; i >= 0; i--) {
    book = built.books[i][side];
    beyondValues = true;
  }
  for (let i = built.cells.length - 1; i >= 0; i--) {
    const one = built.cells[i];
    put(one.row, one.col, one[side], side === 'was' ? one.wasStyle : one.nowStyle);
  }
  const sheet = sheetNow();
  for (let i = built.columns.length - 1; i >= 0; i--) {
    const one = built.columns[i];
    if (sheet) sheet.col_widths[one.col] = one[side];
    beyondValues = true;
  }
  for (let i = built.panes.length - 1; i >= 0; i--) {
    const [rows, cols] = built.panes[i][side];
    if (sheet) {
      sheet.frozen_rows = rows;
      sheet.frozen_cols = cols;
    }
    beyondValues = true;
  }
  for (let i = built.lines.length - 1; i >= 0; i--) {
    const one = built.lines[i];
    const line = sheet && sheet.rows.find((held) => held.index === one.row);
    if (line) {
      line.height = one[side];
      line.custom_height = side === 'was' ? one.wasChosen : one.nowChosen;
    }
    beyondValues = true;
  }
  step = was;
  recompute();
  if ((built.books || []).length > 0) {
    // The sheet is a different shape now, so everything drawn from it has to
    // be worked out again rather than patched.
    weighCalc();
    describe();
  }
  draw();
  sayBands();
  // Show what moved. Excel selects the cells an undo touched, which is the
  // difference between trusting it and hunting for what it did.
  if (built.cells.length === 0) {
    paint();
    return;
  }
  const rows = built.cells.map((one) => one.row);
  const cols = built.cells.map((one) => one.col);
  at = { row: Math.min(...rows), col: Math.min(...cols) };
  anchor = { row: at.row, col: at.col };
  reach = { row: Math.max(...rows), col: Math.max(...cols) };
  paint();
  const holds = heldAt(at.row, at.col);
  formulaBox.value = contentOf(holds);
  if (holds) describeCell(columnName(at.col) + at.row, holds);
  else cellBox.innerHTML = '<dd class="none">empty</dd>';
}

function undo() {
  const built = undone.pop();
  if (!built) return;
  restore(built, 'was');
  redone.push(built);
  markSteps();
}

function redo() {
  const built = redone.pop();
  if (!built) return;
  restore(built, 'now');
  undone.push(built);
  markSteps();
}

for (const [id, run] of [
  ['freeze', freezeHere],
  ['bold', () => toggle('bold')],
  ['italic', () => toggle('italic')],
  ['under', () => toggle('underline')],
  ['left', () => alignTo('left')],
  ['centre', () => alignTo('center')],
  ['right', () => alignTo('right')],
]) {
  const button = document.getElementById(id);
  if (button) button.addEventListener('click', () => { run(); focusGrid(); });
}

if (findBox) {
  findBox.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    sayFound(findNext(findBox.value, event.shiftKey), findBox.value);
  });
}
if (rulesBox) {
  // A menu of actions rather than of states: what the cells are already
  // wearing is not one of the choices, so it goes back to its own name once
  // the choice is made.
  rulesBox.addEventListener('change', () => {
    wearRules(rulesBox.value);
    rulesBox.value = '';
    focusGrid();
  });
}
if (fillBox) {
  // `input` rather than `change`: a colour picker reports as it is dragged,
  // and seeing the sheet follow is how anyone knows they have the right one.
  fillBox.addEventListener('input', () => wearFill(fillBox.value.replace('#', '').toUpperCase()));
}
if (noFillButton) {
  noFillButton.addEventListener('click', () => { wearFill(null); focusGrid(); });
}
if (formatBox) {
  // Enter applies it and hands the keyboard back to the grid; leaving the box
  // applies it too, since typing a code and clicking away plainly means it.
  formatBox.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    event.preventDefault();
    wearFormat(formatBox.value);
    focusGrid();
  });
  formatBox.addEventListener('change', () => wearFormat(formatBox.value));
}
if (addBandButton) {
  addBandButton.addEventListener('click', () => { shiftBand(1); focusGrid(); });
}
if (cutBandButton) {
  cutBandButton.addEventListener('click', () => { shiftBand(-1); focusGrid(); });
}
if (backButton) backButton.addEventListener('click', () => { undo(); focusGrid(); });
if (onButton) onButton.addEventListener('click', () => { redo(); focusGrid(); });

// After pressing a control, the keyboard belongs to the sheet again — nobody
// wants their next arrow key to move between buttons.
function focusGrid() {
  const table = tableNow();
  if (table) table.focus();
}

// ── Selecting more than one cell ────────────────────────────────────────────
//
// A sheet where you can only ever be on one cell is a form. Everything people
// actually do with a spreadsheet — total a column, copy a block into an email,
// paste a table someone sent — starts by selecting a range, so the range is
// what the rest of this hangs off.

// A selection needs three cells, not two, and conflating any pair of them
// gives a grid that feels almost right. `anchor` is the corner it was started
// from and `reach` is the corner being dragged; the block is the rectangle
// between them. `at` — declared with the rest of the cursor state below — is
// the ACTIVE cell: the white one inside the block that takes what you type and
// that the formula bar describes. Drag A1 to C5 in Excel and your typing still
// goes into A1, because extending a selection moves `reach` and leaves `at`
// where it was.
let anchor = { row: 1, col: 0 };
let reach = { row: 1, col: 0 };
// True only while the mouse is down and dragging out a range, which is the one
// time Excel shows the size instead of the address in the name box.
let dragging = false;
// Set while a drag started on a header, so the drag takes whole columns or
// whole rows rather than the cells the pointer happens to cross.
let headDrag = null;

const countBox = document.getElementById('tally');

function region() {
  return {
    top: Math.min(anchor.row, reach.row),
    left: Math.min(anchor.col, reach.col),
    bottom: Math.max(anchor.row, reach.row),
    right: Math.max(anchor.col, reach.col),
  };
}

function spread() {
  const box = region();
  return box.top !== box.bottom || box.left !== box.right;
}

function eachInRegion(visit) {
  const box = region();
  for (let row = box.top; row <= box.bottom; row++) {
    for (let col = box.left; col <= box.right; col++) visit(row, col);
  }
}

// Fifteen significant digits, which is the precision Excel works to. Fewer
// throws away real value — a third of sixteen is 5.33333333333333, and cutting
// it at ten decimals would be a different number. More keeps the tail that
// binary floating point leaves behind: a tenth plus two tenths is not three
// tenths in a double, and nobody wants to be shown that.
function trim(value) {
  return String(Number(value.toPrecision(15)));
}

// Excel's status bar: how many cells hold something, and — when any of them are
// numbers — what they come to. It is the fastest way to check a column without
// writing a formula anywhere, which is most of what it gets used for.
function tally() {
  if (!countBox) return;
  if (!spread()) { countBox.textContent = ''; return; }
  let held = 0;
  let numbers = 0;
  let sum = 0;
  eachInRegion((row, col) => {
    const cell = heldAt(row, col);
    const text = contentOf(cell);
    if (text === '') return;
    held++;
    const value = cell && typeof cell.value === 'object' && cell.value !== null
      ? cell.value.Number
      : undefined;
    if (typeof value === 'number') { numbers++; sum += value; }
  });
  const parts = [`Count ${held}`];
  if (numbers > 0) {
    parts.unshift(`Sum ${trim(sum)}`);
    parts.unshift(`Average ${trim(sum / numbers)}`);
  }
  countBox.textContent = parts.join('   ');
}

function takeColumn(col, extend) {
  if (!extend) { at = { row: 1, col }; anchor = { row: 1, col }; }
  goTo(extent().rows, col, false, true);
}

function takeRow(row, extend) {
  if (!extend) { at = { row, col: 0 }; anchor = { row, col: 0 }; }
  goTo(row, extent().cols, false, true);
}

function takeAll() {
  const bounds = extent();
  at = { row: 1, col: 0 };
  anchor = { row: 1, col: 0 };
  goTo(bounds.rows, bounds.cols, false, true);
}

// Set while a column's edge is being dragged. Excel resizes as you pull rather
// than on release, so the sheet reflows under the pointer and you can see what
// you are choosing.
let sizing = null;
// How close to the edge counts as being on it.
const EDGE = 4;

/** The column whose right edge this press is on, or null. */
function onEdge(head, event) {
  if (head.dataset.headCol === undefined) return null;
  const box = head.getBoundingClientRect();
  if (event.clientX < box.right - EDGE) return null;
  return Number(head.dataset.headCol);
}

/** Show a column at `pixels` wide without writing anything down yet. */
function showWidth(col, pixels) {
  const table = tableNow();
  if (!table) return;
  const head = table.querySelector(`th[data-head-col="${col}"]`);
  if (head) head.style.width = `${Math.max(1, Math.round(pixels))}px`;
}

/** Write the dragged width into the sheet. */
function setWidth(col, pixels) {
  const sheet = sheetNow();
  if (!sheet) return;
  const width = widthForPixels(pixels);
  const was = sheet.col_widths[col] || 0;
  if (Math.abs(width - was) < 1e-6) return;
  change(() => {
    if (step) step.columns.push({ col, was, now: width });
    while (sheet.col_widths.length <= col) sheet.col_widths.push(0);
    sheet.col_widths[col] = width;
    beyondValues = true;
  });
  draw();
  paint();
}

/** The row whose bottom edge this press is on, or null. */
function onRowEdge(head, event) {
  if (head.dataset.headRow === undefined) return null;
  const box = head.getBoundingClientRect();
  if (event.clientY < box.bottom - EDGE) return null;
  return Number(head.dataset.headRow);
}

/** Show a row at `pixels` tall without writing anything down yet. */
function showHeight(row, pixels) {
  const table = tableNow();
  if (!table) return;
  const head = table.querySelector(`th[data-head-row="${row}"]`);
  if (head && head.parentElement) {
    head.parentElement.style.height = `${Math.max(1, Math.round(pixels))}px`;
  }
}

/** Write the dragged height into the sheet. */
function setHeight(row, pixels) {
  const sheet = sheetNow();
  if (!sheet) return;
  // The file states a height in points; the drag is in pixels.
  const points = Math.max(0, pixels) * 72 / 96;
  let line = sheet.rows.find((one) => one.index === row);
  const was = line ? line.height : null;
  const wasChosen = line ? Boolean(line.custom_height) : false;
  if (was !== null && Math.abs(points - was) < 1e-6 && wasChosen) return;
  change(() => {
    if (!line) {
      line = { index: row, cells: [], height: null };
      sheet.rows.push(line);
      sheet.rows.sort((a, b) => a.index - b.index);
    }
    if (step) {
      step.lines.push({ row, was, wasChosen, now: points, nowChosen: true });
    }
    line.height = points;
    // A drag is a choice, and the flag is what stops Excel working the height
    // out again the next time the file is opened.
    line.custom_height = true;
    beyondValues = true;
  });
  draw();
  paint();
}

/** Was this press on the fill handle rather than on the cell itself? */
function onHandle(cell, event) {
  const box = region();
  if (Number(cell.dataset.row) !== box.bottom || Number(cell.dataset.col) !== box.right) {
    return false;
  }
  const edge = cell.getBoundingClientRect();
  return event.clientX >= edge.right - 6 && event.clientY >= edge.bottom - 6;
}

function paint() {
  // Whether whole rows or whole columns are selected decides whether Insert
  // and Delete mean anything, and that changes with every movement.
  sayBands();
  sayFormat();
  sayFill();
  if (rulesBox) rulesBox.disabled = !book;
  if (findBox) findBox.disabled = !book;
  const table = tableNow();
  if (!table) return;
  const lit = 'td.here, td.pick, td.edge-t, td.edge-b, td.edge-l, td.edge-r';
  for (const cell of table.querySelectorAll(lit)) {
    cell.classList.remove('here', 'pick', 'edge-t', 'edge-b', 'edge-l', 'edge-r');
  }
  const box = region();
  if (spread()) {
    eachInRegion((row, col) => {
      const cell = cellAt(row, col);
      if (!cell) return;
      cell.classList.add('pick');
      if (row === box.top) cell.classList.add('edge-t');
      if (row === box.bottom) cell.classList.add('edge-b');
      if (col === box.left) cell.classList.add('edge-l');
      if (col === box.right) cell.classList.add('edge-r');
    });
  }
  for (const head of table.querySelectorAll('th.lit')) head.classList.remove('lit');
  for (const head of table.querySelectorAll('th[data-head-col]')) {
    const col = Number(head.dataset.headCol);
    if (col >= box.left && col <= box.right) head.classList.add('lit');
  }
  for (const head of table.querySelectorAll('th[data-head-row]')) {
    const row = Number(head.dataset.headRow);
    if (row >= box.top && row <= box.bottom) head.classList.add('lit');
  }
  for (const was of table.querySelectorAll('td.cut')) was.classList.remove('cut');
  if (cutFrom && cutFrom.sheet === shown) {
    for (let row = cutFrom.top; row <= cutFrom.bottom; row++) {
      for (let col = cutFrom.left; col <= cutFrom.right; col++) {
        const marked = cellAt(row, col);
        if (marked) marked.classList.add('cut');
      }
    }
  }
  const cell = cellAt(at.row, at.col);
  if (cell) cell.classList.add('here');
  // Follow the corner being dragged, not the active cell: that is the edge
  // moving off the screen. With nothing selected they are the same cell.
  const edge = cellAt(reach.row, reach.col) || cell;
  if (edge) edge.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  whereBox.textContent = dragging && spread()
    ? `${box.bottom - box.top + 1}R x ${box.right - box.left + 1}C`
    : columnName(at.col) + at.row;
  tally();
}

// ── Dragging the corner ─────────────────────────────────────────────────────
//
// The small square on the bottom-right of a selection is the fill handle, and
// pulling it is how most spreadsheet work actually gets done: number a column,
// carry a formula down a table, repeat a heading.
//
// It looks like one gesture and is several rules, and Excel picks between them
// by what was selected. Measured with `tools/metrics/_xlsx_fill_series.py`,
// which pulls each shape of selection down a real sheet and reads back what
// landed:
//
//     [5]            -> 5, 5, 5          a lone number repeats
//     [1, 2]         -> 3, 4, 5          two set the step
//     [1, 2, 4]      -> 5.33, 6.83       a line fitted through them, not the last gap
//     ['Item 1']     -> Item 2, Item 3   trailing digits count up
//     ['a', 'b']     -> a, b, a, b       with no series in it, the block repeats
//     ['Mon']        -> Tue, Wed         a list Excel knows continues
//     [1, 'a']       -> 1, a, 2, a, 3    and here is the rule behind all of it
//
// That last one is the shape of the whole thing. Excel does not read the
// selection as one series: it splits it into runs of neighbouring cells of the
// same kind, and continues each run on its own, at its own stride. So the `1`
// and the `a` interleave, each following its own rule — and a number that would
// repeat when selected alone counts up when it sits in a block, because then it
// is a run being continued rather than a cell being copied.

// Set while the handle is being pulled; holds where the pull started.
let filling = null;

// The lists Excel continues rather than repeats, read out of Excel itself with
// `Application.GetCustomListContents` rather than guessed at. This install
// carries eleven; a Japanese Excel knows the weekdays and months twice over,
// the old month names, the zodiac and the ten stems.
const LISTS = [
  ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
  ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'],
  ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
  ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August',
   'September', 'October', 'November', 'December'],
  ['日', '月', '火', '水', '木', '金', '土'],
  ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'],
  ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
  ['第1四半期', '第2四半期', '第3四半期', '第4四半期'],
  ['睦月', '如月', '弥生', '卯月', '皐月', '水無月', '文月', '葉月', '長月',
   '神無月', '霜月', '師走'],
  ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'],
  ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'],
];

// A trailing run of digits counts up and everything before it is kept, so
// "Item 1" becomes "Item 2". The digits have to be at the END: "2026年度" has
// none there and is left alone.
const TAIL = /^(.*?)(\d+)$/;

/** Wrap `index` into `length`, for indices that run off either end. */
function wrapped(index, length) {
  return ((index % length) + length) % length;
}

function numberOf(cell) {
  if (!cell || cell.formula) return null;
  const value = typeof cell.value === 'object' && cell.value !== null
    ? cell.value.Number
    : undefined;
  return typeof value === 'number' ? value : null;
}

// Excel fits a straight line through the selected numbers rather than taking
// the last gap: 1, 2, 4 continues 5.33, not 6. With evenly spaced values the
// two agree, which is why the difference goes unnoticed until they are not.
function fitLine(values) {
  const n = values.length;
  if (n === 1) return { slope: 0, base: values[0] };
  let sumX = 0;
  let sumY = 0;
  let sumXY = 0;
  let sumXX = 0;
  for (let i = 0; i < n; i++) {
    sumX += i;
    sumY += values[i];
    sumXY += i * values[i];
    sumXX += i * i;
  }
  const under = n * sumXX - sumX * sumX;
  const slope = under === 0 ? 0 : (n * sumXY - sumX * sumY) / under;
  return { slope, base: (sumY - slope * sumX) / n };
}

// What kind of thing a cell is, finely enough to say whether it belongs in the
// same run as its neighbour. Number and text is not fine enough: "Item 1" and
// "a" are both text, and Excel counts the first up while repeating the second,
// so they cannot be one run. Two numbered texts DO join, but only when they
// share a prefix — which is what makes them a series rather than a coincidence.
// What a number's format says it IS, as the step it moves by when it is
// filled on its own. Excel's format codes settle it: a `y` or a `d` outside
// quotes makes it a date, an `h` or an `s` without them a time. An `m` alone is
// no help — it means a month beside y and d, and minutes beside h.
//
// Measured: a lone date moves a day (46052 -> 46053), a lone time an hour
// (10:30 -> 11:30), where a lone plain number would just repeat.
function unitOf(cell) {
  const format = cell && cell.style && cell.style.number_format;
  if (!format) return null;
  const bare = format.replace(/"[^"]*"/g, '').replace(/\\./g, '');
  if (/[yd]/i.test(bare)) return 1;
  if (/[hs]/i.test(bare)) return 1 / 24;
  return null;
}

// Excel counts days from the last day of 1899, so that 1 January 1900 is day
// one. Everything here works in UTC: a fill that changed the answer between
// one side of midnight and the other would be a fine way to lose a day.
const DAY = 86400000;
const EPOCH = Date.UTC(1899, 11, 30);

const asDate = (serial) => new Date(EPOCH + serial * DAY);
const asSerial = (year, month, day) =>
  Math.round((Date.UTC(year, month, day) - EPOCH) / DAY);
const monthLength = (year, month) => new Date(Date.UTC(year, month + 1, 0)).getUTCDate();

/**
 * The calendar-month series running through `serials`, or null for anything
 * else.
 *
 * Two things have to hold. The dates must all fall on the same day of the
 * month, or all be the last day of theirs — a 29-day gap that happens to end
 * on 28 February is not a month, and Excel does not treat it as one. And the
 * months between them must be evenly spaced, by some number that is not zero:
 * two dates in the same month are a gap in days, not in months.
 */
function monthSeries(serials) {
  if (serials.length < 2) return null;
  // Only whole days. A serial with a time on it is a different question and
  // was not measured, so it goes down the ordinary numeric path.
  if (serials.some((one) => !Number.isInteger(one))) return null;
  const dates = serials.map(asDate);
  const days = dates.map((one) => one.getUTCDate());
  const ends = dates.map((one) =>
    one.getUTCDate() === monthLength(one.getUTCFullYear(), one.getUTCMonth()));
  const sameDay = days.every((one) => one === days[0]);
  if (!sameDay && !ends.every(Boolean)) return null;

  const months = dates.map((one) => one.getUTCFullYear() * 12 + one.getUTCMonth());
  const step = months[1] - months[0];
  if (step === 0) return null;
  for (let at = 1; at < months.length; at++) {
    if (months[at] - months[at - 1] !== step) return null;
  }
  return { from: months[0], step, day: days[0] };
}

/** The serial a month series holds at `index`, counting from its first date. */
function monthAt(plan, index) {
  const reach = plan.from + plan.step * index;
  const year = Math.floor(reach / 12);
  const month = reach - year * 12;
  // The first date's day of the month, as far as this month allows: 31 January
  // gives 30 April, and 31 May again after it.
  return asSerial(year, month, Math.min(plan.day, monthLength(year, month)));
}

function kindOf(cell) {
  if (cell && cell.formula) return 'formula';
  if (numberOf(cell) !== null) return 'number';
  const text = contentOf(cell);
  const found = inList(text);
  if (found) return 'list:' + LISTS.indexOf(found.list);
  const parts = TAIL.exec(text);
  return parts ? 'counted:' + parts[1] : 'text';
}

/** Split a line of cells into runs of neighbours of the same kind. */
function runsOf(line) {
  const out = [];
  line.forEach((cell, at) => {
    const kind = kindOf(cell);
    const last = out[out.length - 1];
    if (last && last.kind === kind) last.cells.push(cell);
    else out.push({ kind, at, cells: [cell] });
  });
  return out;
}

/** The list holding `text`, and where in it, or null. */
function inList(text) {
  for (const list of LISTS) {
    const at = list.indexOf(text);
    if (at >= 0) return { list, at };
  }
  return null;
}

/**
 * Work out how a run carries on, once, so that asking for the value at each
 * index afterwards is only arithmetic.
 *
 * `alone` is true when the whole selection is a single cell, which is the one
 * case where a number is copied rather than counted up.
 */
function planRun(run, alone) {
  const kind = run.kind.split(':')[0];
  if (kind === 'number') {
    const values = run.cells.map(numberOf);
    // Dates a whole number of months apart are a calendar series rather than a
    // straight line, and the difference is not small: 31 Jan and 28 Feb
    // continue 31 Mar under one rule and 28 Mar under the other.
    if (values.length > 1 && unitOf(run.cells[0]) === 1) {
      const months = monthSeries(values);
      if (months) return { kind: 'months', months, style: run.cells[0].style };
    }
    const line = fitLine(values);
    if (values.length === 1) {
      // A single number in a block still counts up, by one — measured on
      // [2, 'a'], which gives 3 and 4, not 3 and 5 or 2 and 2. A date or a
      // time counts up even on its own, by its own unit.
      const unit = unitOf(run.cells[0]);
      line.slope = unit !== null ? unit : (alone ? 0 : 1);
    }
    return { kind: 'number', line, style: run.cells[0].style };
  }
  if (kind === 'formula') {
    return { kind: 'formula', cells: run.cells, style: run.cells[0].style };
  }
  const texts = run.cells.map((cell) => contentOf(cell));
  if (kind === 'list') {
    // Members of one list carry on along it, so long as they sit at an even
    // stride within it; anything else is not a series and simply repeats.
    const found = texts.map(inList);
    const first = found[0];
    const stride = found.length > 1
      ? wrapped(found[1].at - first.at, first.list.length)
      : 1;
    if (found.every((one, i) =>
      wrapped(one.at - first.at, first.list.length) === i * stride)) {
      return { kind: 'list', list: first.list, at: first.at, stride,
               style: run.cells[0].style };
    }
  }
  {
    // Text that differs only in the digits it ends with is a series in those
    // digits: Item 1, Item 2 carries on to Item 3.
    const parts = texts.map((text) => TAIL.exec(text));
    if (parts.every((one) => one) && parts.every((one) => one[1] === parts[0][1])) {
      const line = fitLine(parts.map((one) => Number(one[2])));
      // Numbered text always counts up, even on its own — "Item 1" pulled down
      // gives Item 2, where a lone `1` would have given 1. The digits are what
      // make it a series, so there is nothing for a single one to be ambiguous
      // about.
      if (parts.length === 1) line.slope = 1;
      return {
        kind: 'counted',
        before: parts[0][1],
        width: parts[0][2].length,
        padded: parts[0][2].startsWith('0'),
        line,
        style: run.cells[0].style,
      };
    }
  }
  return { kind: 'repeat', texts, style: run.cells[0].style };
}

/** What a planned run holds at `index`, counting from its own first cell. */
function runValue(plan, index, spot, source) {
  if (plan.kind === 'months') return String(monthAt(plan.months, index));
  if (plan.kind === 'number') return trim(plan.line.base + plan.line.slope * index);
  if (plan.kind === 'list') {
    return plan.list[wrapped(plan.at + index * plan.stride, plan.list.length)];
  }
  if (plan.kind === 'counted') {
    const next = Math.round(plan.line.base + plan.line.slope * index);
    const digits = String(next);
    // A number written with leading zeros keeps its width: 001 goes to 002.
    return plan.before + (plan.padded ? digits.padStart(plan.width, '0') : digits);
  }
  if (plan.kind === 'repeat') {
    return plan.texts[wrapped(index, plan.texts.length)];
  }
  const cell = plan.cells[wrapped(index, plan.cells.length)];
  if (!cell) return '';
  try {
    return '=' + translate_formula('=' + cell.formula,
      spot.row - source.row, spot.col - source.col);
  } catch (error) {
    // A formula the engine cannot read is left exactly as it was rather than
    // moved by guesswork: a reference that should have moved and did not is
    // easier to notice than one moved wrongly.
    return '=' + cell.formula;
  }
}

/** The values of the selected block, read column by column or row by row. */
function seriesOf(box, down) {
  const out = [];
  if (down) {
    for (let col = box.left; col <= box.right; col++) {
      const line = [];
      for (let row = box.top; row <= box.bottom; row++) line.push(heldAt(row, col));
      out.push(line);
    }
  } else {
    for (let row = box.top; row <= box.bottom; row++) {
      const line = [];
      for (let col = box.left; col <= box.right; col++) line.push(heldAt(row, col));
      out.push(line);
    }
  }
  return out;
}

/**
 * Everything one line of the block puts into the cells beyond it.
 *
 * `steps` cells are filled, and `q` counts on from the block: the cell just
 * past it is `q = length`, and pulling backwards runs `q` negative. Which
 * position of the block that lands on, and which turn round it is, together
 * say which run answers and at what index.
 */
function fillLine(line, steps, forwards, place) {
  const runs = runsOf(line);
  const plans = runs.map((run) => planRun(run, line.length === 1));
  const written = [];
  for (let step = 1; step <= steps; step++) {
    const q = forwards ? line.length - 1 + step : -step;
    const seat = wrapped(q, line.length);
    const turn = Math.floor(q / line.length);
    const which = runs.findIndex((run, i) =>
      seat >= run.at && seat < run.at + run.cells.length);
    const run = runs[which];
    const spot = place(step);
    const index = turn * run.cells.length + (seat - run.at);
    const source = place(step, run.at + wrapped(index, run.cells.length) - seat);
    written.push({
      spot,
      text: runValue(plans[which], index, spot, source),
