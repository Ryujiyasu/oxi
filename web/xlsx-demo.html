      style: plans[which].style,
    });
  }
  return written;
}

/** Fill from the selection out to `row`/`col`, whichever direction that is. */
function fillTo(row, col) {
  const box = region();
  const below = row > box.bottom || row < box.top;
  const beside = col > box.right || col < box.left;
  if (!below && !beside) return;
  // One direction at a time, the way the handle behaves: whichever the pointer
  // has travelled further along wins.
  const down = below
    && (!beside || Math.abs(row - box.bottom) >= Math.abs(col - box.right));
  const forwards = down ? row > box.bottom : col > box.right;
  const steps = down
    ? (forwards ? row - box.bottom : box.top - row)
    : (forwards ? col - box.right : box.left - col);
  if (steps <= 0) return;

  const lines = seriesOf(box, down);
  change(() => {
    lines.forEach((line, which) => {
      // Where the cell filled at `step` sits, and — with `back` — where in the
      // block the value it copies came from.
      const place = (step, back) => down
        ? {
          row: back === undefined
            ? (forwards ? box.bottom + step : box.top - step)
            : box.top + back,
          col: box.left + which,
        }
        : {
          row: box.top + which,
          col: back === undefined
            ? (forwards ? box.right + step : box.left - step)
            : box.left + back,
        };
      for (const { spot, text, style } of fillLine(line, steps, forwards, place)) {
        put(spot.row, spot.col, text, style);
      }
    });
  });
  draw();
  // The filled cells join the selection, so the whole run is there to be
  // pulled again or taken back.
  if (down) {
    anchor = { row: forwards ? box.top : row, col: box.left };
    at = { row: anchor.row, col: anchor.col };
    goTo(forwards ? row : box.bottom, box.right, false, true);
  } else {
    anchor = { row: box.top, col: forwards ? box.left : col };
    at = { row: anchor.row, col: anchor.col };
    goTo(box.bottom, forwards ? col : box.right, false, true);
  }
}

// ── Carrying cells in and out ───────────────────────────────────────────────
//
// Tab-separated text is what every spreadsheet puts on the clipboard and what
// every one of them reads back, so a range copied here lands in Excel as cells
// rather than as one long line, and a block copied from Excel arrives here the
// same way. The HTML flavour goes alongside because that is what Excel reaches
// for first when it is the one pasting.

function fieldOf(text) {
  // A field holding a tab, a newline or a quote has to be quoted, or the other
  // end will read the one cell as several.
  return /[\t\n\r"]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}

function selectionText() {
  const box = region();
  const lines = [];
  for (let row = box.top; row <= box.bottom; row++) {
    const cells = [];
    for (let col = box.left; col <= box.right; col++) {
      cells.push(fieldOf(contentOf(heldAt(row, col))));
    }
    lines.push(cells.join('\t'));
  }
  return lines.join('\n');
}

function selectionHtml() {
  const box = region();
  const safe = (text) => text.replace(/[&<>]/g, (one) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
  })[one]);
  const lines = [];
  for (let row = box.top; row <= box.bottom; row++) {
    const cells = [];
    for (let col = box.left; col <= box.right; col++) {
      cells.push('<td>' + safe(contentOf(heldAt(row, col))) + '</td>');
    }
    lines.push('<tr>' + cells.join('') + '</tr>');
  }
  return '<table>' + lines.join('') + '</table>';
}

// Split pasted text back into a grid, honouring the quoting above: a quoted
// field may itself contain tabs and newlines, and splitting on the separators
// alone would tear such a cell into pieces.
function asGrid(text) {
  const rows = [[]];
  let field = '';
  let quoted = false;
  let seen = 0;
  const push = () => { rows[rows.length - 1].push(field); field = ''; };
  while (seen < text.length) {
    const ch = text[seen];
    if (quoted) {
      if (ch === '"' && text[seen + 1] === '"') { field += '"'; seen += 2; continue; }
      if (ch === '"') { quoted = false; seen++; continue; }
      field += ch;
      seen++;
      continue;
    }
    if (ch === '"' && field === '') { quoted = true; seen++; continue; }
    if (ch === '\t') { push(); seen++; continue; }
    if (ch === '\r' || ch === '\n') {
      push();
      rows.push([]);
      seen += ch === '\r' && text[seen + 1] === '\n' ? 2 : 1;
      continue;
    }
    field += ch;
    seen++;
  }
  push();
  // A trailing newline is a line ending, not an empty last row.
  const last = rows[rows.length - 1];
  if (rows.length > 1 && last.length === 1 && last[0] === '') rows.pop();
  return rows;
}

/**
 * Write `grid` into the sheet from the selection.
 *
 * `moving` is the block a cut marked, when this paste is completing one. The
 * cells it names have already been emptied, but their styles are wanted at the
 * far end: cutting a column of dates and pasting it somewhere else should not
 * turn them into serial numbers on the way.
 */
function pasteGrid(grid, moving) {
  if (grid.length === 0) return;
  const box = region();
  // One value into a selected block fills the block — the way it does in Excel,
  // and the reason anyone selects a block before pasting one thing.
  const single = grid.length === 1 && grid[0].length === 1;
  if (single && spread()) {
    change(() => eachInRegion((row, col) => put(row, col, grid[0][0])));
    draw();
    paint();
    return;
  }
  const top = single ? at.row : box.top;
  const left = single ? at.col : box.left;
  change(() => grid.forEach((line, down) => {
    line.forEach((text, across) => {
      put(top + down, left + across, text,
        moving ? moving.styles.get(`${down},${across}`) : undefined);
    });
  }));
  draw();
  const wide = Math.max(...grid.map((line) => line.length));
  at = { row: top, col: left };
  anchor = { row: top, col: left };
  goTo(top + grid.length - 1, left + wide - 1, false, true);
}

function clearSelection() {
  change(() => eachInRegion((row, col) => put(row, col, '')));
  draw();
  paint();
}

function busyElsewhere() {
  return !book || editor || document.activeElement === formulaBox;
}

document.addEventListener('copy', (event) => {
  if (busyElsewhere()) return;
  event.clipboardData.setData('text/plain', selectionText());
  event.clipboardData.setData('text/html', selectionHtml());
  event.preventDefault();
});

// The block a cut has marked, or null. A cut takes nothing away: it says
// which cells are going to move, and they move when they are pasted. Escape
// calls it off, and so does anything else that writes to the sheet — which is
// what makes cutting something you can change your mind about.
let cutFrom = null;

document.addEventListener('cut', (event) => {
  if (busyElsewhere()) return;
  event.clipboardData.setData('text/plain', selectionText());
  event.clipboardData.setData('text/html', selectionHtml());
  event.preventDefault();
  // The formatting travels with the cells. Cutting a column of dates and
  // pasting it elsewhere should not turn them into serial numbers on the way,
  // and by the time the paste runs the source has already been emptied.
  const box = region();
  const styles = new Map();
  for (let row = box.top; row <= box.bottom; row++) {
    for (let col = box.left; col <= box.right; col++) {
      const held = heldAt(row, col);
      if (held) styles.set(`${row - box.top},${col - box.left}`, { ...held.style });
    }
  }
  cutFrom = { sheet: shown, ...box, styles };
  paint();
});

/** Take the dashed border away; the cells it was round stay where they are. */
function dropCut() {
  if (!cutFrom) return;
  cutFrom = null;
  paint();
}

document.addEventListener('paste', (event) => {
  if (busyElsewhere()) return;
  const text = event.clipboardData.getData('text/plain');
  if (!text) return;
  event.preventDefault();
  // A cut and its paste are one action: the cells arrive and the ones they
  // came from empty, and taking that back has to undo both halves at once.
  const moving = cutFrom && cutFrom.sheet === shown ? cutFrom : null;
  cutFrom = null;
  change(() => {
    if (moving) {
      for (let row = moving.top; row <= moving.bottom; row++) {
        for (let col = moving.left; col <= moving.right; col++) put(row, col, '');
      }
    }
    pasteGrid(asGrid(text), moving);
  });
  paint();
});

// ── Keeping what was typed ──────────────────────────────────────────────────
//
// An edit you cannot save is not an edit. The file is patched rather than
// rewritten: `edit_xlsx` opens the bytes that arrived, changes the cells it is
// told about and hands the archive back, so the parts nobody touched come
// through untouched.

const saveButton = document.getElementById('save');

// The type has to travel with the value, because the same text means different
// things: `=A1` is a formula, `12` a number, `12a` text, and an empty box
// means clear the cell rather than write the empty string into it.
function edited(text) {
  if (text === '') return { value_type: 'empty', new_value: '' };
  if (text.startsWith('=')) return { value_type: 'formula', new_value: text };
  if (text.trim() !== '' && Number.isFinite(Number(text))) {
    return { value_type: 'number', new_value: text };
  }
  return { value_type: 'string', new_value: text };
}

// What each cell held before this session first wrote to it. A cell put back
// to that has nothing to save, whether by hand or by undo, and counting it
// would claim an edit the file does not need.
const pristine = new Map();

function remember(row, col, text, before) {
  const key = `${shown},${row},${col}`;
  if (!pristine.has(key)) pristine.set(key, before);
  if (pristine.get(key) === text) changes.delete(key);
  else changes.set(key, { sheet_index: shown, row, col, ...edited(text) });
  markSaved();
}

function markSaved() {
  if (!saveButton) return;
  const count = changes.size;
  // A column's width and a cell's formatting are changes with no cell value
  // behind them, so counting values alone would leave the button dark with
  // work outstanding.
  saveButton.disabled = count === 0 && !beyondValues;
  saveButton.textContent = count === 0
    ? 'Save'
    : `Save (${count} cell${count === 1 ? '' : 's'})`;
}

async function save() {
  if (!source || changes.size === 0) return;
  const was = saveButton.textContent;
  saveButton.disabled = true;
  saveButton.textContent = 'Saving…';
  try {
    // Values alone go by the narrow path, which patches only the cells named.
    // Once formatting has moved, the whole workbook has to cross, because a
    // list of values has nowhere to say what a cell should look like.
    const written = beyondValues
      ? edit_xlsx_from_workbook(source, book)
      : edit_xlsx(source, [...changes.values()]);
    const blob = new Blob([written], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName.replace(/\.xlsx$/i, '') + '-edited.xlsx';
    link.click();
    URL.revokeObjectURL(link.href);
    // What was saved is now what the file holds: the next save starts from
    // the bytes just written, so two saves in a row do not send the first
    // batch of edits twice.
    source = written;
    changes.clear();
    pristine.clear();
    beyondValues = false;
    markSaved();
  } catch (error) {
    saveButton.textContent = was;
    saveButton.disabled = false;
    stateBox.style.display = 'block';
    stateBox.textContent = `Oxi could not save: ${error}`;
  }
}

if (saveButton) saveButton.addEventListener('click', save);

// Nothing here is written to disk until Save is pressed, so leaving with edits
// outstanding loses them. The browser will only show its own wording, but it
// will show it.
window.addEventListener('beforeunload', (event) => {
  if (changes.size === 0) return;
  event.preventDefault();
  event.returnValue = '';
});

// ── Living in the grid ──────────────────────────────────────────────────────
//
// What separates a sheet from a table is that you never reach for the mouse.
// The cell you are on takes what you type, the arrows walk it, and Enter puts
// the value in and steps down ready for the next one. Excel's habits here are
// specific enough that getting them nearly right feels wrong, so they are
// spelled out rather than approximated.

let at = { row: 1, col: 0 };
// Where a run of Tabs began. Excel remembers it: Tab across three cells, press
// Enter, and you land under the cell you STARTED tabbing from, not under the
// last one. It is what makes filling in a row of a form feel like a form.
let tabHome = null;
let editor = null;

const whereBox = document.getElementById('where');
const formulaBox = document.getElementById('formula');

function tableNow() {
  return sheetBox.querySelector('table');
}

function cellAt(row, col) {
  const table = tableNow();
  return table && table.querySelector('td[data-row="' + row + '"][data-col="' + col + '"]');
}

function sheetNow() {
  return book && book.sheets && book.sheets[shown];
}

function heldAt(row, col) {
  const sheet = sheetNow();
  if (!sheet) return undefined;
  const line = sheet.rows.find((one) => one.index === row);
  return line && line.cells.find((one) => one.col === col);
}

// What the formula bar shows: the formula if there is one, else what is
// STORED — not what is displayed. A date shows as a date in the grid and as
// its own number here, which is the distinction Excel draws too.
function contentOf(cell) {
  if (!cell) return '';
  if (cell.formula) return '=' + cell.formula;
  const raw = typeof cell.value === 'object' && cell.value !== null
    ? Object.values(cell.value)[0]
    : (cell.value === 'Empty' ? '' : cell.value);
  return raw === undefined || raw === null ? '' : String(raw);
}

function extent() {
  const table = tableNow();
  if (!table) return { rows: 1, cols: 0 };
  const last = table.rows[table.rows.length - 1];
  return { rows: table.rows.length - 1, cols: last ? last.cells.length - 2 : 0 };
}

// `extend` keeps the anchor where it is and drags the far corner of the
// selection to the new cell, which is what Shift does to every movement key.
function goTo(row, col, keepTabHome, extend) {
  const bounds = extent();
  const spot = {
    row: Math.min(Math.max(1, row), bounds.rows),
    col: Math.min(Math.max(0, col), bounds.cols),
  };
  reach = { row: spot.row, col: spot.col };
  if (!extend) {
    at = { row: spot.row, col: spot.col };
    anchor = { row: spot.row, col: spot.col };
  }
  if (!keepTabHome) tabHome = null;
  if (!tableNow()) return;
  paint();
  // The panel and the formula bar always describe the ACTIVE cell, not the
  // range: with a block selected it is still one cell you are about to type
  // into, and showing the block's first cell instead would be a lie about
  // where the next keystroke lands.
  const held = heldAt(at.row, at.col);
  formulaBox.value = contentOf(held);
  if (held) describeCell(columnName(at.col) + at.row, held);
  else cellBox.innerHTML = '<dd class="none">empty</dd>';
}

// Ctrl with an arrow runs to the edge of the block you are in: to the last
// written cell if you are on written ground, else to the next written one.
// It is how anyone moves about a large sheet, and stepping a row at a time is
// not the same thing.
function runTo(dRow, dCol, extend) {
  const bounds = extent();
  let row = extend ? reach.row : at.row;
  let col = extend ? reach.col : at.col;
  const filled = (r, c) => contentOf(heldAt(r, c)) !== '';
  const started = filled(row + dRow, col + dCol);
  let moved = false;
  for (;;) {
    const nextRow = row + dRow;
    const nextCol = col + dCol;
    if (nextRow < 1 || nextRow > bounds.rows || nextCol < 0 || nextCol > bounds.cols) break;
    if (started && !filled(nextRow, nextCol)) break;
    row = nextRow;
    col = nextCol;
    moved = true;
    if (!started && filled(row, col)) break;
  }
  if (moved) goTo(row, col, false, extend);
}

// Typing over a cell replaces it; F2 opens it with what is already there.
function edit(seed) {
  const cell = cellAt(at.row, at.col);
  if (!cell || editor) return;
  const held = heldAt(at.row, at.col);
  const input = document.createElement('input');
  input.className = 'inline';
  input.value = seed === null ? contentOf(held) : seed;
  editor = { cell, input, was: cell.textContent };
  cell.textContent = '';
  cell.appendChild(input);
  input.focus();
  if (seed === null) input.select();
  else input.setSelectionRange(input.value.length, input.value.length);
}

// Put the typed text into the sheet. Excel decides then and there whether it
// is a number: `12` right-aligns, `12a` does not, and for most people that is
// the only sign a column will add up.
function put(row, col, text, style) {
  const sheet = sheetNow();
  if (!sheet) return;
  const holding = heldAt(row, col);
  const before = contentOf(holding);
  // A cell that was not there wore the empty style, not "no style": undo has
  // to be able to put a cell back to bare, and `undefined` here would mean
  // leave whatever it is wearing alone.
  const wasStyle = holding ? holding.style : {};
  // A fill hands over the style of the cell it copied from; everything else
  // leaves whatever the cell already wore.
  const nowStyle = style === undefined ? wasStyle : style;
  if (before === text && sameStyle(wasStyle, nowStyle)) return;
  if (step) step.cells.push({ row, col, was: before, now: text, wasStyle, nowStyle });
  let line = sheet.rows.find((one) => one.index === row);
  if (!line) {
    line = { index: row, cells: [], height: null };
    sheet.rows.push(line);
    sheet.rows.sort((a, b) => a.index - b.index);
  }
  let cell = line.cells.find((one) => one.col === col);
  if (!cell) {
    cell = { col: col, value: 'Empty', style: {}, formula: null, runs: [] };
    line.cells.push(cell);
    line.cells.sort((a, b) => a.col - b.col);
  }
  // Only when the text has actually changed. Working out afresh what a cell
  // holds from the text it shows is lossy — a cell holding the string "007"
  // shows "007" and would come back as the number seven — so changing only a
  // cell's look must not send it round that loop.
  if (before !== text) {
    cell.formula = text.startsWith('=') ? text.slice(1) : null;
    if (cell.formula) anyFormulas = true;
    if (cell.formula) cell.value = { String: '' };
    else if (text === '') cell.value = 'Empty';
    else if (text.trim() !== '' && Number.isFinite(Number(text))) {
      cell.value = { Number: Number(text) };
    } else cell.value = { String: text };
  }
  if (style !== undefined) {
    cell.style = { ...style };
    // Only the wide save path carries a cell's style, and it costs a crossing
    // of the whole workbook, so it is taken only when a style has actually
    // moved. Without it a filled date saves as the bare number underneath it.
    beyondValues = true;
  }
  remember(row, col, text, before);
}

/**
 * Change how the selected cells look, without touching what they hold.
 *
 * `alter` is handed a copy of each cell's style and gives one back. Excel
 * turns a whole selection on if any of it is off — press Ctrl+B on a block
 * where one cell is bold and the rest are not and everything goes bold — so
 * the decision is taken once, over the block, and then applied.
 */
/// Change the style of every cell in the selection.
///
/// `alter` is handed the row and column as well, because some changes depend
/// on where in the selection a cell falls: an outline rules the top of the top
/// row and nothing else.
function restyle(alter) {
  change(() => eachInRegion((row, col) => {
    const held = heldAt(row, col);
    const was = held ? held.style : {};
    const now = alter(was, row, col);
    if (sameStyle(was, now)) return;
    // Writing the text back unchanged is how the style rides in; put() knows
    // not to work the value out again when the text has not moved.
    put(row, col, contentOf(held), now);
  }));
  draw();
  paint();
}

/** Is every cell in the selection already wearing this? */
function allWear(has) {
  let seen = false;
  let all = true;
  eachInRegion((row, col) => {
    const held = heldAt(row, col);
    seen = true;
    if (!has(held ? held.style : {})) all = false;
  });
  return seen && all;
}

/** Turn a yes-or-no part of the style on, or off if it is on everywhere. */
function toggle(name) {
  const off = allWear((style) => Boolean(style[name]));
  restyle((style) => ({ ...style, [name]: !off }));
}

/** Line the selected cells up, or take an alignment away if it is set. */
function alignTo(where) {
  const off = allWear((style) => style.horizontal_align === where);
  restyle((style) => {
    const next = { ...style };
    if (off) delete next.horizontal_align;
    else next.horizontal_align = where;
    return next;
  });
}

/** Do two cells wear the same style? A missing one is the empty one. */
function sameStyle(one, two) {
  return JSON.stringify(one || {}) === JSON.stringify(two || {});
}

// With a block selected, Enter and Tab do not leave it: Enter walks down the
// column and wraps to the top of the next one, Tab walks across and wraps to
// the start of the next row. It is how a range gets filled in without ever
// steering, and it is why people select the block first.
function stepInside(down, across) {
  const box = region();
  const tall = box.bottom - box.top + 1;
  const wideness = box.right - box.left + 1;
  let seat = down !== 0
    ? (at.col - box.left) * tall + (at.row - box.top) + down
    : (at.row - box.top) * wideness + (at.col - box.left) + across;
  const seats = tall * wideness;
  seat = ((seat % seats) + seats) % seats;
  const spot = down !== 0
    ? { row: box.top + (seat % tall), col: box.left + Math.floor(seat / tall) }
    : { row: box.top + Math.floor(seat / wideness), col: box.left + (seat % wideness) };
  at = spot;
  paint();  // `anchor` and `reach` stay put: the block is unchanged.
  const held = heldAt(at.row, at.col);
  formulaBox.value = contentOf(held);
  if (held) describeCell(columnName(at.col) + at.row, held);
  else cellBox.innerHTML = '<dd class="none">empty</dd>';
}

function commit(then) {
  if (!editor) return;
  const text = editor.input.value;
  editor = null;
  change(() => put(at.row, at.col, text));
  draw();
  goTo(at.row, at.col, true);
  if (then) then();
}

function cancel() {
  if (!editor) return;
  const held = editor;
  editor = null;
  held.cell.textContent = held.was;
  goTo(at.row, at.col, true);
}

function onKey(event) {
  if (!book) return;
  const bounds = extent();
  if (editor) {
    if (event.key === 'Escape') {
      event.preventDefault();
      cancel();
    } else if (event.key === 'Enter') {
      event.preventDefault();
      const down = event.shiftKey ? -1 : 1;
      const back = tabHome;
      const inside = spread();
      commit(() => inside
        ? stepInside(down, 0)
        : goTo(at.row + down, back === null ? at.col : back));
    } else if (event.key === 'Tab') {
      event.preventDefault();
      const step = event.shiftKey ? -1 : 1;
      if (spread()) { commit(() => stepInside(0, step)); return; }
      if (tabHome === null) tabHome = at.col;
      commit(() => goTo(at.row, at.col + step, true));
    }
    return;
  }
  const jump = event.ctrlKey || event.metaKey;
  const wide = event.shiftKey;
  // Shift walks the corner being dragged; without it, the active cell.
  const from = wide ? reach : at;
  switch (event.key) {
    case 'ArrowUp':
      event.preventDefault();
      if (jump) runTo(-1, 0, wide); else goTo(from.row - 1, from.col, false, wide);
      break;
    case 'ArrowDown':
      event.preventDefault();
      if (jump) runTo(1, 0, wide); else goTo(from.row + 1, from.col, false, wide);
      break;
    case 'ArrowLeft':
      event.preventDefault();
      if (jump) runTo(0, -1, wide); else goTo(from.row, from.col - 1, false, wide);
      break;
    case 'ArrowRight':
      event.preventDefault();
      if (jump) runTo(0, 1, wide); else goTo(from.row, from.col + 1, false, wide);
      break;
    case 'Tab':
      event.preventDefault();
      if (spread()) { stepInside(0, event.shiftKey ? -1 : 1); break; }
      if (tabHome === null) tabHome = at.col;
      goTo(at.row, at.col + (event.shiftKey ? -1 : 1), true);
      break;
    case 'Enter':
      event.preventDefault();
      if (spread()) stepInside(event.shiftKey ? -1 : 1, 0);
      else if (tabHome !== null) goTo(at.row + 1, tabHome);
      else goTo(at.row + (event.shiftKey ? -1 : 1), at.col);
      break;
    case 'Home':
      event.preventDefault();
      goTo(jump ? 1 : from.row, 0, false, wide);
      break;
    case 'End':
      event.preventDefault();
      goTo(jump ? bounds.rows : from.row, bounds.cols, false, wide);
      break;
    case 'PageDown':
      event.preventDefault();
      goTo(from.row + 20, from.col, false, wide);
      break;
    case 'PageUp':
      event.preventDefault();
      goTo(from.row - 20, from.col, false, wide);
      break;
    case 'z':
    case 'Z':
      if (!jump) break;
      event.preventDefault();
      if (event.shiftKey) redo(); else undo();
      break;
    case 'y':
    case 'Y':
      if (!jump) break;
      event.preventDefault();
      redo();
      break;
    case 'a':
    case 'A':
      if (!jump) break;
      event.preventDefault();
      takeAll();
      break;
    case 'f':
    case 'F':
      if (!jump) break;
      // The browser's own find would search the rows the grid has drawn,
      // which on a long sheet is a fraction of it, and would leave the cursor
      // where it was.
      event.preventDefault();
      if (findBox) { findBox.focus(); findBox.select(); }
      break;
    // Excel puts the common number formats on Ctrl+Shift and the digit row.
    // The digits themselves are what arrive on a US layout; `event.code` is
    // what arrives on the others, so both are read.
    case '!': case '"': case '#': case '$': case '%': case '&':
    case '~': case '`':
      if (!jump || !event.shiftKey) break;
      event.preventDefault();
      wearFormat(FORMAT_KEYS[event.code] || FORMAT_KEYS[event.key] || '');
      break;
    // Excel's own shortcuts. Which character the plus key reports depends on
    // the keyboard and on whether Shift is down, so every spelling of it is
    // taken rather than guessing at one.
    case '+':
    case ';':
    case '=':
      if (!jump) break;
      event.preventDefault();
      shiftBand(1);
      break;
    case '-':
      if (!jump) break;
      event.preventDefault();
      shiftBand(-1);
      break;
    case 'b':
    case 'B':
      if (!jump) break;
      event.preventDefault();
      toggle('bold');
      break;
    case 'i':
    case 'I':
      if (!jump) break;
      event.preventDefault();
      toggle('italic');
      break;
    case 'u':
    case 'U':
      if (!jump) break;
      event.preventDefault();
      toggle('underline');
      break;
    case 'F2':
      event.preventDefault();
      edit(null);
      break;
    case 'Escape':
      event.preventDefault();
      dropCut();
      break;
    case 'Delete':
    case 'Backspace':
      event.preventDefault();
      clearSelection();
      break;
    default:
      // A printable key starts a new value, the way it does in Excel: you do
      // not open the cell first, you just type.
      if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        edit(event.key);
      }
  }
}

// Resizing has to hear the pointer wherever it goes: a drag that leaves the
// table is still a drag.
document.addEventListener('mousemove', (event) => {
  if (!sizing) return;
  event.preventDefault();
  if (sizing.row !== undefined) {
    showHeight(sizing.row, sizing.was + (event.clientY - sizing.from));
  } else {
    showWidth(sizing.col, sizing.was + (event.clientX - sizing.from));
  }
});

document.addEventListener('mouseup', (event) => {
  if (sizing) {
    const held = sizing;
    sizing = null;
    if (held.row !== undefined) {
      setHeight(held.row, held.was + (event.clientY - held.from));
    } else {
      setWidth(held.col, held.was + (event.clientX - held.from));
    }
    return;
  }
  headDrag = null;
  if (filling) {
    const to = filling.to;
    filling = null;
    if (to) fillTo(to.row, to.col);
    return;
  }
  if (!dragging) return;
  dragging = false;
  // The name box goes back to the anchor's address now the size has been read.
  paint();
});

document.addEventListener('keydown', (event) => {
  if (document.activeElement === formulaBox) {
    if (event.key === 'Enter') {
      event.preventDefault();
      change(() => put(at.row, at.col, formulaBox.value));
      draw();
      goTo(at.row + 1, at.col);
      const table = tableNow();
      if (table) table.focus();
    } else if (event.key === 'Escape') {
      event.preventDefault();
      formulaBox.value = contentOf(heldAt(at.row, at.col));
      const table = tableNow();
      if (table) table.focus();
    }
    return;
  }
  onKey(event);
});

async function open(data, name) {
  try {
    source = new Uint8Array(data).slice();
    fileName = name || 'workbook.xlsx';
    changes.clear();
    pristine.clear();
    beyondValues = false;
    undone.length = 0;
    redone.length = 0;
    markSaved();
    markSteps();
    book = parse_spreadsheet(new Uint8Array(data));
  } catch (error) {
    stateBox.style.display = 'block';
    stateBox.textContent = `Oxi could not read ${name}: ${error}`;
    const table = sheetBox.querySelector('table');
    if (table) table.remove();
    return;
  }
  shown = 0;
  weighCalc();
  markFrozen();
  const style = book.default_style || {};
  digitWidth = measureDigit(style.font_name, style.font_size);
  draw();
  describe();
  // A new workbook starts at its own A1 rather than wherever the last one was
  // left, and with nothing selected from it.
  goTo(1, 0);
}

async function openSample() {
  stateBox.style.display = 'block';
  stateBox.textContent = 'Reading the sample…';
  const reply = await fetch(SAMPLE);
  if (!reply.ok) {
    stateBox.textContent =
      'The sample could not be fetched. Serve this folder over http rather than opening the file directly.';
    return;
  }
  await open(await reply.arrayBuffer(), 'the sample');
}

document.getElementById('reset').onclick = openSample;
document.getElementById('pick').onchange = async (event) => {
  const file = event.target.files[0];
  if (file) await open(await file.arrayBuffer(), file.name);
};

for (const kind of ['dragenter', 'dragover']) {
  sheetBox.addEventListener(kind, (event) => {
    event.preventDefault();
    dropBox.classList.add('over');
  });
}
for (const kind of ['dragleave', 'drop']) {
  sheetBox.addEventListener(kind, (event) => {
    event.preventDefault();
    dropBox.classList.remove('over');
  });
}
sheetBox.addEventListener('drop', async (event) => {
  const file = event.dataTransfer.files[0];
  if (file) await open(await file.arrayBuffer(), file.name);
});

await init();
await openSample();
</script>
</body>
</html>
