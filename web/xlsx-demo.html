<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxi — Spreadsheet Demo</title>
<style>
:root {
  --accent: #217346;
  --accent-d: #1B5E3A;
  --accent-l: #E4F0E9;
  --rule: #D0D7DE;
  --head: #F3F5F7;
  --txt: #24292F;
  --dim: #656D76;
  --bg: #FFFFFF;
  --code: #F6F8FA;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Hiragino Sans',
    'Noto Sans JP', sans-serif;
  color: var(--txt);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: var(--accent);
  color: #fff;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  /* The bar holds enough controls to run off a narrow window, and one that
     runs off is one whose last few buttons do not exist as far as anyone
     using it is concerned. */
  flex-wrap: wrap;
  gap: 8px 14px;
  flex-shrink: 0;
}
header .name { font-weight: 700; letter-spacing: .3px; }
header .what { opacity: .9; font-size: 13px; }
header .spacer { flex: 1; }
header button, header label.file {
  background: rgba(255, 255, 255, .16);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, .3);
  border-radius: 4px;
  padding: 5px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
header button:hover, header label.file:hover { background: rgba(255, 255, 255, .28); }
header input[type=file] { display: none; }

main { flex: 1; display: flex; min-height: 0; }

#sheet {
  flex: 1;
  overflow: auto;
  background: #fff;
  position: relative;
}
/* The sheet is drawn, not laid out: `#paper` is a spacer as big as the whole
   grid so the scrollbars are the browser's own, and the canvas covers only
   what is on screen and is repainted as it scrolls. A grid of ten thousand
   rows costs one canvas either way. */
#paper { position: absolute; top: 0; left: 0; }
#sheetInk { position: sticky; top: 0; left: 0; display: block; }
#entry {
  position: absolute;
  display: none;
  font: inherit;
  border: 2px solid var(--accent);
  outline: none;
  padding: 0 2px;
  background: #fff;
  z-index: 3;
}

.bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  flex-shrink: 0;
}
.bar #where {
  min-width: 78px;
  font-size: 13px;
  padding: 3px 8px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--head);
}
.bar .fx { color: var(--dim); font-style: italic; font-size: 13px; }
.bar input {
  flex: 1;
  font: inherit;
  font-size: 13px;
  padding: 3px 8px;
  border: 1px solid var(--rule);
  border-radius: 3px;
}
.bar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

aside {
  width: 340px;
  border-left: 1px solid var(--rule);
  overflow-y: auto;
  padding: 14px 16px;
  background: #FBFCFD;
  flex-shrink: 0;
}
aside h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--dim);
  margin: 18px 0 8px;
  font-weight: 600;
}
aside h2:first-child { margin-top: 0; }
aside dl { display: grid; grid-template-columns: 108px 1fr; gap: 5px 10px; font-size: 13px; }
aside dt { color: var(--dim); }
aside dd { word-break: break-all; }
aside code {
  font-family: 'Cascadia Mono', Consolas, monospace;
  background: var(--code);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 1px 4px;
  font-size: 12px;
}
aside .sum { font-size: 13px; line-height: 1.6; color: var(--dim); }
aside .none { color: var(--dim); font-style: italic; font-size: 13px; }
aside ul { list-style: none; font-size: 13px; }
aside ul li { padding: 3px 0 3px 14px; position: relative; }
aside ul li::before { content: '·'; position: absolute; left: 4px; color: var(--dim); }

.tabs {
  display: flex;
  gap: 2px;
  padding: 4px 10px;
  border-top: 1px solid var(--rule);
  background: var(--head);
  flex-shrink: 0;
}
.tabs button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font: inherit;
  font-size: 13px;
  padding: 4px 12px;
  cursor: pointer;
  color: var(--dim);
}
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

#drop {
  position: absolute;
  inset: 0;
  background: rgba(33, 115, 70, .08);
  border: 2px dashed var(--accent);
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--accent-d);
  font-size: 15px;
  z-index: 5;
}
#drop.over { display: flex; }
#state { padding: 40px; color: var(--dim); font-size: 14px; }
:root { --rule-firm: #8a8f98; }

/* Said once, quietly, beside the formula it applies to. */
.bar #calcNote {
  flex: none;
  padding: 0 12px;
  color: var(--dim);
  font-size: 11px;
  white-space: nowrap;
}

/* The two arrows sit together as one control, the way a toolbar pairs them. */
header .step { font-size: 15px; line-height: 1; padding: 5px 9px; }
header .dress { min-width: 30px; padding: 5px 7px; line-height: 1; }
header #left { margin-left: 6px; }
header #back { margin-left: 6px; }
header #on { margin-right: 4px; }

/* What the selection comes to, where Excel puts it: the far end of the strip
   the sheet tabs sit in. */
#tally {
  margin-left: auto;
  padding: 0 14px;
  color: var(--dim);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
</style>
</head>
<body>

<header>
  <span class="name">Oxi</span>
  <span class="what">Spreadsheets drawn and edited in the browser, with no server</span>
  <span class="spacer"></span>
  <button id="freeze" title="Hold everything above and left of the cursor in view">Freeze</button>
  <button id="bold" class="dress" title="Bold (Ctrl+B)"><b>B</b></button>
  <button id="italic" class="dress" title="Italic (Ctrl+I)"><i>I</i></button>
  <button id="under" class="dress" title="Underline (Ctrl+U)"><u>U</u></button>
  <button id="left" class="dress" title="Align left">&#8676;</button>
  <button id="centre" class="dress" title="Centre">&#8677;&#8676;</button>
  <button id="right" class="dress" title="Align right">&#8677;</button>
  <button id="wrap" class="dress" title="Wrap the text inside the cell">&#8617;</button>
  <input id="find" disabled placeholder="Find" title="Find (Ctrl+F). Enter for the next, Shift+Enter for the one before." />
  <select id="rules" disabled title="Rules around the cells">
    <option value="">Rules</option>
    <option value="all">All</option>
    <option value="outline">Outline</option>
    <option value="top">Top</option>
    <option value="bottom">Bottom</option>
    <option value="left">Left</option>
    <option value="right">Right</option>
    <option value="none">None</option>
  </select>
  <input id="face" list="faces" disabled placeholder="Font"
         title="The typeface the cells are set in" />
  <datalist id="faces"></datalist>
  <input id="points" list="sizes" disabled placeholder="Size"
         title="How big the text is, in points" />
  <datalist id="sizes">
    <option value="8"></option><option value="9"></option>
    <option value="10"></option><option value="11"></option>
    <option value="12"></option><option value="14"></option>
    <option value="16"></option><option value="18"></option>
    <option value="20"></option><option value="24"></option>
    <option value="28"></option><option value="36"></option>
    <option value="48"></option><option value="72"></option>
  </datalist>
  <input id="ink" type="color" disabled title="Text colour" />
  <button id="autoink" disabled title="Automatic text colour">Auto</button>
  <select id="merge" disabled title="Draw a block of cells as one">
    <option value="">Merge</option>
    <option value="centre">Merge &amp; centre</option>
    <option value="cells">Merge cells</option>
    <option value="across">Merge across</option>
    <option value="unmerge">Unmerge</option>
  </select>
  <input id="fill" type="color" disabled title="Fill colour" />
  <button id="nofill" disabled title="No fill">&#8709;</button>
  <input id="numfmt" list="numfmts" disabled placeholder="Format"
         title="How the numbers look. Any Excel format code, or pick one." />
  <datalist id="numfmts">
    <option value="General">1234.5678 &#8594; 1234.5678</option>
    <option value="0">1234.5678 &#8594; 1235</option>
    <option value="0.00">1234.5678 &#8594; 1234.57</option>
    <option value="#,##0">1234.5678 &#8594; 1,235</option>
    <option value="#,##0.00">1234.5678 &#8594; 1,234.57</option>
    <option value="0%">0.15 &#8594; 15%</option>
    <option value="0.00%">0.15 &#8594; 15.00%</option>
    <option value="$#,##0.00">1234.5678 &#8594; $1,234.57</option>
    <option value="&#165;#,##0">1234.5678 &#8594; &#165;1,235</option>
    <option value="&#8364;#,##0.00">1234.5678 &#8594; &#8364;1,234.57</option>
    <option value="yyyy-mm-dd">45297 &#8594; 2024-01-06</option>
    <option value="d mmm yyyy">45297 &#8594; 6 Jan 2024</option>
    <option value="h:mm">0.75 &#8594; 18:00</option>
    <option value="h:mm AM/PM">0.75 &#8594; 6:00 PM</option>
    <option value="0.00E+00">1234.5678 &#8594; 1.23E+03</option>
  </datalist>
  <button id="addBand" disabled title="Insert rows or columns (Ctrl+Shift+Plus)">Insert</button>
  <button id="cutBand" disabled title="Delete rows or columns (Ctrl+Minus)">Delete</button>
  <button id="back" class="step" disabled title="Undo (Ctrl+Z)">&#8630;</button>
  <button id="on" class="step" disabled title="Redo (Ctrl+Y)">&#8631;</button>
  <button id="save" disabled>Save</button>
  <button id="reset">Sample workbook</button>
  <label class="file">Open a .xlsx<input type="file" id="pick" accept=".xlsx"></label>
</header>

<div class="bar">
  <span id="where">A1</span>
  <span class="fx">fx</span>
  <input id="formula" spellcheck="false" autocomplete="off">
  <span id="calcNote" style="display:none"></span>
</div>

<main>
  <div id="sheet">
    <canvas id="sheetInk"></canvas>
    <div id="paper"></div>
    <input id="entry" spellcheck="false" autocomplete="off">
    <div id="state">Loading the engine…</div>
    <div id="drop">Drop a .xlsx here</div>
  </div>
  <aside>
    <h2>What Oxi read</h2>
    <dl id="facts"></dl>
    <h2>Column width</h2>
    <p class="sum" id="widthRule"></p>
    <h2>Selected cell</h2>
    <dl id="cellFacts"><dd class="none">Click a cell</dd></dl>
    <h2>Not yet drawn</h2>
    <ul id="missing"><li class="none">—</li></ul>
  </aside>
</main>

<div class="tabs" id="tabs"><span id="tally"></span></div>

<script type="module">
import init, { parse_spreadsheet, format_cell_number, edit_xlsx,
               edit_xlsx_from_workbook, recalculate_spreadsheet,
               translate_formula, shift_band } from './oxidocs_wasm.js';
// The row model is the renderer's own, written out once in JS: what the grid
// draws and what the row heights are measured with cannot drift apart.
import { explainRow, mayBreak } from './row-model.js';

const SAMPLE = './samples/quarterly-sales.xlsx';
/// A stored column width already carries the gutter either side of a cell's
/// text, so it is not the width a person types into Excel: typing 10 stores
/// 10.625. Pixels come back out of it by OOXML's own rule, confirmed to the
/// pixel against a ruled worksheet.

const sheetBox = document.getElementById('sheet');
const stateBox = document.getElementById('state');
const dropBox = document.getElementById('drop');
const factsBox = document.getElementById('facts');
const cellBox = document.getElementById('cellFacts');
const missingBox = document.getElementById('missing');
const widthBox = document.getElementById('widthRule');
const tabsBox = document.getElementById('tabs');

let book = null;
let shown = 0;
// The file as it arrived. Saving patches THAT rather than writing a workbook
// out afresh: everything the sheet carries and this page never modelled —
// charts, pictures, print settings, the styles of cells nobody touched —
// stays exactly as its author left it. A save that rebuilds the file from
// what the screen knows is how an editor quietly throws that away.
let source = null;
let fileName = 'workbook.xlsx';
// One entry per cell that has been changed, keyed by sheet/row/column so
// typing into the same cell twice sends one edit, not two.
const changes = new Map();
// Whether anything has changed that a list of cell values cannot express: a
// column's width, or the formatting a fill carried across. Saving those needs
// the whole workbook to travel, and a date that arrives without its format is
// a five-figure number.
let beyondValues = false;
let digitWidth = 7;

/// The width of a digit in the workbook's standard font, which is the unit a
/// column width is stated in.
/** How wide `text` is, drawn the way the cell holding it is drawn. */
function inkOf(text, style) {
  const canvas = inkOf.canvas || (inkOf.canvas = document.createElement('canvas'));
  const pen = canvas.getContext('2d');
  const standard = (book && book.default_style) || {};
  const points = style.font_size || standard.font_size || 11;
  const family = style.font_name || standard.font_name || 'Calibri';
  pen.font = `${style.italic ? 'italic ' : ''}${style.bold ? 'bold ' : ''}`
    + `${points * 96 / 72}px "${family}", Calibri, sans-serif`;
  return pen.measureText(text).width;
}

// The room Excel leaves either side of the text. Twelve pixels at the sizes
// anyone actually uses, growing by two for every seven pixels of em: ten at
// 6pt, twelve to 11.5, fourteen to 16.5, sixteen to 22, eighteen to 27.
function padFor(points) {
  const em = (points || 11) * 96 / 72;
  return 10 + 2 * Math.max(0, 1 + Math.floor((em - 26 / 3) / 7));
}

// An indent pushes the text in, and the column has to make room for it:
// "Hello" comes out 47px plain and 83px indented three.
const INDENT = 12;

/**
 * How wide column `col` has to be to show everything in it.
 *
 * Returns null when there is nothing to fit, which is not the same as a width
 * of nothing: a column of merged cells has no answer, and Excel leaves it
 * exactly as it is rather than closing it up.
 */
function fitWidth(col) {
  const sheet = sheetNow();
  if (!sheet) return null;
  const covered = new Set();
  for (const merge of sheet.merge_cells || []) {
    for (let row = merge.start_row; row <= merge.end_row; row++) {
      for (let across = merge.start_col; across <= merge.end_col; across++) {
        covered.add(`${row},${across}`);
      }
    }
  }
  let widest = null;
  for (const line of sheet.rows) {
    const cell = line.cells.find((one) => one.col === col);
    if (!cell) continue;
    // Merged cells are ignored, which is why autofit so often looks like it
    // did nothing at all. And a wrapped cell is not fitted to its text either:
    // Excel picks a width to suit the row's height there, and the same words
    // in the same font came out two different widths in two sheets.
    if (covered.has(`${line.index},${col}`)) continue;
    if (cell.style.wrap_text) continue;
    const text = shownText(cell);
    if (text === '') continue;
    const points = cell.style.font_size;
    const wants = inkOf(text, cell.style)
      + (cell.style.indent || 0) * INDENT
      + padFor(points);
    if (widest === null || wants > widest) widest = wants;
  }
  return widest;
}

/** Make column `col` as wide as its contents, as a double-click does. */
function fitColumn(col) {
  const wants = fitWidth(col);
  if (wants === null) return;
  setWidth(col, Math.ceil(wants));
}

function measureDigit(name, points) {
  const canvas = measureDigit.canvas ||= document.createElement('canvas');
  const pen = canvas.getContext('2d');
  const family = name ? `"${name}"` : 'Calibri';
  pen.font = `${(points || 11) * 96 / 72}px ${family}, Calibri, sans-serif`;
  return Math.round(pen.measureText('0').width);
}

/// Excel's own default when a sheet names no width of its own.
const DEFAULT_CHARACTERS = 8.43;

function widthOf(sheet, column) {
  const named = sheet.col_widths[column];
  if (named > 0) return named;
  return sheet.default_col_width > 0 ? sheet.default_col_width : DEFAULT_CHARACTERS;
}

// The width to store for a column someone has dragged to `pixels` wide.
//
// A stored width times the digit width IS the pixel width: Excel stores 10.625
// for a column typed as 10, and 10.625 x 8 is the 85 pixels it draws. The
// gutter either side of the text is already inside the stored number, which is
// why it is not the number Excel's own box shows.
function widthForPixels(pixels) {
  return Math.max(0, pixels) / digitWidth;
}

function columnPixels(width) {
  const padding = Math.trunc(128 / digitWidth);
  return Math.trunc(((256 * width + padding) / 256) * digitWidth);
}

function columnName(index) {
  let name = '';
  for (let n = index; n >= 0; n = Math.floor(n / 26) - 1) {
    name = String.fromCharCode(65 + (n % 26)) + name;
  }
  return name;
}

/// What a cell shows, which is its value put through its number format.
/// How OOXML's rules are drawn, by the name the file gives each.
///
/// The widths are what a spreadsheet shows: one pixel for the light rules, two
/// for medium, three for thick. `double` is a pair of lines and the browser
/// needs three pixels to find room for them. A hair rule is a single pixel of
/// something fainter than black, which is the nearest a screen gets to the
/// mark a printer would make.
const RULES = {
  thin: '1px solid',
  hair: '1px solid',
  dotted: '1px dotted',
  dashed: '1px dashed',
  dashDot: '1px dashed',
  dashDotDot: '1px dashed',
  medium: '2px solid',
  mediumDashed: '2px dashed',
  mediumDashDot: '2px dashed',
  mediumDashDotDot: '2px dashed',
  slantDashDot: '2px dashed',
  thick: '3px solid',
  double: '3px double',
};

/// Put one of a cell's four rules on it, if it has one there.
///
/// A rule the file does not name is not drawn, and the cell keeps the faint
/// grid line the stylesheet gives every cell — that is the line Excel shows
/// where a sheet has no rule of its own.
function rule(cell, side, line) {
  if (!line || !line.style) return;
  const drawn = RULES[line.style];
  if (!drawn) return;
  // A hair rule names no width of its own, so it is told apart by colour.
  const ink = line.color ? `#${line.color}`
    : (line.style === 'hair' ? 'var(--rule)' : '#000');
  cell.style[`border${side}`] = `${drawn} ${ink}`;
}

function shownText(cell) {
  const value = cell.value;
  if (value === null || value === undefined) return '';
  // A variant that carries nothing arrives as its own name, not as an object.
  if (typeof value === 'string') return value === 'Empty' ? '' : value;
  if (typeof value === 'object') {
    if ('Number' in value) {
      return cell.style.number_format
        ? format_cell_number(value.Number, cell.style.number_format)
        : String(value.Number);
    }
    if ('String' in value) return value.String;
    if ('Boolean' in value) return value.Boolean ? 'TRUE' : 'FALSE';
    if ('Error' in value) return value.Error;
  }
  return '';
}

function isNumber(cell) {
  return typeof cell.value === 'object' && cell.value !== null && 'Number' in cell.value;
}

/**
 * Hold everything above and left of the cursor, or let it all go again.
 *
 * Excel freezes at the active cell rather than at a chosen line: standing on
 * C4 and freezing holds three rows and two columns. The same command undoes
 * it once a sheet is frozen, which is why this is one control and not two.
 */
function freezeHere() {
  const sheet = sheetNow();
  if (!sheet) return;
  const on = (sheet.frozen_rows || 0) > 0 || (sheet.frozen_cols || 0) > 0;
  const rows = on ? 0 : at.row - 1;
  const cols = on ? 0 : at.col;
  if (rows === (sheet.frozen_rows || 0) && cols === (sheet.frozen_cols || 0)) return;
  change(() => {
    if (step) {
      step.panes.push({
        was: [sheet.frozen_rows || 0, sheet.frozen_cols || 0],
        now: [rows, cols],
      });
    }
    sheet.frozen_rows = rows;
    sheet.frozen_cols = cols;
    beyondValues = true;
  });
  draw();
  paint();
  markFrozen();
}

/** Say whether the sheet on screen is frozen, on the control that does it. */
function markFrozen() {
  const button = document.getElementById('freeze');
  if (!button) return;
  const sheet = sheetNow();
  const on = sheet && ((sheet.frozen_rows || 0) > 0 || (sheet.frozen_cols || 0) > 0);
  button.textContent = on ? 'Unfreeze' : 'Freeze';
  button.title = on
    ? 'Let the held rows and columns scroll again'
    : 'Hold everything above and left of the cursor in view';
}

/**
 * Keep the sheet's frozen rows and columns in view while the rest scrolls.
 *
 * A workbook says `<pane ySplit="1" state="frozen"/>` to mean "hold the top
 * row", counting in cells. The header strip is already pinned at the top, so a
 * held row sits below it, and each held row below the one before — which is
 * why the offsets are added up from the sizes the browser actually gave them
 * rather than from the sizes the file asked for.
 */
/**
 * Where the sheet is held.
 *
 * A workbook says `<pane ySplit="1" state="frozen"/>` to mean "hold the top
 * row", counting in cells. The canvas paints the held rows and columns as
 * bands of their own rather than scrolling them, so all this has to answer is
 * how many there are — which is what everything else asks it.
 */
function holdPanes(sheet) {
  return {
    rows: Math.max(0, (sheet && sheet.frozen_rows) || 0),
    cols: Math.max(0, (sheet && sheet.frozen_cols) || 0),
  };
}

// ─── The sheet as it is drawn ──────────────────────────────────────────────
//
// The grid is painted, not laid out. A table of DOM cells could only ever show
// an approximation of the sheet — the browser decides where the words sit, how
// a line breaks, where two rules meet — and the point of this page is the
// other thing: the sheet as the renderer draws it, by the laws measured off
// Excel. So the same laws draw it here, on a canvas, and the editing sits on
// top of the drawing rather than the drawing standing in for it.
//
// `#paper` is a spacer as big as the whole grid, so the scrollbars are the
// browser's own; the canvas covers only what is on screen and is repainted as
// it scrolls. A sheet of ten thousand rows costs one canvas either way.

const HEAD_HIGH = 21;           // the strip of column letters
const HANDLE = 5;               // the square at the corner of a selection

/** One context to ask about text with, kept rather than made each time. */
function measurer() {
  return measurer.pen ||= document.createElement('canvas').getContext('2d');
}

/** The face a cell wears, written the way a canvas wants it. */
function fontOf(style, size) {
  const points = size ?? style?.font_size ?? book?.default_style?.font_size ?? 11;
  const face = style?.font_name || book?.default_style?.font_name || 'Calibri';
  return `${style?.italic ? 'italic ' : ''}${style?.bold ? '700 ' : ''}` +
    `${Math.round(points * 96 / 72)}px "${face}", "Yu Gothic", sans-serif`;
}

const advances = new Map();
/**
 * One character's advance.
 *
 * Excel measures each character on its own rather than the run as a whole, so
 * a line here is the sum of single characters too. Held because a sheet asks
 * the same question thousands of times a repaint.
 */
function advance(font, letter) {
  const key = `${font}|${letter}`;
  let held = advances.get(key);
  if (held === undefined) {
    const pen = measurer();
    pen.font = font;
    held = Math.round(pen.measureText(letter).width);
    advances.set(key, held);
  }
  return held;
}

function inkWidth(font, text) {
  let total = 0;
  for (const letter of String(text)) total += advance(font, letter);
  return total;
}

/**
 * The room Excel keeps either side of a cell's text.
 *
 * Not a constant: it is the cell font's own digit, in bands — a digit of 6 to
 * 8 pixels keeps 3 and 2, 9 to 12 keeps 4 and 3, and so on. Measured on Excel
 * and carried by the renderer as `gutters()`.
 */
function gutters(font) {
  const pen = measurer();
  pen.font = font;
  const digit = Math.round(pen.measureText('0').width) || 7;
  if (digit <= 8) return [3, 2];
  if (digit <= 12) return [4, 3];
  if (digit <= 16) return [5, 4];
  return [6, 5];
}

/** One level of indent: three spaces of the workbook's FIRST font. */
function indentStep() {
  const sheet = sheetNow();
  const named = (sheet && (sheet.first_font || sheet.normal_font)) || ['Calibri', 11];
  const pen = measurer();
  pen.font = `${Math.round((named[1] || 11) * 96 / 72)}px "${named[0]}", sans-serif`;
  return 3 * Math.round(pen.measureText(' ').width || 4);
}

/**
 * Where a line breaks in the room it is given, one advance at a time, held
 * back from any mark that may not start a line.
 */
function breakLines(font, text, room) {
  const held = [];
  for (const paragraph of String(text).split('\n')) {
    const letters = [...paragraph];
    if (!room || !letters.length) { held.push(paragraph); continue; }
    let at = 0;
    while (at < letters.length) {
      let take = 0;
      let run = 0;
      while (at + take < letters.length) {
        const next = run + advance(font, letters[at + take]);
        if (take > 0 && next > room) break;
        run = next;
        take += 1;
      }
      while (take > 1 && at + take < letters.length
             && !mayBreak(letters[at + take - 1], letters[at + take])) take -= 1;
      held.push(letters.slice(at, at + take).join(''));
      at += take;
    }
  }
  return held;
}

/** A stored colour, which may or may not carry an alpha byte in front. */
function tint(hex, fallback) {
  if (!hex) return fallback;
  const held = String(hex).replace('#', '');
  return `#${held.length === 8 ? held.slice(2) : held}`;
}

/** How wide a rule of this kind is drawn, and whether it is broken. */
function ruleOf(border) {
  if (!border) return null;
  const kind = border.style || 'thin';
  if (kind === 'none') return null;
  const width = kind === 'thick' ? 3 : kind === 'medium' || kind === 'mediumDashed' ? 2 : 1;
  const dash = kind.includes('dot') || kind === 'hair' ? [1, 1]
    : kind.toLowerCase().includes('dash') ? [3, 1] : [];
  return { width, dash, colour: tint(border.color, '#000000'), double: kind === 'double' };
}

/** Which cells a merge covers, and which of them is the one that is written. */
function mergeMap(sheet) {
  const covered = new Map();
  for (const held of sheet.merge_cells || []) {
    for (let row = held.start_row; row <= held.end_row; row += 1) {
      for (let col = held.start_col; col <= held.end_col; col += 1) {
        covered.set(`${row},${col}`, {
          anchor: row === held.start_row && col === held.start_col,
          span: held,
        });
      }
    }
  }
  return covered;
}

/**
 * Where every column and row of the sheet on screen stands.
 *
 * Held between repaints because everything else — the hit test, the editor's
 * box, the scroll extent — asks it the same questions, and because a row's
 * height is worked out from its contents and is not cheap.
 */
let geom = null;

function layout() {
  const sheet = sheetNow();
  if (!sheet) { geom = null; return null; }
  digitWidth = measureDigit(book.default_style?.font_name, book.default_style?.font_size)
    || digitWidth;

  let lastRow = 0;
  let lastCol = 0;
  for (const row of sheet.rows) {
    for (const cell of row.cells) {
      if (shownText(cell) === '') continue;
      lastRow = Math.max(lastRow, row.index);
      lastCol = Math.max(lastCol, cell.col);
    }
  }
  // A merge is part of the sheet whether anything is written in it or not, so
  // the grid has to reach far enough to draw one.
  for (const merge of sheet.merge_cells || []) {
    lastRow = Math.max(lastRow, merge.end_row);
    lastCol = Math.max(lastCol, merge.end_col);
  }
  // A drawing anchored past the written cells is part of the sheet too, so the
  // grid has to reach far enough to scroll to it. One that carries its own
  // extent instead of an end anchor says nothing about cells, so it cannot ask
  // for more of them.
  for (const drawn of sheet.drawings || []) {
    if (!drawn.to) continue;
    lastRow = Math.max(lastRow, drawn.to.row + 1);
    lastCol = Math.max(lastCol, drawn.to.col);
  }
  // And far enough that there is somewhere to type in an empty sheet.
  lastCol = Math.max(lastCol, 9);
  lastRow = Math.max(lastRow, 24);

  const hiddenCols = new Set(sheet.hidden_cols || []);
  const cols = [0];
  for (let col = 0; col <= lastCol; col += 1) {
    cols.push(cols[col] + (hiddenCols.has(col) ? 0 : columnPixels(widthOf(sheet, col))));
  }

  const held = new Map(sheet.rows.map((row) => [row.index, row]));
  const tops = [0, 0];        // tops[r] is the top of row r; row 1 starts at 0
  const step = (face, points, bold, italic, letter) =>
    advance(`${italic ? 'italic ' : ''}${bold ? '700 ' : ''}`
      + `${Math.round(points * 96 / 72)}px "${face}", sans-serif`, letter);
  for (let index = 1; index <= lastRow; index += 1) {
    const row = held.get(index);
    let px;
    if (row && row.hidden) px = 0;
    else if (row && row.custom_height && row.height) px = Math.trunc(row.height * 96 / 72);
    else {
      // A height Excel worked out for itself is a cache of what the row
      // needed, and Excel works it out again — so this does too, by the rules
      // the renderer measures rows with.
      try {
        px = explainRow({
          sheet, index, row, columns: cols, heightOf: () => undefined, advance: step,
        }).px;
      } catch {
        px = Math.trunc(((row && row.height) || sheet.default_row_height || 15) * 96 / 72);
      }
    }
    tops.push(tops[index] + px);
  }

  // Excel's grid does not stop where the writing stops: it fills the window,
  // and a sheet with one cell in it still shows columns and rows out to the
  // edge. So the grid is grown at the default width and height until it
  // covers what is on screen — which also keeps a scrollbar from appearing on
  // a sheet that fits.
  // How far the grid is DRAWN and how far it SCROLLS are two questions. The
  // scroll runs to the last written cell, so a sheet that fits the window has
  // no scrollbar; the drawing runs to the edge of the window whatever the
  // sheet holds, and a screenful further, so that the grid never runs out from
  // under a box that turns out to be bigger than it measured.
  const paper = { across: cols[lastCol + 1], down: tops[lastRow + 1] };
  const room = 400;
  const view = {
    w: (sheetBox ? sheetBox.clientWidth : 0) + room,
    h: (sheetBox ? sheetBox.clientHeight : 0) + room,
  };
  const spare = columnPixels(widthOf(sheet, lastCol + 1));
  while (cols[cols.length - 1] < view.w && lastCol < 16383) {
    lastCol += 1;
    cols.push(cols[cols.length - 1] + spare);
  }
  const line = Math.trunc((sheet.default_row_height || 15) * 96 / 72);
  while (tops[tops.length - 1] < view.h && lastRow < 1048575) {
    lastRow += 1;
    tops.push(tops[tops.length - 1] + line);
  }

  // The row-number strip is as wide as the widest number it has to show.
  const pen = measurer();
  pen.font = '12px "Segoe UI", sans-serif';
  const headWide = Math.max(30, Math.ceil(pen.measureText(String(lastRow)).width) + 14);

  geom = {
    cols,
    tops,
    lastRow,
    lastCol,
    headWide,
    headHigh: HEAD_HIGH,
    across: cols[lastCol + 1],
    down: tops[lastRow + 1],
    paperAcross: paper.across,
    paperDown: paper.down,
    frozenRows: Math.max(0, sheet.frozen_rows || 0),
    frozenCols: Math.max(0, sheet.frozen_cols || 0),
    covered: mergeMap(sheet),
  };
  geom.heldWide = geom.cols[Math.min(geom.frozenCols, lastCol + 1)];
  geom.heldHigh = geom.tops[Math.min(geom.frozenRows + 1, lastRow + 1)];
  return geom;
}

/** The box a cell covers in the sheet's own coordinates, merges included. */
function boxOf(row, col) {
  if (!geom) return null;
  const held = geom.covered.get(`${row},${col}`);
  const span = held && held.span;
  const lastRow = span ? span.end_row : row;
  const lastCol = span ? span.end_col : col;
  return {
    left: geom.cols[Math.min(col, geom.cols.length - 1)] ?? 0,
    right: geom.cols[Math.min(lastCol + 1, geom.cols.length - 1)] ?? 0,
    top: geom.tops[Math.min(row, geom.tops.length - 1)] ?? 0,
    bottom: geom.tops[Math.min(lastRow + 1, geom.tops.length - 1)] ?? 0,
  };
}

/** Where a point of the sheet lands on the screen, frozen bands and all. */
function onScreen(x, y) {
  return {
    x: geom.headWide + (x < geom.heldWide ? x : x - sheetBox.scrollLeft),
    y: geom.headHigh + (y < geom.heldHigh ? y : y - sheetBox.scrollTop),
  };
}

// The frozen corner splits the sheet into four bands, and the split IS the
// freeze: a band left of the held width never takes the horizontal scroll, one
// above the held height never takes the vertical, and the corner band takes
// neither — which is why a cell held both ways stays put in both directions
// while its neighbours held one way only slide past it.
/** The four bands the sheet is painted in, each with the scroll it carries. */
function bandsOf(scrollX, scrollY) {
  const held = [
    [0, geom.heldWide, 0],
    [geom.heldWide, geom.across, scrollX],
  ];
  const down = [
    [0, geom.heldHigh, 0],
    [geom.heldHigh, geom.down, scrollY],
  ];
  const out = [];
  for (const [y0, y1, dy] of down) {
    for (const [x0, x1, dx] of held) out.push({ x0, x1, y0, y1, dx, dy });
  }
  return out.filter((band) => band.x1 > band.x0 && band.y1 > band.y0);
}

/** The box a cell covers on the screen. */
function rectOf(row, col) {
  if (!geom) return null;
  const box = boxOf(row, col);
  if (!box) return null;
  const corner = onScreen(box.left, box.top);
  const far = onScreen(box.right, box.bottom);
  return { x: corner.x, y: corner.y, w: far.x - corner.x, h: far.y - corner.y };
}

/** Which column a screen x falls in. */
function columnAtX(x) {
  if (!geom) return 0;
  const inside = x - geom.headWide;
  const sheetX = inside < geom.heldWide ? inside : inside + sheetBox.scrollLeft;
  for (let col = 0; col <= geom.lastCol; col += 1) {
    if (sheetX < geom.cols[col + 1]) return col;
  }
  return geom.lastCol;
}

/** Which row a screen y falls in. */
function rowAtY(y) {
  if (!geom) return 1;
  const inside = y - geom.headHigh;
  const sheetY = inside < geom.heldHigh ? inside : inside + sheetBox.scrollTop;
  for (let row = 1; row <= geom.lastRow; row += 1) {
    if (sheetY < geom.tops[row + 1]) return row;
  }
  return geom.lastRow;
}

/**
 * What is under the pointer: a cell, a header, the corner, or an edge to drag.
 *
 * One answer rather than four questions, because each is the same arithmetic
 * on the same two numbers, and reading them apart is where a grid starts
 * picking the cell next to the one that was clicked.
 */
function whatIsAt(event) {
  if (!geom) return null;
  const box = sheetBox.getBoundingClientRect();
  const x = event.clientX - box.left;
  const y = event.clientY - box.top;
  const inHead = y < geom.headHigh;
  const inSide = x < geom.headWide;
  if (inHead && inSide) return { all: true };
  if (inHead) {
    const col = columnAtX(x);
    // Within a few pixels of a column's right edge is the handle that sizes
    // it, not the header itself.
    if (Math.abs(x - onScreen(geom.cols[col + 1], 0).x) <= EDGE) return { edgeCol: col };
    if (col > 0 && Math.abs(x - onScreen(geom.cols[col], 0).x) <= EDGE) {
      return { edgeCol: col - 1 };
    }
    return { headCol: col };
  }
  if (inSide) {
    const row = rowAtY(y);
    if (Math.abs(y - onScreen(0, geom.tops[row + 1]).y) <= EDGE) return { edgeRow: row };
    if (row > 1 && Math.abs(y - onScreen(0, geom.tops[row]).y) <= EDGE) {
      return { edgeRow: row - 1 };
    }
    return { headRow: row };
  }
  const spot = { row: rowAtY(y), col: columnAtX(x) };
  // The fill handle sits on the far corner of the selection.
  const held = region();
  const corner = rectOf(held.bottom, held.right);
  if (corner && x >= corner.x + corner.w - HANDLE - 1 && x <= corner.x + corner.w + HANDLE
      && y >= corner.y + corner.h - HANDLE - 1 && y <= corner.y + corner.h + HANDLE) {
    return { handle: true, row: spot.row, col: spot.col };
  }
  return spot;
}

/** Bring a cell into view, the way a grid does when the cursor leaves it. */
function reveal(row, col) {
  if (!geom) return;
  const box = boxOf(row, col);
  if (!box) return;
  const view = { w: sheetBox.clientWidth, h: sheetBox.clientHeight };
  if (box.left >= geom.heldWide) {
    const seen = box.left - sheetBox.scrollLeft + geom.headWide;
    if (seen < geom.headWide + geom.heldWide) {
      sheetBox.scrollLeft = box.left - geom.heldWide;
    } else if (seen + (box.right - box.left) > view.w) {
      sheetBox.scrollLeft += seen + (box.right - box.left) - view.w;
    }
  }
  if (box.top >= geom.heldHigh) {
    const seen = box.top - sheetBox.scrollTop + geom.headHigh;
    if (seen < geom.headHigh + geom.heldHigh) {
      sheetBox.scrollTop = box.top - geom.heldHigh;
    } else if (seen + (box.bottom - box.top) > view.h) {
      sheetBox.scrollTop += seen + (box.bottom - box.top) - view.h;
    }
  }
}

/**
 * Paint what is on screen.
 *
 * The grid is drawn in four bands — the held corner, the held rows, the held
 * columns, and everything else — because a frozen band does not scroll and the
 * rest does. Each is the same painting under a different clip and offset.
 */
function paintSheet() {
  const sheet = sheetNow();
  const canvas = document.getElementById('sheetInk');
  if (!sheet || !geom || !canvas || !canvas.getContext) return;
  const view = { w: sheetBox.clientWidth, h: sheetBox.clientHeight };
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(view.w * ratio));
  canvas.height = Math.max(1, Math.round(view.h * ratio));
  canvas.style.width = `${view.w}px`;
  canvas.style.height = `${view.h}px`;
  const ink = canvas.getContext('2d');
  ink.setTransform(ratio, 0, 0, ratio, 0, 0);
  ink.textBaseline = 'alphabetic';
  ink.fillStyle = '#FFFFFF';
  ink.fillRect(0, 0, view.w, view.h);

  for (const band of bandsOf(sheetBox.scrollLeft, sheetBox.scrollTop)) {
    ink.save();
    ink.beginPath();
    ink.rect(band.dx ? geom.headWide + geom.heldWide : geom.headWide,
      band.dy ? geom.headHigh + geom.heldHigh : geom.headHigh,
      view.w, view.h);
    ink.clip();
    ink.translate(geom.headWide - band.dx, geom.headHigh - band.dy);
    paintCells(ink, sheet, band, view);
    paintShapes(ink, sheet, band);
    ink.restore();
  }
  paintHeaders(ink, view);
  paintSelection(ink, view);
}

// ─── The things that float over the cells ──────────────────────────────────
//
// A drawing is anchored to a cell, not placed on the page: it starts at an
// offset inside one cell and either ends inside another or carries its own
// extent. So it moves when the columns above it are widened, and it scrolls
// with the band its anchor sits in — which is what makes a shape in a frozen
// row stay put with the row rather than sliding out from under it.

const EMU = 9525;               // English metric units to the pixel at 96dpi

/** Where an anchor lands in the sheet's own coordinates. */
function anchorAt(anchor) {
  if (!anchor) return null;
  const col = Math.min(anchor.col ?? 0, geom.cols.length - 1);
  const row = Math.min((anchor.row ?? 0) + 1, geom.tops.length - 1);
  return [
    (geom.cols[col] ?? 0) + (anchor.col_off || 0) / EMU,
    (geom.tops[row] ?? 0) + (anchor.row_off || 0) / EMU,
  ];
}

/** The box a drawing covers, from whichever of its two ways of saying so. */
function drawnBox(drawn) {
  const corner = anchorAt(drawn.from);
  if (!corner) return null;
  const [left, top] = corner;
  if (drawn.to) {
    const [right, bottom] = anchorAt(drawn.to);
    return { left, top, right, bottom };
  }
  if (!drawn.extent) return null;
  return {
    left, top,
    right: left + drawn.extent[0] / EMU,
    bottom: top + drawn.extent[1] / EMU,
  };
}

/** Every drawing whose anchor falls in this band. */
function paintShapes(ink, sheet, band) {
  for (const drawn of sheet.drawings || []) {
    const box = drawnBox(drawn);
    if (!box) continue;
    // One band draws it: the one its top-left corner belongs to. A shape that
    // straddles the freeze is drawn by the band it is anchored in, the way
    // Excel keeps it with the row it was put on.
    if (box.left < band.x0 || box.left >= band.x1) continue;
    if (box.top < band.y0 || box.top >= band.y1) continue;
    const shape = drawn.kind && drawn.kind.Shape;
    if (!shape) {
      // A picture's bytes are left out of the IR the page is handed, and a
      // chart is drawn from a part of its own: both are shown as the room
      // they take, rather than as nothing at all.
      ink.save();
      ink.strokeStyle = '#C9D1D9';
      ink.setLineDash([4, 3]);
      ink.strokeRect(box.left + .5, box.top + .5,
        box.right - box.left, box.bottom - box.top);
      ink.setLineDash([]);
      ink.fillStyle = '#8C959F';
      ink.font = '11px "Segoe UI", sans-serif';
      ink.fillText(drawn.kind && drawn.kind.Chart ? 'chart'
        : drawn.kind === 'Other' ? 'group' : 'picture', box.left + 6, box.top + 16);
      ink.restore();
      continue;
    }
    const geometry = (shape.geometry || '').toLowerCase();
    const line = /^(line|straightconnector|bentconnector)/.test(geometry);
    const oval = /ellipse|oval|flowchartconnector/.test(geometry);
    ink.save();
    ink.beginPath();
    if (line) {
      ink.moveTo(box.left, box.top);
      ink.lineTo(box.right, box.bottom);
    } else if (oval) {
      ink.ellipse((box.left + box.right) / 2, (box.top + box.bottom) / 2,
        Math.abs(box.right - box.left) / 2, Math.abs(box.bottom - box.top) / 2,
        0, 0, Math.PI * 2);
    } else if (geometry.includes('round')) {
      const radius = Math.min(16, Math.abs(box.right - box.left) / 4,
        Math.abs(box.bottom - box.top) / 4);
      ink.roundRect(box.left, box.top, box.right - box.left,
        box.bottom - box.top, radius);
    } else {
      ink.rect(box.left, box.top, box.right - box.left, box.bottom - box.top);
    }
    if (shape.fill && !line) {
      ink.fillStyle = tint(shape.fill, '#FFFFFF');
      ink.fill();
    }
    if (shape.line) {
      ink.strokeStyle = tint(shape.line.color, '#000000');
      ink.lineWidth = Math.max(1, Math.round((shape.line.width || EMU) / EMU));
      ink.setLineDash(shape.line.dash ? [4, 3] : []);
      ink.stroke();
    }
    ink.restore();
    if (shape.text) saysShape(ink, shape.text, box);
  }
}

/** What a shape says, inside the box it says it in. */
function saysShape(ink, said, box) {
  const inset = (held, fallback) => (held ?? fallback) / EMU;
  const area = {
    left: box.left + inset(said.insets && said.insets[0], 91440),
    top: box.top + inset(said.insets && said.insets[1], 45720),
    right: box.right - inset(said.insets && said.insets[2], 91440),
    bottom: box.bottom - inset(said.insets && said.insets[3], 45720),
  };
  const room = area.right - area.left;
  if (room <= 0) return;

  const lines = [];
  for (const paragraph of said.paragraphs || []) {
    const points = paragraph.size || 18;
    const font = `${paragraph.italic ? 'italic ' : ''}${paragraph.bold ? '700 ' : ''}`
      + `${Math.round(points * 96 / 72)}px "${paragraph.face || 'ＭＳ Ｐゴシック'}", sans-serif`;
    const pitch = (paragraph.line_pitch ? paragraph.line_pitch * 96 / 72
      : Math.round(points * 96 / 72) * 1.3) * (paragraph.line_scale || 1);
    for (const held of breakLines(font, paragraph.text || '',
      said.wrap === false ? 0 : room)) {
      lines.push({ text: held, font, pitch, paragraph });
    }
  }
  if (!lines.length) return;

  const block = lines.reduce((sum, held) => sum + held.pitch, 0);
  const slack = (area.bottom - area.top) - block;
  const anchor = said.anchor || 't';
  let at = area.top + (anchor === 'ctr' ? Math.floor(slack / 2) : anchor === 'b' ? slack : 0);

  ink.save();
  ink.beginPath();
  ink.rect(box.left, box.top, box.right - box.left, box.bottom - box.top);
  ink.clip();
  for (const held of lines) {
    ink.font = held.font;
    ink.fillStyle = tint(held.paragraph.color, '#000000');
    const wide = inkWidth(held.font, held.text);
    const align = held.paragraph.align;
    const left = align === 'ctr' ? area.left + (room - wide) / 2
      : align === 'r' ? area.right - wide : area.left;
    ink.fillText(held.text, left, at + held.pitch * .78);
    at += held.pitch;
  }
  ink.restore();
}

/** Every cell of one band: grounds first, then rules, then the words. */
function paintCells(ink, sheet, band, view) {
  const seen = {
    left: band.x0 + band.dx - 1,
    right: band.x0 + band.dx + view.w + 1,
    top: band.y0 + band.dy - 1,
    bottom: band.y0 + band.dy + view.h + 1,
  };
  const inside = (box) => box.right >= seen.left && box.left <= seen.right
    && box.bottom >= seen.top && box.top <= seen.bottom
    && box.left < band.x1 && box.right > band.x0 - 1
    && box.top < band.y1 && box.bottom > band.y0 - 1;

  const drawn = [];
  for (const row of sheet.rows) {
    if (row.hidden || row.index > geom.lastRow) continue;
    for (const cell of row.cells) {
      if (cell.col > geom.lastCol) continue;
      const box = boxOf(row.index, cell.col);
      if (!inside(box)) continue;
      drawn.push({ row: row.index, cell, box });
    }
  }

  for (const held of drawn) {
    const shade = held.cell.style && held.cell.style.bg_color;
    if (!shade) continue;
    ink.fillStyle = tint(shade, '#FFFFFF');
    ink.fillRect(held.box.left, held.box.top,
      held.box.right - held.box.left, held.box.bottom - held.box.top);
  }

  // The grid Excel shows behind a sheet, which is not part of the sheet.
  ink.strokeStyle = '#D9D9D9';
  ink.lineWidth = 1;
  ink.beginPath();
  for (let col = 0; col <= geom.lastCol + 1; col += 1) {
    const edge = geom.cols[col];
    if (edge < band.x0 - 1 || edge > band.x1 + 1) continue;
    ink.moveTo(edge + .5, band.y0);
    ink.lineTo(edge + .5, Math.min(band.y1, seen.bottom));
  }
  for (let row = 1; row <= geom.lastRow + 1; row += 1) {
    const edge = geom.tops[row];
    if (edge < band.y0 - 1 || edge > band.y1 + 1) continue;
    ink.moveTo(band.x0, edge + .5);
    ink.lineTo(Math.min(band.x1, seen.right), edge + .5);
  }
  ink.stroke();

  for (const held of drawn) {
    const style = held.cell.style || {};
    const box = held.box;
    const edges = [
      ['border_top', box.left, box.top, box.right, box.top],
      ['border_bottom', box.left, box.bottom, box.right, box.bottom],
      ['border_left', box.left, box.top, box.left, box.bottom],
      ['border_right', box.right, box.top, box.right, box.bottom],
    ];
    for (const edge of edges) {
      const rule = ruleOf(style[edge[0]]);
      if (!rule) continue;
      const up = edge[1] === edge[3];
      const nudge = rule.width % 2 ? .5 : 0;
      ink.strokeStyle = rule.colour;
      ink.lineWidth = rule.width;
      ink.setLineDash(rule.dash);
      ink.beginPath();
      ink.moveTo(edge[1] + (up ? nudge : 0), edge[2] + (up ? 0 : nudge));
      ink.lineTo(edge[3] + (up ? nudge : 0), edge[4] + (up ? 0 : nudge));
      ink.stroke();
      if (rule.double) {
        ink.beginPath();
        ink.moveTo(edge[1] + (up ? nudge + 2 : 0), edge[2] + (up ? 0 : nudge + 2));
        ink.lineTo(edge[3] + (up ? nudge + 2 : 0), edge[4] + (up ? 0 : nudge + 2));
        ink.stroke();
      }
      ink.setLineDash([]);
    }
    const across = ruleOf(style.border_diagonal);
    if (across && (style.diagonal_down || style.diagonal_up)) {
      ink.strokeStyle = across.colour;
      ink.lineWidth = across.width;
      ink.beginPath();
      if (style.diagonal_down) { ink.moveTo(box.left, box.top); ink.lineTo(box.right, box.bottom); }
      if (style.diagonal_up) { ink.moveTo(box.left, box.bottom); ink.lineTo(box.right, box.top); }
      ink.stroke();
    }
  }

  const indent = indentStep();
  for (const held of drawn) {
    const covered = geom.covered.get(`${held.row},${held.cell.col}`);
    if (covered && !covered.anchor) continue;
    const text = shownText(held.cell);
    if (text === '') continue;
    const cell = held.cell;
    const box = held.box;
    const style = cell.style || {};
    const font = fontOf(style);
    const room = gutters(font);
    const pushed = indent * (style.indent || 0);
    const numeric = isNumber(cell);
    const placed = style.horizontal_align
      || (numeric ? 'right' : style.stacked_text ? 'center' : 'left');
    const left = box.left + room[0] + (placed === 'left' ? pushed : 0);
    const right = box.right - room[1] - (placed === 'right' ? pushed : 0);
    const wide = right - left;
    const lines = style.wrap_text
      ? breakLines(font, text, wide)
      : [text.split('\n').join('')];

    ink.font = font;
    ink.fillStyle = tint(style.font_color, '#000000');
    const size = Math.round((style.font_size ?? book?.default_style?.font_size ?? 11) * 96 / 72);
    const line = Math.round(size * 1.28);
    const slack = (box.bottom - box.top) - line * lines.length;
    const place = style.vertical_align || 'bottom';
    const down = box.top + (place === 'top' ? 0
      : place === 'center' || place === 'centre' ? Math.floor(slack / 2) : slack);

    ink.save();
    // A cell's text is clipped to what it may cover: a wrapped or merged one
    // keeps to itself, a plain one runs on over an empty neighbour.
    const runsOn = !style.wrap_text && !covered && !numeric;
    ink.beginPath();
    ink.rect(runsOn ? band.x0 : box.left, box.top,
      runsOn ? band.x1 - band.x0 : box.right - box.left, box.bottom - box.top);
    ink.clip();
    if (style.stacked_text) {
      let at = down + size;
      for (const letter of text) {
        ink.fillText(letter, box.left + (box.right - box.left - inkWidth(font, letter)) / 2, at);
        at += line;
      }
    } else {
      lines.forEach((one, step) => {
        const ran = inkWidth(font, one);
        const spot = placed === 'right' ? right - ran
          : placed === 'center' || placed === 'centre' || placed === 'centerContinuous'
            ? left + (wide - ran) / 2
            : left;
        const base = down + line * step + Math.round(size * .92);
        ink.fillText(one, spot, base);
        if (style.underline) ink.fillRect(spot, base + 2, ran, 1);
      });
    }
    ink.restore();
  }
}

/** The strip of column letters and the column of row numbers. */
function paintHeaders(ink, view) {
  const box = region();
  ink.save();
  ink.font = '12px "Segoe UI", -apple-system, sans-serif';
  ink.textBaseline = 'middle';
  ink.fillStyle = '#F3F5F7';
  ink.fillRect(0, 0, view.w, geom.headHigh);
  ink.fillRect(0, 0, geom.headWide, view.h);
  ink.lineWidth = 1;

  for (let col = 0; col <= geom.lastCol; col += 1) {
    const spot = onScreen(geom.cols[col], 0);
    const wide = geom.cols[col + 1] - geom.cols[col];
    if (spot.x + wide < geom.headWide || spot.x > view.w) continue;
    // A scrolled column must not be drawn under a held one.
    if (geom.cols[col] >= geom.heldWide && spot.x < geom.headWide + geom.heldWide) {
      ink.save();
      ink.beginPath();
      ink.rect(geom.headWide + geom.heldWide, 0, view.w, geom.headHigh);
      ink.clip();
      paintColumnHead(ink, col, spot.x, wide, box);
      ink.restore();
      continue;
    }
    paintColumnHead(ink, col, spot.x, wide, box);
  }
  for (let row = 1; row <= geom.lastRow; row += 1) {
    const spot = onScreen(0, geom.tops[row]);
    const high = geom.tops[row + 1] - geom.tops[row];
    if (spot.y + high < geom.headHigh || spot.y > view.h) continue;
    if (geom.tops[row] >= geom.heldHigh && spot.y < geom.headHigh + geom.heldHigh) {
      ink.save();
      ink.beginPath();
      ink.rect(0, geom.headHigh + geom.heldHigh, geom.headWide, view.h);
      ink.clip();
      paintRowHead(ink, row, spot.y, high, box);
      ink.restore();
      continue;
    }
    paintRowHead(ink, row, spot.y, high, box);
  }

  ink.fillStyle = '#F3F5F7';
  ink.fillRect(0, 0, geom.headWide, geom.headHigh);
  ink.strokeStyle = '#C6CBD1';
  ink.beginPath();
  ink.moveTo(geom.headWide - .5, 0);
  ink.lineTo(geom.headWide - .5, view.h);
  ink.moveTo(0, geom.headHigh - .5);
  ink.lineTo(view.w, geom.headHigh - .5);
  ink.stroke();

  // Where the sheet is held, a darker line says so.
  if (geom.frozenRows || geom.frozenCols) {
    ink.strokeStyle = '#8A9199';
    ink.beginPath();
    if (geom.frozenCols) {
      ink.moveTo(geom.headWide + geom.heldWide - .5, 0);
      ink.lineTo(geom.headWide + geom.heldWide - .5, view.h);
    }
    if (geom.frozenRows) {
      ink.moveTo(0, geom.headHigh + geom.heldHigh - .5);
      ink.lineTo(view.w, geom.headHigh + geom.heldHigh - .5);
    }
    ink.stroke();
  }
  ink.restore();
}

function paintColumnHead(ink, col, x, wide, box) {
  const picked = col >= box.left && col <= box.right;
  ink.fillStyle = picked ? '#D3E4DC' : '#F3F5F7';
  ink.fillRect(x, 0, wide, geom.headHigh);
  ink.strokeStyle = '#C6CBD1';
  ink.beginPath();
  ink.moveTo(x + wide - .5, 0);
  ink.lineTo(x + wide - .5, geom.headHigh);
  ink.stroke();
  if (wide <= 6) return;
  ink.fillStyle = picked ? '#0F5132' : '#3A4149';
  const name = columnName(col);
  ink.fillText(name, x + (wide - ink.measureText(name).width) / 2, geom.headHigh / 2);
}

function paintRowHead(ink, row, y, high, box) {
  const picked = row >= box.top && row <= box.bottom;
  ink.fillStyle = picked ? '#D3E4DC' : '#F3F5F7';
  ink.fillRect(0, y, geom.headWide, high);
  ink.strokeStyle = '#C6CBD1';
  ink.beginPath();
  ink.moveTo(0, y + high - .5);
  ink.lineTo(geom.headWide, y + high - .5);
  ink.stroke();
  if (high <= 6) return;
  ink.fillStyle = picked ? '#0F5132' : '#3A4149';
  const name = String(row);
  ink.fillText(name, geom.headWide - 6 - ink.measureText(name).width, y + high / 2);
}

/** The block that is picked, the cell that takes what is typed, and the handle. */
function paintSelection(ink, view) {
  const box = region();
  const corner = rectOf(box.top, box.left);
  const far = rectOf(box.bottom, box.right);
  if (!corner || !far) return;
  ink.save();
  ink.beginPath();
  ink.rect(geom.headWide, geom.headHigh, view.w, view.h);
  ink.clip();
  const x = corner.x;
  const y = corner.y;
  const w = far.x + far.w - corner.x;
  const h = far.y + far.h - corner.y;
  if (spread()) {
    ink.fillStyle = 'rgba(33, 115, 70, .10)';
    ink.fillRect(x, y, w, h);
    // The cell that takes what is typed stays white inside the block.
    const here = rectOf(at.row, at.col);
    if (here) {
      ink.fillStyle = '#FFFFFF';
      ink.fillRect(here.x + 1, here.y + 1, here.w - 1, here.h - 1);
      paintOne(ink, at.row, at.col, here);
    }
  }
  ink.strokeStyle = '#217346';
  ink.lineWidth = 2;
  ink.strokeRect(x + 1, y + 1, Math.max(0, w - 2), Math.max(0, h - 2));
  if (!filling) {
    ink.fillStyle = '#217346';
    ink.fillRect(x + w - HANDLE, y + h - HANDLE, HANDLE, HANDLE);
  }
  if (cutFrom) {
    const from = rectOf(cutFrom.top, cutFrom.left);
    const to = rectOf(cutFrom.bottom, cutFrom.right);
    if (from && to) {
      ink.setLineDash([4, 3]);
      ink.lineWidth = 1;
      ink.strokeStyle = '#217346';
      ink.strokeRect(from.x + .5, from.y + .5,
        to.x + to.w - from.x - 1, to.y + to.h - from.y - 1);
      ink.setLineDash([]);
    }
  }
  ink.restore();
}

/** One cell repainted over the white of the active box inside a selection. */
function paintOne(ink, row, col, rect) {
  const cell = heldAt(row, col);
  if (!cell) return;
  const text = shownText(cell);
  if (text === '') return;
  const style = cell.style || {};
  const font = fontOf(style);
  const room = gutters(font);
  const placed = style.horizontal_align || (isNumber(cell) ? 'right' : 'left');
  const size = Math.round((style.font_size ?? book?.default_style?.font_size ?? 11) * 96 / 72);
  ink.save();
  ink.beginPath();
  ink.rect(rect.x, rect.y, rect.w, rect.h);
  ink.clip();
  ink.font = font;
  ink.fillStyle = tint(style.font_color, '#000000');
  const ran = inkWidth(font, text);
  const wide = rect.w - room[0] - room[1];
  const spot = placed === 'right' ? rect.x + rect.w - room[1] - ran
    : placed === 'center' || placed === 'centre' ? rect.x + room[0] + (wide - ran) / 2
      : rect.x + room[0];
  ink.fillText(text, spot, rect.y + rect.h - Math.round(size * .28));
  ink.restore();
}

/** Lay the sheet out afresh and paint it. */
function draw() {
  if (!layout()) return;
  const paper = document.getElementById('paper');
  if (paper) {
    paper.style.width = `${geom.headWide + geom.paperAcross}px`;
    paper.style.height = `${geom.headHigh + geom.paperDown}px`;
  }
  if (stateBox) stateBox.style.display = 'none';
  paintSheet();
  markFrozen();
}

function describe() {
  const sheet = book.sheets[shown];
  const style = book.default_style || {};
  const cells = sheet.rows.reduce((count, row) => count + row.cells.length, 0);
  factsBox.innerHTML = '';
  const facts = [
    ['Sheets', book.sheets.length],
    ['Rows', sheet.rows.length],
    ['Cells', cells],
    ['Standard font', style.font_name ? `${style.font_name} ${style.font_size || 11}` : 'not named'],
    ['Merged', (sheet.merge_cells || []).length],
    ['Filter', sheet.auto_filter ? 'yes' : 'no'],
  ];
  for (const [term, value] of facts) {
    factsBox.insertAdjacentHTML('beforeend', `<dt>${term}</dt><dd>${value}</dd>`);
  }

  const characters = widthOf(sheet, 0);
  const padding = Math.trunc(128 / digitWidth);
  widthBox.innerHTML =
    `A width counts digits of the standard font, with the cell's gutter already ` +
    `in it. A digit here measures <code>${digitWidth}px</code>, so column A at ` +
    `<code>${characters}</code> comes to ` +
    `<code>trunc(((256 × ${characters} + ${padding}) ÷ 256) × ${digitWidth}) = ` +
    `${columnPixels(characters)}px</code>.`;

  const gaps = sheet.unsupported_elements || [];
  missingBox.innerHTML = gaps.length
    ? gaps.map((one) => `<li>${one}</li>`).join('')
    : '<li class="none">Nothing this sheet uses is unread</li>';

  tabsBox.innerHTML = '';
  book.sheets.forEach((one, index) => {
    const tab = document.createElement('button');
    tab.textContent = one.name;
    if (index === shown) tab.className = 'on';
    tab.onclick = () => {
      shown = index;
      draw();
      describe();
      // Each sheet gets its own cursor rather than inheriting a position that
      // may not exist here; the selection does not survive the move either.
      goTo(1, 0);
      markFrozen();
    };
    tabsBox.appendChild(tab);
  });
  // Redrawing the tabs empties the strip they live in, and the selection's
  // total lives at the far end of that same strip. Put it back.
  if (countBox) tabsBox.appendChild(countBox);
}

function describeCell(address, cell) {
  const raw = typeof cell.value === 'object' && cell.value !== null
    ? Object.values(cell.value)[0]
    : (cell.value === 'Empty' ? undefined : cell.value);
  const rows = [
    ['Address', address],
    ['Stored', raw === undefined ? 'empty' : `<code>${raw}</code>`],
    ['Shows', `<code>${shownText(cell) || '(blank)'}</code>`],
    ['Format', cell.style.number_format ? `<code>${cell.style.number_format}</code>` : 'General'],
    ['Font', cell.style.font_name || 'the standard one'],
    ['Formula', cell.formula ? `<code>=${cell.formula}</code>` : 'none'],
  ];
  cellBox.innerHTML = rows
    .map(([term, value]) => `<dt>${term}</dt><dd>${value}</dd>`)
    .join('');
}

// ── Working out what a formula comes to ─────────────────────────────────────
//
// Typing `=B2+C2` and seeing nothing is the moment a grid stops being a
// spreadsheet, so the engine is asked for the answer after every edit. It is
// the same evaluator that reads the corpus, not a second one written for the
// browser — a formula must not mean one thing here and another when the file
// is opened.
//
// It cannot always be asked. What it costs is now almost entirely the crossing
// itself: the whole workbook goes over the wasm bridge and comes back, which is
// paid per CELL. The engine works out only what a change reaches, so the
// formulas are close to free beside it. On the median workbook the whole thing
// is a few milliseconds; on the largest in the corpus — 936,000 cells — it is
// forty seconds, and a workbook of the same size with NO formulas at all still
// takes twenty-two. So the page works out whether it can afford the answer
// before asking for it, and says plainly when it cannot.

// Anything past this and the sheet would visibly stop responding.
const PATIENCE = 300;
let liveCalc = true;
let anyFormulas = false;
let weight = 0;
const calcNote = document.getElementById('calcNote');

/** Roughly what a recalculation of this workbook will cost, in milliseconds. */
function calcCost() {
  let cells = 0;
  let formulas = 0;
  for (const sheet of (book ? book.sheets : [])) {
    for (const row of sheet.rows) {
      cells += row.cells.length;
      for (const cell of row.cells) if (cell.formula) formulas += 1;
    }
  }
  anyFormulas = formulas > 0;
  // Measured through the bridge from this side, middle of three runs:
  //
  //        cells  formulas   recalc
  //          149       139      7ms
  //        2,207       133     46ms
  //       14,568     2,529    344ms
  //        5,465         0     88ms
  //      645,209         0  22,077ms
  //      936,444    22,864  42,136ms
  //
  // A cell costs 13µs at a thousand of them and 34µs at six hundred thousand,
  // so the per-cell term is deliberately heavy: the point is to catch what
  // would hang, and erring that way costs a note rather than a frozen page.
  // The fixed part is the call itself.
  //
  // Erring the other way is cheap as well, which is what makes this safe to
  // keep near the measurements: `recompute` times what it really took and
  // shuts the gate itself if this was optimistic.
  return 10 + cells / 30 + formulas / 20;
}

function sayCalc(why) {
  if (!calcNote) return;
  calcNote.textContent = why || '';
  calcNote.style.display = why ? '' : 'none';
}

function weighCalc() {
  weight = calcCost();
  liveCalc = weight <= PATIENCE;
  sayCalc(liveCalc ? '' :
    'too large to work out formulas as you type — Excel will do it on open');
}

/** Ask the engine what everything comes to now. */
function recompute() {
  if (!book || !anyFormulas || !liveCalc) return;
  const started = performance.now();
  try {
    // The browser has no clock the engine can reach, so it is told what the
    // moment is. A serial: whole days since the last day of 1899, and the
    // time of day after the point, taken in local time because that is the
    // day the person at the keyboard is having.
    const now = new Date();
    const noon = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const days = Math.round((noon - new Date(1899, 11, 30)) / 86400000);
    const part = (now - noon) / 86400000;
    book = recalculate_spreadsheet(book, days + part);
  } catch (error) {
    // A formula the evaluator cannot read is not a reason to stop showing the
    // sheet; leave every cached value as it was.
    liveCalc = false;
    sayCalc(`formulas could not be worked out: ${error}`);
    return;
  }
  // The estimate is a guess about a machine this code has never run on. What
  // it actually took is not, so let that have the last word.
  if (performance.now() - started > PATIENCE) {
    liveCalc = false;
    sayCalc('too slow to work out formulas as you type — Excel will do it on open');
  }
}

// ── Finding something ───────────────────────────────────────────────────────
//
// What is searched is what a cell SHOWS, because that is what the person is
// looking at: a date is found by the date on the screen rather than by the
// number underneath it, and a formula by its answer. Excel can be told to look
// at the formulas instead; this cannot, and says so rather than pretending the
// difference is not there.

const findBox = document.getElementById('find');

/// Move the cursor to the next cell showing `text`, wrapping at the end.
///
/// Starts from the cell AFTER the cursor, so pressing Enter again walks on
/// rather than finding the same cell for ever. Returns whether it found one.
function findNext(text, backwards) {
  const wanted = text.trim().toLowerCase();
  if (!wanted || !book) return false;
  const bounds = extent();
  const wide = bounds.cols + 1;
  const many = bounds.rows * wide;
  if (many <= 0) return false;
  // One number for the whole sheet, so walking on and wrapping round is
  // arithmetic rather than two nested loops with an exception at each end.
  const here = (at.row - 1) * wide + at.col;
  for (let step = 1; step <= many; step++) {
    const spot = (((here + (backwards ? -step : step)) % many) + many) % many;
    const row = Math.floor(spot / wide) + 1;
    const col = spot % wide;
    const held = heldAt(row, col);
    if (!held) continue;
    if (!shownText(held).toLowerCase().includes(wanted)) continue;
    goTo(row, col);
    paint();
    return true;
  }
  return false;
}

/// Say whether the last search found anything, on the line the sheet uses for
/// everything else it has to tell you.
function sayFound(found, text) {
  if (!text.trim()) { sayCalc(''); return; }
  sayCalc(found ? '' : `nothing shows ${text.trim()}`);
}

// ── Ruling a block of cells ─────────────────────────────────────────────────
//
// A rule belongs to a cell's edge, and two cells that meet share the line
// between them — so ruling the bottom of one row and the top of the next comes
// to the same mark. Only one of them has to be written, and the drawing
// settles which is shown.

const rulesBox = document.getElementById('rules');

// The one everybody means. Excel's own button rules thin unless told otherwise.
const THIN = { style: 'thin', color: null };

/// Rule the selection: all four edges of every cell, the outside of the block
/// only, one named edge of it, or none at all.
function wearRules(kind) {
  if (!kind) return;
  const box = region();
  restyle((was, row, col) => {
    switch (kind) {
      case 'all':
        return {
          ...was,
          border_top: THIN, border_bottom: THIN,
          border_left: THIN, border_right: THIN,
        };
      case 'none':
        return {
          ...was,
          border_top: null, border_bottom: null,
          border_left: null, border_right: null,
        };
      // The outside of the block, which is why the cell's place matters.
      case 'outline':
        return {
          ...was,
          border_top: row === box.top ? THIN : was.border_top,
          border_bottom: row === box.bottom ? THIN : was.border_bottom,
          border_left: col === box.left ? THIN : was.border_left,
          border_right: col === box.right ? THIN : was.border_right,
        };
      // One edge of the BLOCK rather than of every cell in it: ruling the
      // bottom of a selection means one line under it, not a line under every
      // row of it.
      case 'top':
        return { ...was, border_top: row === box.top ? THIN : was.border_top };
      case 'bottom':
        return {
          ...was,
          border_bottom: row === box.bottom ? THIN : was.border_bottom,
        };
      case 'left':
        return { ...was, border_left: col === box.left ? THIN : was.border_left };
      case 'right':
        return {
          ...was,
          border_right: col === box.right ? THIN : was.border_right,
        };
      default:
        return was;
    }
  });
}

// ── What colour a cell is ───────────────────────────────────────────────────
//
// A colour input cannot say "none" — it can only say white, and a white cell
// and an uncoloured one are not the same thing in a file: one names a fill and
// the other leaves the sheet's own background showing. So taking the colour
// off is a separate control rather than a value of the same one.

const fillBox = document.getElementById('fill');
const noFillButton = document.getElementById('nofill');

/// Colour every cell in the selection, or take the colour off with `null`.
function wearFill(colour) {
  restyle((was) => ({ ...was, bg_color: colour }));
}

/// Show the selection's colour, when they agree on one.
function sayFill() {
  const can = Boolean(book);
  if (fillBox) fillBox.disabled = !can;
  if (noFillButton) noFillButton.disabled = !can;
  if (!fillBox || !can) return;
  let seen = null;
  let agree = true;
  eachInRegion((row, col) => {
    const held = heldAt(row, col);
    const held_colour = (held && held.style && held.style.bg_color) || '';
    if (seen === null) seen = held_colour;
    else if (seen !== held_colour) agree = false;
  });
  // With nothing agreed, or nothing set, the input shows white — which is what
  // it would offer anyway, and is not the same as the cell being white.
  fillBox.value = agree && seen ? `#${seen}` : '#ffffff';
}

// ── Cells drawn as one ──────────────────────────────────────────────────────
//
// A merge is not something a cell wears. It is a list on the SHEET saying
// which rectangles are drawn as one cell, so it cannot ride in on `restyle`
// the way a border or a fill does, and it needs its own slot in an undo step.
//
// Only the top-left of a merge keeps what it held — Excel warns before it
// throws the rest away. Here the cells it empties are written inside the same
// step, so taking the merge back brings their values with it.

const mergeBox = document.getElementById('merge');

function span(top, left, bottom, right) {
  return { start_row: top, start_col: left, end_row: bottom, end_col: right };
}

/** The merges this sheet has that meet the selection. */
function mergesMet(sheet) {
  const box = region();
  return (sheet.merge_cells || []).filter((one) =>
    one.start_row <= box.bottom && one.end_row >= box.top
    && one.start_col <= box.right && one.end_col >= box.left);
}

/** Replace the sheet's merges, remembering the list it had. */
function setMerges(sheet, merges) {
  if (step) step.merges.push({ sheet, was: (sheet.merge_cells || []).slice(), now: merges });
  sheet.merge_cells = merges;
  // A merge is not a cell value, so the narrow save path has nowhere to put it.
  beyondValues = true;
}

/**
 * Merge the selection, or take merges off it.
 *
 * `centre` and `cells` make one block of the whole selection; `across` makes
 * one of each row of it, which is how a stack of headings gets merged in a
 * single go. Any merge the selection touches goes either way: unmerging is
 * that on its own, and a merge left half-overlapping a new one would cross it.
 */
function wearMerge(kind) {
  if (!kind) return;
  const sheet = sheetNow();
  if (!sheet) return;
  const box = region();
  change(() => {
    const met = new Set(mergesMet(sheet));
    const kept = (sheet.merge_cells || []).filter((one) => !met.has(one));
    const made = [];
    if (kind === 'across') {
      // A single column has nothing to merge across, row by row or otherwise.
      if (box.left !== box.right) {
        for (let row = box.top; row <= box.bottom; row++) {
          made.push(span(row, box.left, row, box.right));
        }
      }
    } else if (kind !== 'unmerge' && spread()) {
      made.push(span(box.top, box.left, box.bottom, box.right));
    }
    if (met.size === 0 && made.length === 0) return;
    setMerges(sheet, kept.concat(made));
    for (const one of made) {
      for (let row = one.start_row; row <= one.end_row; row++) {
        for (let col = one.start_col; col <= one.end_col; col++) {
          if (row === one.start_row && col === one.start_col) continue;
          put(row, col, '');
        }
      }
      if (kind !== 'centre') continue;
      const held = heldAt(one.start_row, one.start_col);
      const was = held ? held.style : {};
      put(one.start_row, one.start_col, contentOf(held),
        { ...was, horizontal_align: 'center' });
    }
  });
  draw();
  paint();
}

// ── The face the text is set in ─────────────────────────────────────────────
//
// Bold, italic and underline were settable from the start, but the typeface,
// its size and its colour were only ever read and drawn. A heading is a bigger
// font far more often than it is a bold one.
//
// Both boxes are open lists rather than menus: a file may name any face at
// all, and Excel takes any size from 1 to 409, so a menu would be a list of
// the ones we happened to think of. What the face box offers is the faces this
// workbook already uses, which is what someone editing it usually wants and is
// the only list we can know is right — the browser will not say which fonts
// the machine has.

const faceBox = document.getElementById('face');
const faceList = document.getElementById('faces');
const sizeBox = document.getElementById('points');
const inkBox = document.getElementById('ink');
const autoInkButton = document.getElementById('autoink');

/** Every typeface this workbook names, in the order they are first met. */
function facesUsed() {
  const seen = [];
  const add = (name) => { if (name && !seen.includes(name)) seen.push(name); };
  add((book.default_style || {}).font_name);
  for (const sheet of book.sheets) {
    for (const line of sheet.rows) {
      for (const cell of line.cells) add(cell.style.font_name);
    }
  }
  return seen;
}

/** Offer the workbook's own faces. Called when a workbook is opened. */
function sayFaces() {
  if (!faceList || !book) return;
  faceList.innerHTML = '';
  for (const name of facesUsed()) {
    const option = document.createElement('option');
    option.value = name;
    faceList.appendChild(option);
  }
}

/** Set the selection in a named face, or hand it back to the standard one. */
function wearFace(name) {
  restyle((was) => ({ ...was, font_name: name.trim() || null }));
}

/**
 * Size the selection, in points.
 *
 * Excel's own box takes 1 to 409 and refuses the rest; anything outside that
 * is a slip rather than a wish, and a cell of size zero cannot be undone by
 * looking at it.
 */
function wearSize(points) {
  const size = Number(points);
  if (!Number.isFinite(size) || size < 1 || size > 409) return;
  restyle((was) => ({ ...was, font_size: size }));
}

/** Colour the text, or with `null` hand it back to automatic. */
function wearInk(colour) {
  restyle((was) => ({ ...was, font_color: colour }));
}

/** What the selection is set in, when it agrees on one. */
function agreedOn(part) {
  let seen = null;
  let agree = true;
  eachInRegion((row, col) => {
    const held = heldAt(row, col);
    const worn = (held && held.style && held.style[part]) ?? null;
    if (seen === null) seen = worn;
    else if (seen !== worn) agree = false;
  });
  return agree ? seen : null;
}

/** Show the selection's face, size and colour — blank where they differ. */
function sayFace() {
  const can = Boolean(book);
  for (const control of [faceBox, sizeBox, inkBox, autoInkButton]) {
    if (control) control.disabled = !can;
  }
  if (!can) return;
  const standard = book.default_style || {};
  // A cell that names neither is set in the workbook's own font, so that is
  // what the boxes show rather than nothing: it is what the cell IS in.
  if (faceBox && document.activeElement !== faceBox) {
    faceBox.value = agreedOn('font_name') ?? standard.font_name ?? '';
  }
  if (sizeBox && document.activeElement !== sizeBox) {
    const points = agreedOn('font_size') ?? standard.font_size ?? null;
    sizeBox.value = points === null ? '' : String(points);
  }
  // Automatic text is black, which is also what the picker would offer for a
  // cell that names no colour. The two are different in the file, which is why
  // giving it back is a control of its own.
  if (inkBox) inkBox.value = `#${agreedOn('font_color') ?? '000000'}`;
}

// ── How the numbers look ────────────────────────────────────────────────────
//
// A number format decides what a cell SHOWS without touching what it holds:
// 0.15 under `0%` is fifteen per cent and is still 0.15 to everything that
// reads it. The engine has known how to render them all along — the page had
// no way to choose one.

const formatBox = document.getElementById('numfmt');

// Excel's Ctrl+Shift shortcuts, by the key and by the physical key — a
// keyboard that is not American sends a different character for the same
// place on the row, and it is the place Excel means.
const FORMAT_KEYS = {
  Digit1: '#,##0.00', '!': '#,##0.00',
  Digit2: 'h:mm', '"': 'h:mm', '@': 'h:mm',
  Digit3: 'd mmm yy', '#': 'd mmm yy',
  Digit4: '$#,##0.00', '$': '$#,##0.00',
  Digit5: '0%', '%': '0%',
  Digit6: '0.00E+00', '^': '0.00E+00', '&': '0.00E+00',
  // General, which is the absence of a format.
  Backquote: '', '~': '', '`': '',
};

/// Put `code` on every cell in the selection. An empty code means General,
/// which is the absence of a format rather than a format of its own.
function wearFormat(code) {
  const wanted = code.trim();
  restyle((was) => ({
    ...was,
    number_format: wanted === '' || wanted.toLowerCase() === 'general'
      ? null
      : wanted,
  }));
}

/// Show the selection's format, or nothing when they disagree.
function sayFormat() {
  if (!formatBox) return;
  formatBox.disabled = !book;
  if (!book || document.activeElement === formatBox) return;
  let seen = null;
  let agree = true;
  eachInRegion((row, col) => {
    const held = heldAt(row, col);
    const held_format = (held && held.style && held.style.number_format) || '';
    if (seen === null) seen = held_format;
    else if (seen !== held_format) agree = false;
  });
  formatBox.value = agree && seen ? seen : '';
  formatBox.placeholder = agree ? 'General' : 'Mixed';
}

// ── Whole rows and whole columns ────────────────────────────────────────────
//
// Putting a row in moves more of a workbook than any other edit: every formula
// that names a row below it, on this sheet and on any other; the merges over
// it; the table it falls inside; the frozen rows above it. The engine does all
// of that, so the page's part is only to say which band and how many, and to
// be able to put it back.

const addBandButton = document.getElementById('addBand');
const cutBandButton = document.getElementById('cutBand');

/// Which band the selection covers, or null when it covers neither.
///
/// Excel's Insert takes whole rows or whole columns. A selection that reaches
/// from the first row to the last IS a column selection, however it was made —
/// dragging the headers and dragging the cells come to the same thing.
function bandOfSelection() {
  const bounds = extent();
  const box = region();
  const wholeColumns = box.top <= 1 && box.bottom >= bounds.rows;
  const wholeRows = box.left <= 0 && box.right >= bounds.cols;
  // A sheet one row tall makes every selection "whole columns" as well as
  // "whole rows"; rows are the commoner intent, so they win.
  if (wholeRows) return { rows: true, at: box.top, count: box.bottom - box.top + 1 };
  if (wholeColumns) return { rows: false, at: box.left, count: box.right - box.left + 1 };
  return null;
}

function sayBands() {
  const can = Boolean(book) && Boolean(bandOfSelection());
  if (addBandButton) addBandButton.disabled = !can;
  if (cutBandButton) cutBandButton.disabled = !can;
}

/// Put rows or columns in, or take them out, and remember enough to undo it.
///
/// A structural change rewrites the whole sheet, so it cannot be recorded as
/// the cell-by-cell deltas an ordinary edit is. It does not have to be:
/// `shift_band` builds a NEW workbook rather than changing this one, so the
/// one we had is still whole and can simply be kept. Undo is then a swap.
function shiftBand(count) {
  const band = bandOfSelection();
  if (!band || !book) return;
  const sheet = sheetNow();
  if (!sheet) return;
  change(() => {
    const was = book;
    try {
      book = shift_band(book, sheet.name, band.rows, band.at, count * band.count);
    } catch (error) {
      book = was;
      sayCalc(`rows could not be moved: ${error}`);
      return;
    }
    step.books = [{ was, now: book }];
  });
  beyondValues = true;
  weighCalc();
  describe();
  draw();
  paint();
  sayBands();
}
