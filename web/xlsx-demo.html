<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oxi — Spreadsheet Demo</title>
<style>
:root {
  --accent: #217346;
  --accent-d: #1B5E3A;
  --accent-l: #E4F0E9;
  --rule: #D0D7DE;
  --head: #F3F5F7;
  --txt: #24292F;
  --dim: #656D76;
  --bg: #FFFFFF;
  --code: #F6F8FA;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Hiragino Sans',
    'Noto Sans JP', sans-serif;
  color: var(--txt);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  background: var(--accent);
  color: #fff;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}
header .name { font-weight: 700; letter-spacing: .3px; }
header .what { opacity: .9; font-size: 13px; }
header .spacer { flex: 1; }
header button, header label.file {
  background: rgba(255, 255, 255, .16);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, .3);
  border-radius: 4px;
  padding: 5px 12px;
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
header button:hover, header label.file:hover { background: rgba(255, 255, 255, .28); }
header input[type=file] { display: none; }

main { flex: 1; display: flex; min-height: 0; }

#sheet {
  flex: 1;
  overflow: auto;
  background: #fff;
  position: relative;
}
table { border-collapse: collapse; table-layout: fixed; }
th, td {
  border: 1px solid var(--rule);
  font-size: 13px;
  padding: 0 3px;
  overflow: hidden;
  white-space: nowrap;
  height: 20px;
}
th {
  background: var(--head);
  color: var(--dim);
  font-weight: 400;
  font-size: 11px;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 2;
}
th.row { position: sticky; left: 0; z-index: 1; width: 40px; }
td.picked { outline: 2px solid var(--accent); outline-offset: -2px; }
/* The box Excel draws round the cell you are on, and the little square at its
   corner. Both are what tells you at a glance where typing will land. */
td.here {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  position: relative;
}
td.here::after {
  content: '';
  position: absolute;
  right: -3px;
  bottom: -3px;
  width: 5px;
  height: 5px;
  background: var(--accent);
  border: 1px solid #FFF;
}
td input.inline {
  font: inherit;
  border: none;
  outline: none;
  width: 100%;
  height: 100%;
  padding: 0;
  background: #FFF;
  color: inherit;
  text-align: inherit;
}
.bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 10px;
  border-bottom: 1px solid var(--rule);
  background: var(--bg);
  flex-shrink: 0;
}
.bar #where {
  min-width: 78px;
  font-size: 13px;
  padding: 3px 8px;
  border: 1px solid var(--rule);
  border-radius: 3px;
  background: var(--head);
}
.bar .fx { color: var(--dim); font-style: italic; font-size: 13px; }
.bar input {
  flex: 1;
  font: inherit;
  font-size: 13px;
  padding: 3px 8px;
  border: 1px solid var(--rule);
  border-radius: 3px;
}
.bar input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
td.right { text-align: right; }
td.centre { text-align: center; }
td.bold { font-weight: 700; }

aside {
  width: 340px;
  border-left: 1px solid var(--rule);
  overflow-y: auto;
  padding: 14px 16px;
  background: #FBFCFD;
  flex-shrink: 0;
}
aside h2 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .6px;
  color: var(--dim);
  margin: 18px 0 8px;
  font-weight: 600;
}
aside h2:first-child { margin-top: 0; }
aside dl { display: grid; grid-template-columns: 108px 1fr; gap: 5px 10px; font-size: 13px; }
aside dt { color: var(--dim); }
aside dd { word-break: break-all; }
aside code {
  font-family: 'Cascadia Mono', Consolas, monospace;
  background: var(--code);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 1px 4px;
  font-size: 12px;
}
aside .sum { font-size: 13px; line-height: 1.6; color: var(--dim); }
aside .none { color: var(--dim); font-style: italic; font-size: 13px; }
aside ul { list-style: none; font-size: 13px; }
aside ul li { padding: 3px 0 3px 14px; position: relative; }
aside ul li::before { content: '·'; position: absolute; left: 4px; color: var(--dim); }

.tabs {
  display: flex;
  gap: 2px;
  padding: 4px 10px;
  border-top: 1px solid var(--rule);
  background: var(--head);
  flex-shrink: 0;
}
.tabs button {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  font: inherit;
  font-size: 13px;
  padding: 4px 12px;
  cursor: pointer;
  color: var(--dim);
}
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

#drop {
  position: absolute;
  inset: 0;
  background: rgba(33, 115, 70, .08);
  border: 2px dashed var(--accent);
  display: none;
  align-items: center;
  justify-content: center;
  color: var(--accent-d);
  font-size: 15px;
  z-index: 5;
}
#drop.over { display: flex; }
#state { padding: 40px; color: var(--dim); font-size: 14px; }

/* A selected block is washed, and the block's outer edge is ruled, so the eye
   reads one rectangle rather than a scatter of tinted cells. The active cell
   inside it keeps its own outline and is left unwashed, the way Excel leaves
   the cell you are about to type into. */
td.pick { background: rgba(33, 115, 70, .10); }
td.pick.here { background: transparent; }
td.edge-t { box-shadow: inset 0 1px 0 0 var(--accent); }
td.edge-b { box-shadow: inset 0 -1px 0 0 var(--accent); }
td.edge-l { box-shadow: inset 1px 0 0 0 var(--accent); }
td.edge-r { box-shadow: inset -1px 0 0 0 var(--accent); }
td.edge-t.edge-l { box-shadow: inset 0 1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent); }
td.edge-t.edge-r { box-shadow: inset 0 1px 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }
td.edge-b.edge-l { box-shadow: inset 0 -1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent); }
td.edge-b.edge-r { box-shadow: inset 0 -1px 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }
td.edge-t.edge-b.edge-l { box-shadow: inset 0 1px 0 0 var(--accent), inset 0 -1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent); }
td.edge-t.edge-b.edge-r { box-shadow: inset 0 1px 0 0 var(--accent), inset 0 -1px 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }
td.edge-t.edge-l.edge-r { box-shadow: inset 0 1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }
td.edge-b.edge-l.edge-r { box-shadow: inset 0 -1px 0 0 var(--accent), inset 1px 0 0 0 var(--accent), inset -1px 0 0 0 var(--accent); }

/* What the selection comes to, where Excel puts it: the far end of the strip
   the sheet tabs sit in. */
#tally {
  margin-left: auto;
  padding: 0 14px;
  color: var(--dim);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
/* Dragging a range means passing the pointer over cell after cell; without
   this the browser starts selecting their text instead. */
table { user-select: none; }
</style>
</head>
<body>

<header>
  <span class="name">Oxi</span>
  <span class="what">Spreadsheet rendering, in the browser, with no server</span>
  <span class="spacer"></span>
  <button id="save" disabled>Save</button>
  <button id="reset">Sample workbook</button>
  <label class="file">Open a .xlsx<input type="file" id="pick" accept=".xlsx"></label>
</header>

<div class="bar">
  <span id="where">A1</span>
  <span class="fx">fx</span>
  <input id="formula" spellcheck="false" autocomplete="off">
</div>

<main>
  <div id="sheet">
    <div id="state">Loading the engine…</div>
    <div id="drop">Drop a .xlsx here</div>
  </div>
  <aside>
    <h2>What Oxi read</h2>
    <dl id="facts"></dl>
    <h2>Column width</h2>
    <p class="sum" id="widthRule"></p>
    <h2>Selected cell</h2>
    <dl id="cellFacts"><dd class="none">Click a cell</dd></dl>
    <h2>Not yet drawn</h2>
    <ul id="missing"><li class="none">—</li></ul>
  </aside>
</main>

<div class="tabs" id="tabs"><span id="tally"></span></div>

<script type="module">
import init, { parse_spreadsheet, format_cell_number, edit_xlsx } from './oxidocs_wasm.js';

const SAMPLE = './samples/quarterly-sales.xlsx';
/// A stored column width already carries the gutter either side of a cell's
/// text, so it is not the width a person types into Excel: typing 10 stores
/// 10.625. Pixels come back out of it by OOXML's own rule, confirmed to the
/// pixel against a ruled worksheet.

const sheetBox = document.getElementById('sheet');
const stateBox = document.getElementById('state');
const dropBox = document.getElementById('drop');
const factsBox = document.getElementById('facts');
const cellBox = document.getElementById('cellFacts');
const missingBox = document.getElementById('missing');
const widthBox = document.getElementById('widthRule');
const tabsBox = document.getElementById('tabs');

let book = null;
let shown = 0;
// The file as it arrived. Saving patches THAT rather than writing a workbook
// out afresh: everything the sheet carries and this page never modelled —
// charts, pictures, print settings, the styles of cells nobody touched —
// stays exactly as its author left it. A save that rebuilds the file from
// what the screen knows is how an editor quietly throws that away.
let source = null;
let fileName = 'workbook.xlsx';
// One entry per cell that has been changed, keyed by sheet/row/column so
// typing into the same cell twice sends one edit, not two.
const changes = new Map();
let digitWidth = 7;

/// The width of a digit in the workbook's standard font, which is the unit a
/// column width is stated in.
function measureDigit(name, points) {
  const canvas = measureDigit.canvas ||= document.createElement('canvas');
  const pen = canvas.getContext('2d');
  const family = name ? `"${name}"` : 'Calibri';
  pen.font = `${(points || 11) * 96 / 72}px ${family}, Calibri, sans-serif`;
  return Math.round(pen.measureText('0').width);
}

/// Excel's own default when a sheet names no width of its own.
const DEFAULT_CHARACTERS = 8.43;

function widthOf(sheet, column) {
  const named = sheet.col_widths[column];
  if (named > 0) return named;
  return sheet.default_col_width > 0 ? sheet.default_col_width : DEFAULT_CHARACTERS;
}

function columnPixels(width) {
  const padding = Math.trunc(128 / digitWidth);
  return Math.trunc(((256 * width + padding) / 256) * digitWidth);
}

function columnName(index) {
  let name = '';
  for (let n = index; n >= 0; n = Math.floor(n / 26) - 1) {
    name = String.fromCharCode(65 + (n % 26)) + name;
  }
  return name;
}

/// What a cell shows, which is its value put through its number format.
function shownText(cell) {
  const value = cell.value;
  if (value === null || value === undefined) return '';
  // A variant that carries nothing arrives as its own name, not as an object.
  if (typeof value === 'string') return value === 'Empty' ? '' : value;
  if (typeof value === 'object') {
    if ('Number' in value) {
      return cell.style.number_format
        ? format_cell_number(value.Number, cell.style.number_format)
        : String(value.Number);
    }
    if ('String' in value) return value.String;
    if ('Boolean' in value) return value.Boolean ? 'TRUE' : 'FALSE';
    if ('Error' in value) return value.Error;
  }
  return '';
}

function isNumber(cell) {
  return typeof cell.value === 'object' && cell.value !== null && 'Number' in cell.value;
}

function draw() {
  const sheet = book.sheets[shown];
  const merged = new Map();
  for (const merge of sheet.merge_cells || []) {
    for (let row = merge.start_row; row <= merge.end_row; row++) {
      for (let col = merge.start_col; col <= merge.end_col; col++) {
        const anchor = row === merge.start_row && col === merge.start_col;
        merged.set(`${row},${col}`, anchor ? merge : null);
      }
    }
  }

  let lastRow = 0;
  let lastColumn = 0;
  for (const row of sheet.rows) {
    for (const cell of row.cells) {
      const text = shownText(cell);
      if (text === '') continue;
      lastRow = Math.max(lastRow, row.index);
      lastColumn = Math.max(lastColumn, cell.col);
    }
  }
  lastColumn = Math.max(lastColumn, 3);
  lastRow = Math.max(lastRow, 8);

  const held = new Map();
  for (const row of sheet.rows) held.set(row.index, row);

  const table = document.createElement('table');
  const head = table.insertRow();
  head.appendChild(document.createElement('th')).className = 'row';
  for (let col = 0; col <= lastColumn; col++) {
    const cell = document.createElement('th');
    cell.textContent = columnName(col);
    cell.style.width = `${columnPixels(widthOf(sheet, col))}px`;
    head.appendChild(cell);
  }

  for (let index = 1; index <= lastRow; index++) {
    const row = table.insertRow();
    const label = document.createElement('th');
    label.className = 'row';
    label.textContent = index;
    row.appendChild(label);

    const source = held.get(index);
    const height = source && source.height ? source.height : sheet.default_row_height;
    // A height in points becomes whole pixels by truncation, the way Excel
    // draws it.
    if (height) row.style.height = `${Math.trunc(height * 96 / 72)}px`;

    for (let col = 0; col <= lastColumn; col++) {
      const box = merged.get(`${index},${col}`);
      if (box === null) continue;   // covered by a merge that is drawn already
      const cell = row.insertCell();
      if (box) {
        cell.colSpan = box.end_col - box.start_col + 1;
        cell.rowSpan = box.end_row - box.start_row + 1;
      }
      // Every cell answers to the keyboard, whether it holds anything or
      // not: in Excel the empty ones are where you type next, and a grid you
      // can only click the written cells of is a table, not a sheet.
      cell.dataset.row = index;
      cell.dataset.col = col;
      cell.tabIndex = -1;
      const held = source && source.cells.find((one) => one.col === col);
      if (!held) continue;
      cell.textContent = shownText(held);
      const align = held.style.horizontal_align;
      if (align === 'center') cell.classList.add('centre');
      else if (align === 'right') cell.classList.add('right');
      else if (!align && isNumber(held)) cell.classList.add('right');
      if (held.style.bold) cell.classList.add('bold');
      if (held.style.italic) cell.style.fontStyle = 'italic';
      if (held.style.font_size) cell.style.fontSize = `${held.style.font_size}px`;
      if (held.style.font_name) cell.style.fontFamily = `"${held.style.font_name}", sans-serif`;
      if (held.style.font_color) cell.style.color = `#${held.style.font_color}`;
      if (held.style.bg_color) cell.style.background = `#${held.style.bg_color}`;
    }
  }
  table.tabIndex = 0;
  table.addEventListener('mousedown', (event) => {
    const cell = event.target.closest('td');
    if (!cell || !cell.dataset.row) return;
    // Shift extends from wherever the selection already starts; a plain click
    // starts a new one and arms the drag.
    goTo(Number(cell.dataset.row), Number(cell.dataset.col), false, event.shiftKey);
    if (!event.shiftKey) dragging = true;
    table.focus();
    event.preventDefault();
  });
  table.addEventListener('mouseover', (event) => {
    if (!dragging) return;
    const cell = event.target.closest('td');
    if (!cell || !cell.dataset.row) return;
    goTo(Number(cell.dataset.row), Number(cell.dataset.col), false, true);
  });
  table.addEventListener('dblclick', (event) => {
    const cell = event.target.closest('td');
    if (cell && cell.dataset.row) edit(null);
  });

  stateBox.style.display = 'none';
  const previous = sheetBox.querySelector('table');
  if (previous) previous.remove();
  sheetBox.appendChild(table);
}

function describe() {
  const sheet = book.sheets[shown];
  const style = book.default_style || {};
  const cells = sheet.rows.reduce((count, row) => count + row.cells.length, 0);
  factsBox.innerHTML = '';
  const facts = [
    ['Sheets', book.sheets.length],
    ['Rows', sheet.rows.length],
    ['Cells', cells],
    ['Standard font', style.font_name ? `${style.font_name} ${style.font_size || 11}` : 'not named'],
    ['Merged', (sheet.merge_cells || []).length],
    ['Filter', sheet.auto_filter ? 'yes' : 'no'],
  ];
  for (const [term, value] of facts) {
    factsBox.insertAdjacentHTML('beforeend', `<dt>${term}</dt><dd>${value}</dd>`);
  }

  const characters = widthOf(sheet, 0);
  const padding = Math.trunc(128 / digitWidth);
  widthBox.innerHTML =
    `A width counts digits of the standard font, with the cell's gutter already ` +
    `in it. A digit here measures <code>${digitWidth}px</code>, so column A at ` +
    `<code>${characters}</code> comes to ` +
    `<code>trunc(((256 × ${characters} + ${padding}) ÷ 256) × ${digitWidth}) = ` +
    `${columnPixels(characters)}px</code>.`;

  const gaps = sheet.unsupported_elements || [];
  missingBox.innerHTML = gaps.length
    ? gaps.map((one) => `<li>${one}</li>`).join('')
    : '<li class="none">Nothing this sheet uses is unread</li>';

  tabsBox.innerHTML = '';
  book.sheets.forEach((one, index) => {
    const tab = document.createElement('button');
    tab.textContent = one.name;
    if (index === shown) tab.className = 'on';
    tab.onclick = () => {
      shown = index;
      draw();
      describe();
      // Each sheet gets its own cursor rather than inheriting a position that
      // may not exist here; the selection does not survive the move either.
      goTo(1, 0);
    };
    tabsBox.appendChild(tab);
  });
  // Redrawing the tabs empties the strip they live in, and the selection's
  // total lives at the far end of that same strip. Put it back.
  if (countBox) tabsBox.appendChild(countBox);
}

function describeCell(address, cell) {
  const raw = typeof cell.value === 'object' && cell.value !== null
    ? Object.values(cell.value)[0]
    : (cell.value === 'Empty' ? undefined : cell.value);
  const rows = [
    ['Address', address],
    ['Stored', raw === undefined ? 'empty' : `<code>${raw}</code>`],
    ['Shows', `<code>${shownText(cell) || '(blank)'}</code>`],
    ['Format', cell.style.number_format ? `<code>${cell.style.number_format}</code>` : 'General'],
    ['Font', cell.style.font_name || 'the standard one'],
    ['Formula', cell.formula ? `<code>=${cell.formula}</code>` : 'none'],
  ];
  cellBox.innerHTML = rows
    .map(([term, value]) => `<dt>${term}</dt><dd>${value}</dd>`)
    .join('');
}

// ── Selecting more than one cell ────────────────────────────────────────────
//
// A sheet where you can only ever be on one cell is a form. Everything people
// actually do with a spreadsheet — total a column, copy a block into an email,
// paste a table someone sent — starts by selecting a range, so the range is
// what the rest of this hangs off.

// A selection needs three cells, not two, and conflating any pair of them
// gives a grid that feels almost right. `anchor` is the corner it was started
// from and `reach` is the corner being dragged; the block is the rectangle
// between them. `at` — declared with the rest of the cursor state below — is
// the ACTIVE cell: the white one inside the block that takes what you type and
// that the formula bar describes. Drag A1 to C5 in Excel and your typing still
// goes into A1, because extending a selection moves `reach` and leaves `at`
// where it was.
let anchor = { row: 1, col: 0 };
let reach = { row: 1, col: 0 };
// True only while the mouse is down and dragging out a range, which is the one
// time Excel shows the size instead of the address in the name box.
let dragging = false;

const countBox = document.getElementById('tally');

function region() {
  return {
    top: Math.min(anchor.row, reach.row),
    left: Math.min(anchor.col, reach.col),
    bottom: Math.max(anchor.row, reach.row),
    right: Math.max(anchor.col, reach.col),
  };
}

function spread() {
  const box = region();
  return box.top !== box.bottom || box.left !== box.right;
}

function eachInRegion(visit) {
  const box = region();
  for (let row = box.top; row <= box.bottom; row++) {
    for (let col = box.left; col <= box.right; col++) visit(row, col);
  }
}

// Enough digits to be honest, without a tail of float noise behind a total that
// is plainly a round number.
function trim(value) {
  const near = Math.round(value * 1e10) / 1e10;
  return String(Number(near.toFixed(10)));
}

// Excel's status bar: how many cells hold something, and — when any of them are
// numbers — what they come to. It is the fastest way to check a column without
// writing a formula anywhere, which is most of what it gets used for.
function tally() {
  if (!countBox) return;
  if (!spread()) { countBox.textContent = ''; return; }
  let held = 0;
  let numbers = 0;
  let sum = 0;
  eachInRegion((row, col) => {
    const cell = heldAt(row, col);
    const text = contentOf(cell);
    if (text === '') return;
    held++;
    const value = cell && typeof cell.value === 'object' && cell.value !== null
      ? cell.value.Number
      : undefined;
    if (typeof value === 'number') { numbers++; sum += value; }
  });
  const parts = [`Count ${held}`];
  if (numbers > 0) {
    parts.unshift(`Sum ${trim(sum)}`);
    parts.unshift(`Average ${trim(sum / numbers)}`);
  }
  countBox.textContent = parts.join('   ');
}

function paint() {
  const table = tableNow();
  if (!table) return;
  const lit = 'td.here, td.pick, td.edge-t, td.edge-b, td.edge-l, td.edge-r';
  for (const cell of table.querySelectorAll(lit)) {
    cell.classList.remove('here', 'pick', 'edge-t', 'edge-b', 'edge-l', 'edge-r');
  }
  const box = region();
  if (spread()) {
    eachInRegion((row, col) => {
      const cell = cellAt(row, col);
      if (!cell) return;
      cell.classList.add('pick');
      if (row === box.top) cell.classList.add('edge-t');
      if (row === box.bottom) cell.classList.add('edge-b');
      if (col === box.left) cell.classList.add('edge-l');
      if (col === box.right) cell.classList.add('edge-r');
    });
  }
  const cell = cellAt(at.row, at.col);
  if (cell) cell.classList.add('here');
  // Follow the corner being dragged, not the active cell: that is the edge
  // moving off the screen. With nothing selected they are the same cell.
  const edge = cellAt(reach.row, reach.col) || cell;
  if (edge) edge.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  whereBox.textContent = dragging && spread()
    ? `${box.bottom - box.top + 1}R x ${box.right - box.left + 1}C`
    : columnName(at.col) + at.row;
  tally();
}

// ── Carrying cells in and out ───────────────────────────────────────────────
//
// Tab-separated text is what every spreadsheet puts on the clipboard and what
// every one of them reads back, so a range copied here lands in Excel as cells
// rather than as one long line, and a block copied from Excel arrives here the
// same way. The HTML flavour goes alongside because that is what Excel reaches
// for first when it is the one pasting.

function fieldOf(text) {
  // A field holding a tab, a newline or a quote has to be quoted, or the other
  // end will read the one cell as several.
  return /[\t\n\r"]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
}

function selectionText() {
  const box = region();
  const lines = [];
  for (let row = box.top; row <= box.bottom; row++) {
    const cells = [];
    for (let col = box.left; col <= box.right; col++) {
      cells.push(fieldOf(contentOf(heldAt(row, col))));
    }
    lines.push(cells.join('\t'));
  }
  return lines.join('\n');
}

function selectionHtml() {
  const box = region();
  const safe = (text) => text.replace(/[&<>]/g, (one) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
  })[one]);
  const lines = [];
  for (let row = box.top; row <= box.bottom; row++) {
    const cells = [];
    for (let col = box.left; col <= box.right; col++) {
      cells.push('<td>' + safe(contentOf(heldAt(row, col))) + '</td>');
    }
    lines.push('<tr>' + cells.join('') + '</tr>');
  }
  return '<table>' + lines.join('') + '</table>';
}

// Split pasted text back into a grid, honouring the quoting above: a quoted
// field may itself contain tabs and newlines, and splitting on the separators
// alone would tear such a cell into pieces.
function asGrid(text) {
  const rows = [[]];
  let field = '';
  let quoted = false;
  let seen = 0;
  const push = () => { rows[rows.length - 1].push(field); field = ''; };
  while (seen < text.length) {
    const ch = text[seen];
    if (quoted) {
      if (ch === '"' && text[seen + 1] === '"') { field += '"'; seen += 2; continue; }
      if (ch === '"') { quoted = false; seen++; continue; }
      field += ch;
      seen++;
      continue;
    }
    if (ch === '"' && field === '') { quoted = true; seen++; continue; }
    if (ch === '\t') { push(); seen++; continue; }
    if (ch === '\r' || ch === '\n') {
      push();
      rows.push([]);
      seen += ch === '\r' && text[seen + 1] === '\n' ? 2 : 1;
      continue;
    }
    field += ch;
    seen++;
  }
  push();
  // A trailing newline is a line ending, not an empty last row.
  const last = rows[rows.length - 1];
  if (rows.length > 1 && last.length === 1 && last[0] === '') rows.pop();
  return rows;
}

function pasteGrid(grid) {
  if (grid.length === 0) return;
  const box = region();
  // One value into a selected block fills the block — the way it does in Excel,
  // and the reason anyone selects a block before pasting one thing.
  const single = grid.length === 1 && grid[0].length === 1;
  if (single && spread()) {
    eachInRegion((row, col) => put(row, col, grid[0][0]));
    draw();
    paint();
    return;
  }
  const top = single ? at.row : box.top;
  const left = single ? at.col : box.left;
  grid.forEach((line, down) => {
    line.forEach((text, across) => put(top + down, left + across, text));
  });
  draw();
  const wide = Math.max(...grid.map((line) => line.length));
  at = { row: top, col: left };
  anchor = { row: top, col: left };
  goTo(top + grid.length - 1, left + wide - 1, false, true);
}

function clearSelection() {
  eachInRegion((row, col) => put(row, col, ''));
  draw();
  paint();
}

function busyElsewhere() {
  return !book || editor || document.activeElement === formulaBox;
}

document.addEventListener('copy', (event) => {
  if (busyElsewhere()) return;
  event.clipboardData.setData('text/plain', selectionText());
  event.clipboardData.setData('text/html', selectionHtml());
  event.preventDefault();
});

document.addEventListener('cut', (event) => {
  if (busyElsewhere()) return;
  event.clipboardData.setData('text/plain', selectionText());
  event.clipboardData.setData('text/html', selectionHtml());
  event.preventDefault();
  clearSelection();
});

document.addEventListener('paste', (event) => {
  if (busyElsewhere()) return;
  const text = event.clipboardData.getData('text/plain');
  if (!text) return;
  event.preventDefault();
  pasteGrid(asGrid(text));
});

// ── Keeping what was typed ──────────────────────────────────────────────────
//
// An edit you cannot save is not an edit. The file is patched rather than
// rewritten: `edit_xlsx` opens the bytes that arrived, changes the cells it is
// told about and hands the archive back, so the parts nobody touched come
// through untouched.

const saveButton = document.getElementById('save');

// The type has to travel with the value, because the same text means different
// things: `=A1` is a formula, `12` a number, `12a` text, and an empty box
// means clear the cell rather than write the empty string into it.
function edited(text) {
  if (text === '') return { value_type: 'empty', new_value: '' };
  if (text.startsWith('=')) return { value_type: 'formula', new_value: text };
  if (text.trim() !== '' && Number.isFinite(Number(text))) {
    return { value_type: 'number', new_value: text };
  }
  return { value_type: 'string', new_value: text };
}

function remember(row, col, text) {
  const held = edited(text);
  changes.set(`${shown},${row},${col}`, {
    sheet_index: shown,
    row: row,
    col: col,
    ...held,
  });
  markSaved();
}

function markSaved() {
  if (!saveButton) return;
  const count = changes.size;
  saveButton.disabled = count === 0;
  saveButton.textContent = count === 0
    ? 'Save'
    : `Save (${count} cell${count === 1 ? '' : 's'})`;
}

async function save() {
  if (!source || changes.size === 0) return;
  const was = saveButton.textContent;
  saveButton.disabled = true;
  saveButton.textContent = 'Saving…';
  try {
    const written = edit_xlsx(source, [...changes.values()]);
    const blob = new Blob([written], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
    });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = fileName.replace(/\.xlsx$/i, '') + '-edited.xlsx';
    link.click();
    URL.revokeObjectURL(link.href);
    // What was saved is now what the file holds: the next save starts from
    // the bytes just written, so two saves in a row do not send the first
    // batch of edits twice.
    source = written;
    changes.clear();
    markSaved();
  } catch (error) {
    saveButton.textContent = was;
    saveButton.disabled = false;
    stateBox.style.display = 'block';
    stateBox.textContent = `Oxi could not save: ${error}`;
  }
}

if (saveButton) saveButton.addEventListener('click', save);

// ── Living in the grid ──────────────────────────────────────────────────────
//
// What separates a sheet from a table is that you never reach for the mouse.
// The cell you are on takes what you type, the arrows walk it, and Enter puts
// the value in and steps down ready for the next one. Excel's habits here are
// specific enough that getting them nearly right feels wrong, so they are
// spelled out rather than approximated.

let at = { row: 1, col: 0 };
// Where a run of Tabs began. Excel remembers it: Tab across three cells, press
// Enter, and you land under the cell you STARTED tabbing from, not under the
// last one. It is what makes filling in a row of a form feel like a form.
let tabHome = null;
let editor = null;

const whereBox = document.getElementById('where');
const formulaBox = document.getElementById('formula');

function tableNow() {
  return sheetBox.querySelector('table');
}

function cellAt(row, col) {
  const table = tableNow();
  return table && table.querySelector('td[data-row="' + row + '"][data-col="' + col + '"]');
}

function sheetNow() {
  return book && book.sheets && book.sheets[shown];
}

function heldAt(row, col) {
  const sheet = sheetNow();
  if (!sheet) return undefined;
  const line = sheet.rows.find((one) => one.index === row);
  return line && line.cells.find((one) => one.col === col);
}

// What the formula bar shows: the formula if there is one, else what is
// STORED — not what is displayed. A date shows as a date in the grid and as
// its own number here, which is the distinction Excel draws too.
function contentOf(cell) {
  if (!cell) return '';
  if (cell.formula) return '=' + cell.formula;
  const raw = typeof cell.value === 'object' && cell.value !== null
    ? Object.values(cell.value)[0]
    : (cell.value === 'Empty' ? '' : cell.value);
  return raw === undefined || raw === null ? '' : String(raw);
}

function extent() {
  const table = tableNow();
  if (!table) return { rows: 1, cols: 0 };
  const last = table.rows[table.rows.length - 1];
  return { rows: table.rows.length - 1, cols: last ? last.cells.length - 2 : 0 };
}

// `extend` keeps the anchor where it is and drags the far corner of the
// selection to the new cell, which is what Shift does to every movement key.
function goTo(row, col, keepTabHome, extend) {
  const bounds = extent();
  const spot = {
    row: Math.min(Math.max(1, row), bounds.rows),
    col: Math.min(Math.max(0, col), bounds.cols),
  };
  reach = { row: spot.row, col: spot.col };
  if (!extend) {
    at = { row: spot.row, col: spot.col };
    anchor = { row: spot.row, col: spot.col };
  }
  if (!keepTabHome) tabHome = null;
  if (!tableNow()) return;
  paint();
  // The panel and the formula bar always describe the ACTIVE cell, not the
  // range: with a block selected it is still one cell you are about to type
  // into, and showing the block's first cell instead would be a lie about
  // where the next keystroke lands.
  const held = heldAt(at.row, at.col);
  formulaBox.value = contentOf(held);
  if (held) describeCell(columnName(at.col) + at.row, held);
  else cellBox.innerHTML = '<dd class="none">empty</dd>';
}

// Ctrl with an arrow runs to the edge of the block you are in: to the last
// written cell if you are on written ground, else to the next written one.
// It is how anyone moves about a large sheet, and stepping a row at a time is
// not the same thing.
function runTo(dRow, dCol, extend) {
  const bounds = extent();
  let row = extend ? reach.row : at.row;
  let col = extend ? reach.col : at.col;
  const filled = (r, c) => contentOf(heldAt(r, c)) !== '';
  const started = filled(row + dRow, col + dCol);
  let moved = false;
  for (;;) {
    const nextRow = row + dRow;
    const nextCol = col + dCol;
    if (nextRow < 1 || nextRow > bounds.rows || nextCol < 0 || nextCol > bounds.cols) break;
    if (started && !filled(nextRow, nextCol)) break;
    row = nextRow;
    col = nextCol;
    moved = true;
    if (!started && filled(row, col)) break;
  }
  if (moved) goTo(row, col, false, extend);
}

// Typing over a cell replaces it; F2 opens it with what is already there.
function edit(seed) {
  const cell = cellAt(at.row, at.col);
  if (!cell || editor) return;
  const held = heldAt(at.row, at.col);
  const input = document.createElement('input');
  input.className = 'inline';
  input.value = seed === null ? contentOf(held) : seed;
  editor = { cell, input, was: cell.textContent };
  cell.textContent = '';
  cell.appendChild(input);
  input.focus();
  if (seed === null) input.select();
  else input.setSelectionRange(input.value.length, input.value.length);
}

// Put the typed text into the sheet. Excel decides then and there whether it
// is a number: `12` right-aligns, `12a` does not, and for most people that is
// the only sign a column will add up.
function put(row, col, text) {
  const sheet = sheetNow();
  if (!sheet) return;
  let line = sheet.rows.find((one) => one.index === row);
  if (!line) {
    line = { index: row, cells: [], height: null };
    sheet.rows.push(line);
    sheet.rows.sort((a, b) => a.index - b.index);
  }
  let cell = line.cells.find((one) => one.col === col);
  if (!cell) {
    cell = { col: col, value: 'Empty', style: {}, formula: null, runs: [] };
    line.cells.push(cell);
    line.cells.sort((a, b) => a.col - b.col);
  }
  cell.formula = text.startsWith('=') ? text.slice(1) : null;
  if (cell.formula) cell.value = { String: '' };
  else if (text === '') cell.value = 'Empty';
  else if (text.trim() !== '' && Number.isFinite(Number(text))) cell.value = { Number: Number(text) };
  else cell.value = { String: text };
  remember(row, col, text);
}

// With a block selected, Enter and Tab do not leave it: Enter walks down the
// column and wraps to the top of the next one, Tab walks across and wraps to
// the start of the next row. It is how a range gets filled in without ever
// steering, and it is why people select the block first.
function stepInside(down, across) {
  const box = region();
  const tall = box.bottom - box.top + 1;
  const wideness = box.right - box.left + 1;
  let seat = down !== 0
    ? (at.col - box.left) * tall + (at.row - box.top) + down
    : (at.row - box.top) * wideness + (at.col - box.left) + across;
  const seats = tall * wideness;
  seat = ((seat % seats) + seats) % seats;
  const spot = down !== 0
    ? { row: box.top + (seat % tall), col: box.left + Math.floor(seat / tall) }
    : { row: box.top + Math.floor(seat / wideness), col: box.left + (seat % wideness) };
  at = spot;
  paint();  // `anchor` and `reach` stay put: the block is unchanged.
  const held = heldAt(at.row, at.col);
  formulaBox.value = contentOf(held);
  if (held) describeCell(columnName(at.col) + at.row, held);
  else cellBox.innerHTML = '<dd class="none">empty</dd>';
}

function commit(then) {
  if (!editor) return;
  const text = editor.input.value;
  editor = null;
  put(at.row, at.col, text);
  draw();
  goTo(at.row, at.col, true);
  if (then) then();
}

function cancel() {
  if (!editor) return;
  const held = editor;
  editor = null;
  held.cell.textContent = held.was;
  goTo(at.row, at.col, true);
}

function onKey(event) {
  if (!book) return;
  const bounds = extent();
  if (editor) {
    if (event.key === 'Escape') {
      event.preventDefault();
      cancel();
    } else if (event.key === 'Enter') {
      event.preventDefault();
      const down = event.shiftKey ? -1 : 1;
      const back = tabHome;
      const inside = spread();
      commit(() => inside
        ? stepInside(down, 0)
        : goTo(at.row + down, back === null ? at.col : back));
    } else if (event.key === 'Tab') {
      event.preventDefault();
      const step = event.shiftKey ? -1 : 1;
      if (spread()) { commit(() => stepInside(0, step)); return; }
      if (tabHome === null) tabHome = at.col;
      commit(() => goTo(at.row, at.col + step, true));
    }
    return;
  }
  const jump = event.ctrlKey || event.metaKey;
  const wide = event.shiftKey;
  // Shift walks the corner being dragged; without it, the active cell.
  const from = wide ? reach : at;
  switch (event.key) {
    case 'ArrowUp':
      event.preventDefault();
      if (jump) runTo(-1, 0, wide); else goTo(from.row - 1, from.col, false, wide);
      break;
    case 'ArrowDown':
      event.preventDefault();
      if (jump) runTo(1, 0, wide); else goTo(from.row + 1, from.col, false, wide);
      break;
    case 'ArrowLeft':
      event.preventDefault();
      if (jump) runTo(0, -1, wide); else goTo(from.row, from.col - 1, false, wide);
      break;
    case 'ArrowRight':
      event.preventDefault();
      if (jump) runTo(0, 1, wide); else goTo(from.row, from.col + 1, false, wide);
      break;
    case 'Tab':
      event.preventDefault();
      if (spread()) { stepInside(0, event.shiftKey ? -1 : 1); break; }
      if (tabHome === null) tabHome = at.col;
      goTo(at.row, at.col + (event.shiftKey ? -1 : 1), true);
      break;
    case 'Enter':
      event.preventDefault();
      if (spread()) stepInside(event.shiftKey ? -1 : 1, 0);
      else if (tabHome !== null) goTo(at.row + 1, tabHome);
      else goTo(at.row + (event.shiftKey ? -1 : 1), at.col);
      break;
    case 'Home':
      event.preventDefault();
      goTo(jump ? 1 : from.row, 0, false, wide);
      break;
    case 'End':
      event.preventDefault();
      goTo(jump ? bounds.rows : from.row, bounds.cols, false, wide);
      break;
    case 'PageDown':
      event.preventDefault();
      goTo(from.row + 20, from.col, false, wide);
      break;
    case 'PageUp':
      event.preventDefault();
      goTo(from.row - 20, from.col, false, wide);
      break;
    case 'a':
    case 'A':
      if (!jump) break;
      event.preventDefault();
      at = { row: 1, col: 0 };
      anchor = { row: 1, col: 0 };
      goTo(bounds.rows, bounds.cols, false, true);
      break;
    case 'F2':
      event.preventDefault();
      edit(null);
      break;
    case 'Delete':
    case 'Backspace':
      event.preventDefault();
      clearSelection();
      break;
    default:
      // A printable key starts a new value, the way it does in Excel: you do
      // not open the cell first, you just type.
      if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        edit(event.key);
      }
  }
}

document.addEventListener('mouseup', () => {
  if (!dragging) return;
  dragging = false;
  // The name box goes back to the anchor's address now the size has been read.
  paint();
});

document.addEventListener('keydown', (event) => {
  if (document.activeElement === formulaBox) {
    if (event.key === 'Enter') {
      event.preventDefault();
      put(at.row, at.col, formulaBox.value);
      draw();
      goTo(at.row + 1, at.col);
      const table = tableNow();
      if (table) table.focus();
    } else if (event.key === 'Escape') {
      event.preventDefault();
      formulaBox.value = contentOf(heldAt(at.row, at.col));
      const table = tableNow();
      if (table) table.focus();
    }
    return;
  }
  onKey(event);
});

async function open(data, name) {
  try {
    source = new Uint8Array(data).slice();
    fileName = name || 'workbook.xlsx';
    changes.clear();
    markSaved();
    book = parse_spreadsheet(new Uint8Array(data));
  } catch (error) {
    stateBox.style.display = 'block';
    stateBox.textContent = `Oxi could not read ${name}: ${error}`;
    const table = sheetBox.querySelector('table');
    if (table) table.remove();
    return;
  }
  shown = 0;
  const style = book.default_style || {};
  digitWidth = measureDigit(style.font_name, style.font_size);
  draw();
  describe();
  // A new workbook starts at its own A1 rather than wherever the last one was
  // left, and with nothing selected from it.
  goTo(1, 0);
}

async function openSample() {
  stateBox.style.display = 'block';
  stateBox.textContent = 'Reading the sample…';
  const reply = await fetch(SAMPLE);
  if (!reply.ok) {
    stateBox.textContent =
      'The sample could not be fetched. Serve this folder over http rather than opening the file directly.';
    return;
  }
  await open(await reply.arrayBuffer(), 'the sample');
}

document.getElementById('reset').onclick = openSample;
document.getElementById('pick').onchange = async (event) => {
  const file = event.target.files[0];
  if (file) await open(await file.arrayBuffer(), file.name);
};

for (const kind of ['dragenter', 'dragover']) {
  sheetBox.addEventListener(kind, (event) => {
    event.preventDefault();
    dropBox.classList.add('over');
  });
}
for (const kind of ['dragleave', 'drop']) {
  sheetBox.addEventListener(kind, (event) => {
    event.preventDefault();
    dropBox.classList.remove('over');
  });
}
sheetBox.addEventListener('drop', async (event) => {
  const file = event.dataTransfer.files[0];
  if (file) await open(await file.arrayBuffer(), file.name);
});

await init();
await openSample();
</script>
</body>
</html>
