<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oxi — slide editor on the engine's own layout</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --ink: #e8eaed;
    --dim: #9aa3ad; --engine: #4ade80; --browser: #fbbf24; --sel: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  h1 { font-size: 14px; font-weight: 600; margin: 0; }
  .spacer { flex: 1; }
  button, label.file { background: #2a2f38; color: var(--ink); border: 1px solid var(--line);
           border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover, label.file:hover { background: #333945; }
  button[disabled] { opacity: .45; cursor: default; }
  input[type=file] { display: none; }
  main { display: flex; height: calc(100vh - 49px); }
  #thumbs { width: 150px; overflow-y: auto; background: var(--panel);
            border-right: 1px solid var(--line); padding: 8px; flex: none; }
  .thumb { border: 2px solid transparent; border-radius: 4px; margin-bottom: 6px;
           cursor: pointer; overflow: hidden; background: #000; }
  .thumb.on { border-color: var(--sel); }
  .thumb canvas { display: block; width: 100%; }
  #stage { flex: 1; overflow: auto; display: flex; align-items: flex-start;
           justify-content: center; padding: 20px; }
  #wrap { position: relative; box-shadow: 0 6px 30px #0008; }
  canvas#slide { display: block; background: #fff; }
  #caret { position: absolute; width: 2px; background: var(--sel); display: none;
           animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #side { width: 260px; background: var(--panel); border-left: 1px solid var(--line);
          padding: 12px; overflow-y: auto; flex: none; }
  .k { color: var(--dim); font-size: 11px; text-transform: uppercase;
       letter-spacing: .06em; margin: 12px 0 4px; }
  .v { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .tag.engine { background: #14532d; color: var(--engine); }
  .tag.browser { background: #4a3208; color: var(--browser); }
  #status { padding: 6px 16px; background: var(--panel); border-top: 1px solid var(--line);
            color: var(--dim); font-size: 12px; }
  .hint { color: var(--dim); font-size: 12px; }
  ul.fams { margin: 4px 0; padding-left: 16px; }
  ul.fams li { margin: 1px 0; }
</style>
</head>
<body>
<header>
  <h1>Oxi slide editor</h1>
  <label class="file">Open .pptx<input type="file" id="file" accept=".pptx"></label>
  <button id="save" disabled>Save</button>
  <span class="spacer"></span>
  <span class="hint">green = laid out by the engine &nbsp; amber = the engine could not measure it</span>
</header>
<main>
  <div id="thumbs"></div>
  <div id="stage">
    <div id="wrap">
      <canvas id="slide" width="960" height="540"></canvas>
      <div id="caret"></div>
    </div>
  </div>
  <div id="side">
    <div class="k">Slide</div><div class="v" id="s-slide">—</div>
    <div class="k">Engine coverage</div><div class="v" id="s-cover">—</div>
    <div class="k">Selection</div><div class="v" id="s-sel">nothing selected</div>
    <div class="k">Families the engine cannot measure</div>
    <ul class="fams" id="s-fams"><li class="hint">—</li></ul>
  </div>
</main>
<div id="status">No file loaded.</div>

<script type="module">
import init, {
  parse_presentation, layout_slide_shape, slide_family_measurable,
  edit_pptx_with_splits, slide_face_advance,
} from './oxidocs_wasm.js';
import { collectAdvances, familyPresent, measureFace } from './face-metrics.js';

const $ = (id) => document.getElementById(id);
const cv = $('slide'), ctx = cv.getContext('2d');
const state = {
  bytes: null, pres: null, slide: 0, scale: 1,
  laid: [],            // per shape: {shape, shapeIndex, paragraphs, layout}
  sel: null,           // {entry, line, charIndex, inLine}
  anchor: null,        // where a selection began, as a character offset
  edits: new Map(),    // "slide/shape/para/run" -> new text
  undo: [], redo: [],  // each step: what a run said before and after
  splits: [],          // {slide, shape, para, at} -- where Enter broke a paragraph
  formats: [],         // {slide, shape, para, run, bold?, italic?, ...}
  original: new Map(), // "shape/para/run" -> the text the file opened with
};

/* ---------- the engine's layout ---------------------------------------- */

// The levels a shape inherits: its own placeholder list, and the master's for
// the kind of placeholder it is. A plain textbox uses the master's `other`.
function masterLevels(shape) {
  const st = state.pres.master_styles || {};
  const t = (shape.ph_type || '').toLowerCase();
  if (t === 'title' || t === 'ctrtitle') return st.title || [];
  if (t) return st.body || [];
  return st.other || [];
}

// The family a paragraph inherits when its runs do not name one, so the page
// measures the face the engine is about to use rather than a default it isn't.
function familyOfLevel(shape, para) {
  const levels = (shape.ph_levels && shape.ph_levels.length)
    ? shape.ph_levels : masterLevels(shape);
  if (!levels.length) return null;
  const lv = levels[Math.min(para.lvl || 0, levels.length - 1)];
  return (lv && lv.font_family) || null;
}

function paragraphsOf(shape) {
  const c = shape.content;
  if (!c) return null;
  if (c.TextBox) return c.TextBox.paragraphs;
  if (c.AutoShape) return c.AutoShape.paragraphs;
  return null;
}

// Ask the engine to place every text shape of the current slide.
function layoutSlide() {
  const slide = state.pres.slides[state.slide];
  state.laid = [];
  slide.shapes.forEach((shape, shapeIndex) => {
    const paragraphs = paragraphsOf(shape);
    if (!paragraphs || !paragraphs.length) return;
    // What this browser can measure for the faces this shape names. The
    // engine's tables answer for what the build machine had; these answer for
    // everything else the browser can actually draw.
    const fallback = state.pres.minor_font || 'Calibri';
    const advances = collectAdvances(
      paragraphs.flatMap(p => p.runs.map(r => ({
        text: r.text,
        font_family: r.font_family || familyOfLevel(shape, p) || fallback,
        bold: r.bold, italic: r.italic,
      }))),
      fallback);
    let layout = null;
    try {
      layout = layout_slide_shape(
        shape, paragraphs, masterLevels(shape), shape.ph_levels || [],
        fallback, advances);
    } catch (e) {
      console.warn('layout refused', e);
    }
    if (layout) {
      state.laid.push({ shape, shapeIndex, paragraphs, layout });
      paragraphs.forEach((p, pi) => p.runs.forEach((r, ri) => {
        const k = shapeIndex + '/' + pi + '/' + ri;
        if (!state.original.has(k)) state.original.set(k, r.text);
      }));
    }
  });
}

/* ---------- where each character sits ----------------------------------- */

// The x of every character boundary of a line, in POINTS from the line's start.
//
// ★This is the renderer's rule, not the browser's. `runtime_dx_px` accumulates
// the EXACT design advance and rounds the running total once per glyph -- no
// kerning, no shaping -- because that is what PowerPoint both breaks and
// centres against. `fillText` on a whole string kerns it, so a line drawn that
// way drifts from where PowerPoint puts the same glyphs, and the caret drifts
// with it. Measuring and drawing from one array keeps the three in step.
//
// Null when the face cannot be measured; the caller then falls back to the
// browser's own measuring, which is what an unmeasurable shape already gets.
function lineOffsets(line) {
  if (line.__off !== undefined) return line.__off;
  const off = [0];
  let x = 0;
  for (const sg of lineParts(line)) {
    const cps = [...sg.text];
    // What the page measured, else what the engine's own tables say. The
    // engine laid the line out on one of those two, so drawing on the other --
    // or on whatever face the browser substituted -- would put the glyphs
    // somewhere the layout never agreed to.
    const em = measureFace(sg.family, sg.bold, sg.italic, sg.text)
      || cps.map(ch => slide_face_advance(sg.family, sg.bold, sg.italic, ch));
    if (!em) { line.__off = null; return null; }
    for (let i = 0; i < cps.length; i++) {
      if (em[i] === null || em[i] === undefined) { line.__off = null; return null; }
      x += em[i] * sg.font_size;
      // One entry per CODE UNIT, so the callers can keep indexing with
      // `slice(0, i)` offsets while the advances are indexed by code point.
      for (let u = 0; u < cps[i].length; u++) off.push(x);
    }
  }
  line.__off = off;
  return off;
}

// The stretches a line is set in. A paragraph is not one face: a bullet that
// opens with a bold `Alternative:` and continues in the regular weight is two,
// and measuring the whole line in either one puts the rest of it wrong.
function lineParts(line) {
  if (line.segments && line.segments.length) return line.segments;
  return [{ text: line.text, family: line.family, font_size: line.font_size,
            bold: line.bold, italic: line.italic, start: 0 }];
}

function lineFont(part, k) {
  return `${part.italic ? 'italic ' : ''}${part.bold ? '700 ' : ''}` +
         `${part.font_size * k}px ${JSON.stringify(String(part.family))}, sans-serif`;
}

// How far into a line character `n` starts, in device pixels.
function prefixWidth(line, n, k) {
  const off = lineOffsets(line);
  if (off) return off[Math.min(n, off.length - 1)] * k;
  ctx.font = lineFont(line, k);
  return ctx.measureText(line.text.slice(0, n)).width;
}

/* ---------- drawing ----------------------------------------------------- */

function bytesToUrl(data, type) {
  const blob = new Blob([new Uint8Array(data)], { type: type || 'image/png' });
  return URL.createObjectURL(blob);
}

function paintBackground(slide, w, h) {
  ctx.fillStyle = slide.background_color ? '#' + slide.background_color : '#fff';
  ctx.fillRect(0, 0, w, h);
}

function paintShapeBox(shape, k) {
  const x = shape.x * k, y = shape.y * k, w = shape.width * k, h = shape.height * k;
  if (shape.fill_color) {
    const a = shape.fill_alpha == null ? 1 : shape.fill_alpha;
    const c = shape.fill_color;
    ctx.fillStyle = a >= 1 ? '#' + c
      : `rgba(${parseInt(c.slice(0,2),16)},${parseInt(c.slice(2,4),16)},${parseInt(c.slice(4,6),16)},${a})`;
    ctx.fillRect(x, y, w, h);
  }
  if (shape.border_color) {
    ctx.strokeStyle = '#' + shape.border_color;
    ctx.lineWidth = Math.max(1, (shape.border_width || 1) * k);
    ctx.strokeRect(x, y, w, h);
  }
}

// The band behind the selected characters, drawn line by line so a selection
// that wraps is shown where it actually sits.
function paintSelection(k) {
  const range = selectedRange();
  if (!range) return;
  const { entry } = state.sel;
  ctx.fillStyle = 'rgba(96,165,250,.32)';
  for (const line of entry.layout.lines) {
    if (line.para_index !== range.para) continue;
    const s0 = Math.max(range.from - line.char_start, 0);
    const s1 = Math.min(range.to - line.char_start, line.text.length);
    if (s1 <= s0) continue;
    const x0 = (entry.shape.x + line.x) * k + prefixWidth(line, s0, k);
    const x1 = (entry.shape.x + line.x) * k + prefixWidth(line, s1, k);
    const y = (entry.shape.y + line.baseline) * k;
    ctx.fillRect(x0, y - line.font_size * k * 0.85, x1 - x0, line.font_size * k * 1.05);
  }
}

function paintLines(entry, k) {
  const { shape, layout } = entry;
  for (const line of layout.lines) {
    const px = (shape.x + line.x) * k;
    const py = (shape.y + line.baseline) * k;
    ctx.fillStyle = '#111';
    ctx.textBaseline = 'alphabetic';
    const off = lineOffsets(line);
    if (off) {
      // Character by character, each at its own design position, in the face
      // its own run is set in.
      for (const sg of lineParts(line)) {
        ctx.font = lineFont(sg, k);
        let u = sg.start;
        for (const ch of sg.text) {
          ctx.fillText(ch, px + off[u] * k, py);
          u += ch.length;
        }
      }
    } else {
      ctx.font = lineFont(line, k);
      ctx.fillText(line.text, px, py);
    }
  }
  // Say which layout this was: the engine's, or a fallback.
  ctx.strokeStyle = layout.complete ? 'rgba(74,222,128,.55)' : 'rgba(251,191,36,.75)';
  ctx.setLineDash(layout.complete ? [] : [5, 4]);
  ctx.lineWidth = 1;
  ctx.strokeRect(shape.x * k, shape.y * k, shape.width * k, shape.height * k);
  ctx.setLineDash([]);
}

function paint() {
  const slide = state.pres.slides[state.slide];
  const k = state.scale;
  cv.width = state.pres.slide_width * k;
  cv.height = state.pres.slide_height * k;
  paintBackground(slide, cv.width, cv.height);
  for (const shape of slide.shapes) paintShapeBox(shape, k);
  paintSelection(k);
  for (const entry of state.laid) paintLines(entry, k);
  paintCaret();
}

/* ---------- selection and the caret ------------------------------------- */

// Which line was clicked, and where in it. The layout carries the paragraph and
// the character offset, so a hit maps straight back to the text.
function hitTest(px, py) {
  const k = state.scale;
  for (const entry of state.laid) {
    const { shape, layout } = entry;
    for (const line of layout.lines) {
      const x = (shape.x + line.x) * k;
      const y = (shape.y + line.baseline) * k;
      const h = line.font_size * k;
      if (py < y - h * 0.9 || py > y + h * 0.3) continue;
      const w = prefixWidth(line, line.text.length, k);
      if (px < x - 2 || px > x + w + 2) continue;
      // Walk the characters to find the closest boundary.
      let best = 0, bestD = Infinity;
      for (let i = 0; i <= line.text.length; i++) {
        const d = Math.abs(x + prefixWidth(line, i, k) - px);
        if (d < bestD) { bestD = d; best = i; }
      }
      return { entry, line, charIndex: line.char_start + best, inLine: best };
    }
  }
  return null;
}

function paintCaret() {
  const c = $('caret');
  if (!state.sel) { c.style.display = 'none'; return; }
  const { line, inLine } = state.sel;
  const k = state.scale, shape = state.sel.entry.shape;
  const w = prefixWidth(line, inLine, k);
  c.style.display = 'block';
  c.style.left = ((shape.x + line.x) * k + w) + 'px';
  c.style.top = ((shape.y + line.baseline) * k - line.font_size * k * 0.85) + 'px';
  c.style.height = (line.font_size * k * 1.05) + 'px';
}

cv.addEventListener('mousedown', (e) => {
  const r = cv.getBoundingClientRect();
  state.sel = hitTest(e.clientX - r.left, e.clientY - r.top);
  state.anchor = null;
  describeSelection();
  paint();
});

// Put the caret at a character of a paragraph, finding the line that holds it.
//
// Every edit and every arrow key ends here, so there is one answer to "which
// line is character N on" -- and after a re-layout the line objects are new,
// which is why this looks the shape up again rather than keeping the old one.
function placeCaret(shapeIndex, paraIndex, charIndex) {
  const entry = state.laid.find(x => x.shapeIndex === shapeIndex);
  if (!entry) { state.sel = null; return; }
  const para = entry.paragraphs[paraIndex];
  const len = para ? para.runs.reduce((n, r) => n + [...r.text].length, 0) : 0;
  const want = Math.max(0, Math.min(charIndex, len));
  let found = null;
  for (const l of entry.layout.lines) {
    if (l.para_index !== paraIndex) continue;
    if (!found) found = l;
    if (want >= l.char_start && want <= l.char_start + l.text.length) found = l;
  }
  if (!found) { state.sel = null; return; }
  state.sel = { entry, line: found, charIndex: want,
                inLine: Math.max(0, Math.min(want - found.char_start, found.text.length)) };
}

// The lines of the selected shape, in the order they are drawn.
function linesOfSelection() {
  return state.sel ? state.sel.entry.layout.lines : [];
}

// The selected range within the caret's paragraph, or null.
//
// A selection stays inside ONE paragraph. Reaching across paragraphs is a
// different operation -- it joins them -- and pretending otherwise would let a
// delete quietly change the structure.
function selectedRange() {
  if (!state.sel || state.anchor === null) return null;
  const a = Math.min(state.anchor, state.sel.charIndex);
  const b = Math.max(state.anchor, state.sel.charIndex);
  return a === b ? null : { from: a, to: b, para: state.sel.line.para_index };
}

function describeSelection() {
  if (!state.sel) { $('s-sel').textContent = 'nothing selected'; return; }
  const { entry, line, charIndex } = state.sel;
  const range = selectedRange();
  $('s-sel').innerHTML =
    `shape ${entry.shapeIndex}, paragraph ${line.para_index}, char ${charIndex}` +
    (range ? ` <b>selected ${range.to - range.from}</b>` : '') +
    `<br><span class="hint">${line.family} ${line.font_size}pt` +
    `${line.bold ? ' bold' : ''}${line.italic ? ' italic' : ''}</span>`;
}

/* ---------- editing ------------------------------------------------------ */

// Type into the selected paragraph. The run that owns the character takes the
// change, so the edit can be expressed the way `edit_pptx` addresses it.
// Ctrl+B and Ctrl+I change how the selected runs look.
//
// The change is recorded against every run the selection covers -- or the run
// under the caret when there is no selection -- and applied at the save. The
// screen shows it at once by changing the run in the page's own copy, which is
// safe here because a look does not move any paragraph: the numbering an edit
// is addressed by cannot drift under it.
document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  if (!state.sel || !mod) return;
  const k = e.key.toLowerCase();
  if (k !== 'b' && k !== 'i') return;
  e.preventDefault();
  const { entry, line } = state.sel;
  if (entry.shape.sp_index == null) { say('this shape cannot be edited yet'); return; }
  const range = selectedRange();
  const para = entry.paragraphs[line.para_index];
  const from = range ? range.from : state.sel.charIndex;
  const to = range ? range.to : state.sel.charIndex + 1;
  let seen = 0, touched = 0;
  para.runs.forEach((run, ri) => {
    const n = [...run.text].length;
    const start = seen; seen += n;
    if (Math.min(to, start + n) <= Math.max(from, start)) return;
    // ★Toggle against the EFFECTIVE weight, not the run's own flag. A run
    // inside a bold placeholder level looks bold while `run.bold` is false,
    // and toggling the flag there would set `b="1"` and change nothing on
    // screen. The line the engine placed carries the weight actually drawn.
    const effective = k === 'b' ? line.bold : line.italic;
    const now = !effective;
    if (k === 'b') run.bold = now; else run.italic = now;
    state.formats = state.formats.filter(f => !(
      f.shape_index === entry.shape.sp_index &&
      f.paragraph_index === line.para_index && f.run_index === ri));
    state.formats.push({
      slide_index: state.slide, shape_index: entry.shape.sp_index,
      paragraph_index: line.para_index, run_index: ri,
      bold: run.bold, italic: run.italic,
    });
    touched++;
  });
  if (!touched) { say('nothing to change'); return; }
  $('save').disabled = false;
  layoutSlide();
  placeCaret(entry.shapeIndex, line.para_index, state.sel.charIndex);
  describeSelection();
  paint();
  say(`${k === 'b' ? 'bold' : 'italic'} changed on ${touched} ` +
      `run${touched === 1 ? '' : 's'}`);
});

// Moving the caret: within a line, across lines, and across paragraphs.
document.addEventListener('keydown', (e) => {
  if (!state.sel) return;
  const moves = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'];
  if (!moves.includes(e.key)) return;
  e.preventDefault();
  // Shift starts a selection at the caret and keeps it; moving without shift
  // drops it, which is what every editor does.
  if (e.shiftKey && state.anchor === null) state.anchor = state.sel.charIndex;
  else if (!e.shiftKey) state.anchor = null;
  const { entry, line } = state.sel;
  const lines = linesOfSelection();
  const at = lines.indexOf(line);
  const paraLen = (i) => entry.paragraphs[i].runs
    .reduce((n, r) => n + [...r.text].length, 0);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const step = e.key === 'ArrowLeft' ? -1 : 1;
    const next = state.sel.charIndex + step;
    if (next < 0 || next > paraLen(line.para_index)) {
      // Off the end of a paragraph: step into the neighbour.
      const to = line.para_index + step;
      if (to < 0 || to >= entry.paragraphs.length) return;
      placeCaret(entry.shapeIndex, to, step < 0 ? paraLen(to) : 0);
    } else {
      placeCaret(entry.shapeIndex, line.para_index, next);
    }
  } else if (e.key === 'Home' || e.key === 'End') {
    placeCaret(entry.shapeIndex, line.para_index,
               e.key === 'Home' ? line.char_start
                                : line.char_start + line.text.trimEnd().length);
  } else {
    // Up and down keep the column, measured in characters within the line.
    const to = lines[at + (e.key === 'ArrowUp' ? -1 : 1)];
    if (!to) return;
    const col = Math.min(state.sel.inLine, to.text.length);
    placeCaret(entry.shapeIndex, to.para_index, to.char_start + col);
  }
  describeSelection();
  paint();
});

// Undo and redo. A step holds what a run said before and after, so an undo is
// the same operation as the edit with the two swapped -- and an undo that
// arrives back at the text the file opened with drops the edit entirely,
// rather than saving the original value as a change.
function applyStep(step, direction) {
  const entry = state.laid.find(x => x.shapeIndex === step.shapeIndex);
  if (!entry) return;
  // A step carries every run it touched: deleting a selection can rewrite
  // several at once, and an undo that put back only the first would leave the
  // rest of the range deleted.
  for (const r of step.runs) {
    const run = entry.paragraphs[step.paraIndex].runs[r.runIndex];
    run.text = direction === 'undo' ? r.before : r.after;
    const key = state.slide + '/' + entry.shape.sp_index + '/' +
                step.paraIndex + '/' + r.runIndex;
    if (run.text === r.original) state.edits.delete(key);
    else state.edits.set(key, run.text);
  }
  layoutSlide();
  placeCaret(step.shapeIndex, step.paraIndex,
             direction === 'undo' ? step.caretBefore : step.caretAfter);
  $('save').disabled = state.edits.size === 0;
  describeSelection();
  paint();
}

document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;
  const undo = mod && e.key.toLowerCase() === 'z' && !e.shiftKey;
  const redo = mod && (e.key.toLowerCase() === 'y' ||
                       (e.key.toLowerCase() === 'z' && e.shiftKey));
  if (!undo && !redo) return;
  e.preventDefault();
  const from = undo ? state.undo : state.redo;
  const to = undo ? state.redo : state.undo;
  const step = from.pop();
  if (!step) { say(undo ? 'nothing to undo' : 'nothing to redo'); return; }
  to.push(step);
  applyStep(step, undo ? 'undo' : 'redo');
  say((undo ? 'undone' : 'redone') + ' \u2014 ' + state.edits.size +
      ' run' + (state.edits.size === 1 ? '' : 's') + ' edited');
});

// Enter breaks the paragraph at the caret, and COMMITS.
//
// Every pending edit is written into the bytes along with the break, and the
// deck is re-opened from the result. That costs a save and a parse per break,
// and it buys the only thing that matters here: after Enter the screen shows
// what the file says, because it was re-read from it. The alternative -- to
// split the paragraphs held in the page and keep the break "pending" -- makes
// the page's paragraph numbering disagree with the file's for every edit that
// follows, and the numbering is what an edit is addressed by.
async function commitStructural(splits, merges, shapeIndex, caretPara, caretChar, done) {
  const edits = pendingEdits();
  try {
    const out = edit_pptx_with_splits(new Uint8Array(state.bytes), edits, splits, merges,
                                      state.formats);
    state.bytes = out.buffer.slice(out.byteOffset, out.byteOffset + out.byteLength);
    state.pres = parse_presentation(new Uint8Array(state.bytes));
    state.edits.clear();
    state.splits.length = 0;
    state.undo.length = 0;
    state.redo.length = 0;
    state.original.clear();
    $('save').disabled = true;
    layoutSlide();
    placeCaret(shapeIndex, caretPara, caretChar);
    describeSelection();
    paint();
    coverage();
    say(done);
  } catch (err) {
    say('could not change the paragraphs: ' + err.message);
  }
}

// Enter breaks the paragraph at the caret.
document.addEventListener('keydown', (e) => {
  if (!state.sel || e.key !== 'Enter') return;
  e.preventDefault();
  const { entry, line } = state.sel;
  if (entry.shape.sp_index == null) { say('this shape cannot be edited yet'); return; }
  commitStructural(
    [{ slide_index: state.slide, shape_index: entry.shape.sp_index,
       paragraph_index: line.para_index, at_char: state.sel.charIndex }],
    [], entry.shapeIndex, line.para_index + 1, 0, 'paragraph broken');
});

// Backspace at the very start of a paragraph joins it onto the one above --
// the inverse of Enter, and the only Backspace that is not a character.
document.addEventListener('keydown', (e) => {
  if (!state.sel || e.key !== 'Backspace') return;
  const { entry, line } = state.sel;
  if (state.sel.charIndex !== 0 || line.para_index === 0) return;
  e.preventDefault();
  // ★And stop the plain Backspace handler, which is a later listener on the
  // same element: `preventDefault` only tells the BROWSER to stand down, not
  // the rest of the page. Without this the join happened and then a character
  // was deleted on top of it, and the status line showed only the second.
  e.stopImmediatePropagation();
  if (entry.shape.sp_index == null) { say('this shape cannot be edited yet'); return; }
  // The caret lands where the join happened: the end of what the paragraph
  // above used to be.
  const above = entry.paragraphs[line.para_index - 1];
  const at = above.runs.reduce((n, r) => n + [...r.text].length, 0);
  commitStructural(
    [], [{ slide_index: state.slide, shape_index: entry.shape.sp_index,
           paragraph_index: line.para_index }],
    entry.shapeIndex, line.para_index - 1, at, 'paragraphs joined');
});

// Delete or Backspace over a selection removes the whole range, across as many
// runs as it covers. Each run keeps its own identity -- only the characters
// inside the range go -- so the weights and sizes of what remains are untouched.
document.addEventListener('keydown', (e) => {
  if (!state.sel) return;
  const range = selectedRange();
  if (!range) return;
  const printable = e.key.length === 1 && !e.ctrlKey && !e.metaKey;
  if (e.key !== 'Backspace' && e.key !== 'Delete' && !printable) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  const { entry, line } = state.sel;
  if (entry.shape.sp_index == null) { say('this shape cannot be edited yet'); return; }
  const para = entry.paragraphs[range.para];
  const touched = [];
  let seen = 0;
  para.runs.forEach((run, ri) => {
    const chars = [...run.text];
    const start = seen, end = seen + chars.length;
    seen = end;
    const from = Math.max(range.from, start), to = Math.min(range.to, end);
    if (to <= from) return;
    const before = run.text;
    chars.splice(from - start, to - from);
    run.text = chars.join('');
    const okey = entry.shapeIndex + '/' + range.para + '/' + ri;
    touched.push({ runIndex: ri, before, after: run.text,
                   original: state.original.has(okey) ? state.original.get(okey) : before });
    const key = state.slide + '/' + entry.shape.sp_index + '/' + range.para + '/' + ri;
    if (run.text === touched[touched.length - 1].original) state.edits.delete(key);
    else state.edits.set(key, run.text);
  });
  state.undo.push({ shapeIndex: entry.shapeIndex, paraIndex: range.para, runs: touched,
                    caretBefore: range.to, caretAfter: range.from });
  state.redo.length = 0;
  state.anchor = null;
  layoutSlide();
  placeCaret(entry.shapeIndex, range.para, range.from);
  $('save').disabled = state.edits.size === 0;
  describeSelection();
  paint();
  say(`${range.to - range.from} characters deleted \u2014 ` +
      `${state.edits.size} run${state.edits.size === 1 ? '' : 's'} edited`);
});

document.addEventListener('keydown', (e) => {
  if (!state.sel) return;
  const printable = e.key.length === 1 && !e.ctrlKey && !e.metaKey;
  if (!printable && e.key !== 'Backspace') return;
  e.preventDefault();
  const { entry, line } = state.sel;
  const para = entry.paragraphs[line.para_index];
  let at = state.sel.charIndex;
  if (e.key === 'Backspace') { if (at === 0) return; at -= 1; }
  // Find the run holding `at`.
  let seen = 0, ri = -1, within = 0;
  for (let i = 0; i < para.runs.length; i++) {
    const n = [...para.runs[i].text].length;
    if (at < seen + n || (e.key !== 'Backspace' && at === seen + n && i === para.runs.length - 1)) {
      ri = i; within = at - seen; break;
    }
    seen += n;
  }
  if (ri < 0) { ri = para.runs.length - 1; within = [...para.runs[ri].text].length; }
  const chars = [...para.runs[ri].text];
  const before = para.runs[ri].text;
  if (e.key === 'Backspace') chars.splice(within, 1);
  else chars.splice(within, 0, e.key);
  para.runs[ri].text = chars.join('');
  const caretBefore = state.sel.charIndex;
  const caretAfter = caretBefore + (e.key === 'Backspace' ? -1 : 1);
  const okey = entry.shapeIndex + '/' + line.para_index + '/' + ri;
  state.undo.push({
    shapeIndex: entry.shapeIndex, paraIndex: line.para_index,
    runs: [{ runIndex: ri, before, after: para.runs[ri].text,
             original: state.original.has(okey) ? state.original.get(okey) : before }],
    caretBefore, caretAfter,
  });
  state.redo.length = 0;
  // ★The edit is addressed by `sp_index`, NOT by the shape's place in
  // `slide.shapes`. The IR flattens groups and carries shapes the saver never
  // counts, so the two numberings differ -- d15 slide 1 has 33 IR shapes
  // against the saver's 29, and an edit sent under the IR index landed on a
  // different shape and wrote nothing.
  if (entry.shape.sp_index == null) { say('this shape cannot be edited yet'); return; }
  state.edits.set(`${state.slide}/${entry.shape.sp_index}/${line.para_index}/${ri}`,
                  para.runs[ri].text);
  layoutSlide();
  placeCaret(entry.shapeIndex, line.para_index, caretAfter);
  $('save').disabled = state.edits.size === 0;
  describeSelection();
  paint();
  say(`${state.edits.size} run${state.edits.size === 1 ? '' : 's'} edited`);
});

function pendingEdits() {
  const edits = [];
  for (const [key, text] of state.edits) {
    const [s, sh, p, r] = key.split('/').map(Number);
    edits.push({ slide_index: s, shape_index: sh, paragraph_index: p, run_index: r,
                 new_text: text });
  }
  return edits;
}

$('save').addEventListener('click', () => {
  const edits = pendingEdits();
  try {
    const out = edit_pptx_with_splits(new Uint8Array(state.bytes), edits,
                                      state.splits, [], state.formats);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], {
      type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' }));
    a.download = 'edited.pptx';
    a.click();
    say(`saved ${edits.length} edit${edits.length === 1 ? '' : 's'}` +
        (state.splits.length ? ` and ${state.splits.length} paragraph break` +
                               `${state.splits.length === 1 ? '' : 's'}` : ''));
  } catch (err) {
    say('save failed: ' + err.message);
  }
});

/* ---------- shell -------------------------------------------------------- */

function say(msg) { $('status').textContent = msg; }

function coverage() {
  const missing = new Set();
  let engine = 0, total = 0, byBrowser = 0;
  for (const entry of state.laid) {
    total++;
    const fams = new Set();
    for (const p of entry.paragraphs) {
      const fam = p.runs.find(r => r.font_family)?.font_family
        || familyOfLevel(entry.shape, p);
      if (fam) fams.add(fam);
    }
    if (entry.layout.complete) {
      engine++;
      // A face the build machine never measured, that this browser had.
      if ([...fams].some(f => !slide_family_measurable(f) && familyPresent(f))) {
        byBrowser++;
      }
    } else {
      for (const f of fams) {
        if (!slide_family_measurable(f) && !familyPresent(f)) missing.add(f);
      }
    }
  }
  state.byBrowser = byBrowser;
  $('s-cover').innerHTML = total
    ? `<span class="tag ${engine === total ? 'engine' : 'browser'}">` +
      `${engine} / ${total} shapes</span>` +
      (byBrowser ? ` <span class="hint">${byBrowser} on faces this browser measured</span>` : '')
    : '—';
  $('s-fams').innerHTML = missing.size
    ? [...missing].map(f => `<li>${f}</li>`).join('')
    : '<li class="hint">none — every shape is the engine’s</li>';
  $('s-fams').dataset.byBrowser = byBrowser;
}

function showSlide(i) {
  state.slide = i;
  state.sel = null;
  layoutSlide();
  paint();
  coverage();
  describeSelection();
  $('s-slide').textContent = `${i + 1} / ${state.pres.slides.length}`;
  document.querySelectorAll('.thumb').forEach((t, j) => t.classList.toggle('on', j === i));
}

function buildThumbs() {
  const box = $('thumbs');
  box.innerHTML = '';
  state.pres.slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const c = document.createElement('canvas');
    c.width = 140; c.height = Math.round(140 * state.pres.slide_height / state.pres.slide_width);
    const g = c.getContext('2d');
    g.fillStyle = state.pres.slides[i].background_color
      ? '#' + state.pres.slides[i].background_color : '#fff';
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#555'; g.font = '11px sans-serif';
    g.fillText(String(i + 1), 5, 14);
    d.appendChild(c);
    d.addEventListener('click', () => showSlide(i));
    box.appendChild(d);
  });
}

$('file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  state.bytes = await f.arrayBuffer();
  state.edits.clear();
  state.undo.length = 0;
  state.redo.length = 0;
  state.splits.length = 0;
  state.formats.length = 0;
  state.original.clear();
  state.anchor = null;
  $('save').disabled = true;
  try {
    state.pres = parse_presentation(new Uint8Array(state.bytes));
  } catch (err) {
    say('could not parse: ' + err.message);
    return;
  }
  state.scale = Math.min(1.2, 900 / state.pres.slide_width);
  buildThumbs();
  showSlide(0);
  say(`${f.name} — ${state.pres.slides.length} slides`);
});

await init();
say('ready — open a .pptx');
</script>
</body>
</html>
