name: CI

# The gates the README promises, run on every push and pull request.
#
# The pixel-fidelity gates (SSIM against Word, Excel and PowerPoint's own
# renders) need a Windows machine with Microsoft Office installed and are run
# locally before a change is committed. What runs here is everything that does
# not need Office: the unit and integration suite, clippy, and the WebAssembly
# build.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/metrics/**'
      - 'tools/golden-test/**'
  pull_request:
  workflow_dispatch:
    inputs:
      font_metrics:
        description: Collect installed Windows font metrics instead of running the test suite
        type: boolean
        default: false

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A large workspace on a shared runner: no incremental artefacts to carry
  # between jobs, and no debug info to write.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    if: ${{ !inputs.font_metrics }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # The browser VBA host's tests are behind a feature. Without it the
      # crate compiles with no tests at all and reports a green `0 passed`,
      # so the whole host suite would go unrun while the job stayed green.
      - name: The spreadsheet VBA host's own suite
        run: cargo test -p oxidocs-wasm --features suite --locked

  clippy:
    if: ${{ !inputs.font_metrics }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  wasm:
    if: ${{ !inputs.font_metrics }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      # `suite` is what the in-repo editor needs: without it the spreadsheet,
      # presentation and hanko bindings are not exported at all, and the
      # browser suites below would open a workbook with nothing to open it.
      - run: wasm-pack build --target web --release -- --features suite
        working-directory: crates/oxidocs-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: oxidocs-wasm-pkg
          path: crates/oxidocs-wasm/pkg/
          retention-days: 7

  browser:
    if: ${{ !inputs.font_metrics }}
    # Four of the six suites open a real workbook through the engine, so they
    # need the build the `wasm` job makes; the pkg is gitignored and is not in
    # a fresh checkout.
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: oxidocs-wasm-pkg
          path: pkg
      - name: Put the engine where the page expects it
        run: cp pkg/oxidocs_wasm.js pkg/oxidocs_wasm_bg.wasm pkg/*.d.ts web/
      # The suites lift their subjects out of the page by name, so they run
      # under plain node with no bundler.
      - name: The browser editor's suites
        working-directory: web
        run: |
          for suite in page grid formula bands save row-model; do
            node "$suite.test.mjs"
          done
      - name: Excel VBA error compatibility through the WASM API
        run: |
          node web/vba-errors.test.mjs pkg
          node web/vba-failure-state.test.mjs pkg
          node web/vba-filesystem-state.test.mjs pkg
          node web/vba-folder-operations.test.mjs pkg
          node web/vba-file-attributes.test.mjs pkg
          node web/vba-file-modes.test.mjs pkg
          node web/vba-directory-enumeration.test.mjs pkg
          node web/vba-file-sharing.test.mjs pkg
          node web/vba-file-operations.test.mjs pkg
          node web/vba-rand-replay.test.mjs pkg
          node web/vba-conditional-reads.test.mjs pkg
          node web/vba-udf-value-readiness.test.mjs pkg
          node web/vba-udf-scalar-host.test.mjs pkg
          node web/vba-udf-reference-spill.test.mjs pkg
          node web/vba-spill-metadata.test.mjs pkg
          node web/vba-spill-reference.test.mjs pkg
          node web/vba-constant-aliases.test.mjs pkg
          node web/vba-phonetic-reference.test.mjs pkg
          node web/vba-phonetic-arrays.test.mjs pkg
          node web/vba-formula-reference-assignment.test.mjs pkg
          node web/vba-scalar-replay.test.mjs pkg
          node web/vba-main-page.test.mjs pkg
          node web/vba-editor-settings.test.mjs pkg
          node web/vba-entry-points.test.mjs pkg
          node web/vba-macro-arguments.test.mjs pkg
          node web/vba-macro-named.test.mjs pkg
          node web/vba-macro-copyback.test.mjs pkg
          node web/vba-application-state.test.mjs pkg
          node web/vba-save.test.mjs pkg
          node web/vba-project-state.test.mjs pkg
          node web/vba-source-edits.test.mjs pkg
          node web/vba-static-storage.test.mjs pkg
          node web/vba-standard-modules.test.mjs pkg
          node web/vba-reference-places.test.mjs pkg
          node web/vba-paramarray.test.mjs pkg
          node web/vba-compile-storage.test.mjs pkg
          node web/vba-class-arguments.test.mjs pkg
          node web/vba-property-bindings.test.mjs pkg
          node web/vba-storage-types.test.mjs pkg
          node web/vba-array-access.test.mjs pkg
          node web/vba-default-lifetime.test.mjs pkg
          node web/vba-object-places.test.mjs pkg
          node web/vba-value-contexts.test.mjs pkg
          node web/vba-call-preparation.test.mjs pkg
          node web/vba-dispatch-arguments.test.mjs pkg
          node web/vba-declaration-syntax.test.mjs pkg
          node web/vba-constant-bounds.test.mjs pkg
          node web/vba-const-contexts.test.mjs pkg
          node web/vba-constant-types.test.mjs pkg
          node web/vba-module-initialization.test.mjs pkg
          node web/vba-project-compilation.test.mjs pkg
          node web/vba-automation-names.test.mjs pkg
          node web/vba-callbyname-binding.test.mjs pkg
          node web/vba-callbyname-references.test.mjs pkg
          node web/vba-callbyname-coercion.test.mjs pkg
          node web/vba-cell-utf16.test.mjs pkg
          node web/vba-utf16-semantics.test.mjs pkg
          node web/vba-text-extensions.test.mjs pkg
          node web/vba-byte-boundaries.test.mjs pkg
          node web/vba-byte-arrays.test.mjs pkg
          node web/vba-array-values.test.mjs pkg
          node web/vba-byte-scalars.test.mjs pkg
          node web/vba-reference-evaluation.test.mjs pkg
          node web/vba-index-contexts.test.mjs pkg
          node web/vba-udf-evaluation.test.mjs pkg
          node web/vba-dirty-calculation.test.mjs pkg
          node web/vba-calculation-state.test.mjs pkg
            node web/vba-cell-width.test.mjs pkg
            node web/vba-cell-width-controls.test.mjs pkg
            node web/vba-width-boundaries.test.mjs pkg
            node web/vba-array-argument-rank.test.mjs pkg
            node web/vba-width-coercion.test.mjs pkg
            node web/vba-width-use.test.mjs pkg
            node web/vba-width-late.test.mjs pkg
            node web/vba-nothing-receiver.test.mjs pkg
            node web/vba-nothing-errors.test.mjs pkg
            node web/vba-row-height-types.test.mjs pkg
            node web/vba-row-height-late.test.mjs pkg
            node web/vba-row-height-state.test.mjs pkg
            node web/vba-row-height-defaults.test.mjs pkg
            node web/vba-row-height-loaded.test.mjs pkg
            node web/vba-save-copy.test.mjs pkg
            node web/vba-file-downloads.test.mjs
      - name: Word vertical text rendering and WASM orientation
        run: |
          node --test web/vertical-text.test.mjs
          node web/vertical-layout.test.mjs pkg

  font-metrics:
    if: ${{ inputs.font_metrics }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record font provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path font-metrics -Force | Out-Null
          Get-ComputerInfo -Property OsName,OsVersion,WindowsVersion | ConvertTo-Json | Set-Content font-metrics/os.json
          Get-ChildItem C:/Windows/Fonts -File | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content font-metrics/font-hashes.json
      - name: Extract metrics
        run: cargo run --release --manifest-path tools/font-metrics-gen/Cargo.toml -- C:/Windows/Fonts font-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog generator dependencies
        run: python -m pip install fonttools==4.62.0
      - name: Test complete font enumeration
        run: python -W error::ResourceWarning -m unittest discover -s tools/font-metrics-gen -p 'test*.py' -v
      - name: Export complete installed font catalog
        run: python tools/font-metrics-gen/catalog.py --output font-metrics/catalog --portable-output font-metrics/portable
      - name: Verify requested font coverage
        shell: pwsh
        run: |
          $metrics = Get-Content font-metrics/font_metrics.json -Raw | ConvertFrom-Json
          foreach ($family in @('Microsoft JhengHei Light', 'Microsoft JhengHei UI Light')) {
            if (-not ($metrics | Where-Object family -eq $family)) { throw "Missing metrics for $family" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-font-metrics
          path: font-metrics/
          retention-days: 30
