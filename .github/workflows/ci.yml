name: CI

# The gates the README promises. A push to main runs the test suite and clippy
# when code changed; pull requests, the nightly run and a manual run also build
# the WebAssembly package.
#
# The pixel-fidelity gates (SSIM against Word, Excel and PowerPoint's own
# renders) need a Windows machine with Microsoft Office installed and are run
# locally before a change is committed. What runs here is everything that does
# not need Office: the unit and integration suite, clippy, and the WebAssembly
# build.

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ci.yml'
  pull_request:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      font_metrics:
        description: Collect installed Windows font metrics instead of running the test suite
        type: boolean
        default: false

# A newer push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A large workspace on a shared runner: no incremental artefacts to carry
  # between jobs, and no debug info to write.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    if: ${{ !inputs.font_metrics }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Bound memory while running complete workbook comparisons.
      RUST_TEST_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --config profile.test.package.oxivba-core.opt-level=1
      # The browser VBA host's tests are behind a feature. Without it the
      # crate compiles with no tests at all and reports a green `0 passed`,
      # so the whole host suite would go unrun while the job stayed green.
      - name: The spreadsheet VBA host's own suite
        run: cargo test -p oxidocs-wasm --features suite --locked --config profile.test.package.oxivba-core.opt-level=1

  clippy:
    if: ${{ !inputs.font_metrics }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  wasm:
    if: ${{ github.event_name != 'push' && !inputs.font_metrics }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache/restore@v4
        id: wasm-tools
        with:
          path: ~/.local/share/oxi-wasm-tools
          key: wasm-tools-v1-${{ runner.os }}-${{ runner.arch }}-pack-0.15.1-opt-130
      - name: Install pinned WebAssembly build tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$HOME/.local/share/oxi-wasm-tools"
          mkdir -p "$tools_dir/bin"
          download_asset() {
            local repo="$1" asset="$2" expected="$3" archive="$4"
            curl --fail --location --retry 5 --retry-delay 5 --retry-all-errors \
              --connect-timeout 15 --max-time 180 --retry-max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/releases/assets/$asset" \
              --output "$archive"
            printf '%s  %s\n' "$expected" "$archive" | sha256sum --check
          }
          if [[ ! -x "$tools_dir/bin/wasm-pack" ]]; then
            archive="$RUNNER_TEMP/oxi-wasm-pack.tar.gz"
            download_asset wasm-bindgen/wasm-pack 691077448 \
              410101009739b9d01c7d5affaaad6e9c9a24b4cba6791a4805db8e89b9bf7af2 "$archive"
            tar -xzf "$archive" --strip-components=1 -C "$tools_dir/bin" \
              wasm-pack-v0.15.1-x86_64-unknown-linux-musl/wasm-pack
          fi
          if [[ ! -x "$tools_dir/bin/wasm-opt" ]]; then
            archive="$RUNNER_TEMP/oxi-binaryen.tar.gz"
            download_asset WebAssembly/binaryen 435610959 \
              0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc "$archive"
            tar -xzf "$archive" --strip-components=2 -C "$tools_dir/bin" \
              binaryen-version_130/bin/wasm-opt
          fi
          test "$("$tools_dir/bin/wasm-pack" --version)" = "wasm-pack 0.15.1"
          "$tools_dir/bin/wasm-opt" --version | grep -E '^wasm-opt version 130([[:space:]]|$)'
          echo "$tools_dir/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/save@v4
        if: steps.wasm-tools.outputs.cache-hit != 'true'
        with:
          path: ~/.local/share/oxi-wasm-tools
          key: wasm-tools-v1-${{ runner.os }}-${{ runner.arch }}-pack-0.15.1-opt-130
      # `suite` is what the in-repo editor needs: without it the spreadsheet,
      # presentation and hanko bindings are not exported at all, and the
      # browser suites below would open a workbook with nothing to open it.
      - run: wasm-pack build --target web --release -- --features suite
        working-directory: crates/oxidocs-wasm
      - uses: actions/upload-artifact@v4
        with:
          name: oxidocs-wasm-pkg
          path: crates/oxidocs-wasm/pkg/
          retention-days: 7

  browser-suites:
    name: Browser suites (${{ matrix.shard }}/8)
    if: ${{ github.event_name != 'push' && !inputs.font_metrics }}
    # Four of the six suites open a real workbook through the engine, so they
    # need the build the `wasm` job makes; the pkg is gitignored and is not in
    # a fresh checkout.
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: oxidocs-wasm-pkg
          path: pkg
      - name: Put the engine where the page expects it
        run: cp pkg/oxidocs_wasm.js pkg/oxidocs_wasm_bg.wasm pkg/*.d.ts web/
      # The suites lift their subjects out of the page by name, so they run
      # under plain node with no bundler.
      - name: The browser editor's suites
        if: ${{ matrix.shard == 1 }}
        working-directory: web
        run: |
          for suite in page grid formula bands save row-model; do
            node "$suite.test.mjs"
          done
      # Keep every suite and its arguments; distribute the slow independent
      # conformance runs so the entire set can finish within each job's limit.
      - name: Excel VBA error compatibility through the WASM API
        env:
          OXI_BROWSER_SHARD: ${{ matrix.shard }}
        run: |
          suites=(
            web/vba-errors.test.mjs
            web/vba-failure-state.test.mjs
            web/vba-filesystem-state.test.mjs
            web/vba-folder-operations.test.mjs
            web/vba-file-attributes.test.mjs
            web/vba-file-modes.test.mjs
            web/vba-directory-enumeration.test.mjs
            web/vba-file-sharing.test.mjs
            web/vba-file-operations.test.mjs
            web/vba-rand-replay.test.mjs
            web/vba-conditional-reads.test.mjs
            web/vba-udf-value-readiness.test.mjs
            web/vba-udf-scalar-host.test.mjs
            web/vba-udf-reference-spill.test.mjs
            web/vba-spill-metadata.test.mjs
            web/vba-spill-reference.test.mjs
            web/vba-constant-aliases.test.mjs
            web/vba-phonetic-reference.test.mjs
            web/vba-phonetic-arrays.test.mjs
            web/vba-formula-reference-assignment.test.mjs
            web/vba-scalar-replay.test.mjs
            web/vba-main-page.test.mjs
            web/vba-editor-settings.test.mjs
            web/vba-entry-points.test.mjs
            web/vba-macro-arguments.test.mjs
            web/vba-macro-named.test.mjs
            web/vba-macro-copyback.test.mjs
            web/vba-application-state.test.mjs
            web/vba-save.test.mjs
            web/vba-project-state.test.mjs
            web/vba-source-edits.test.mjs
            web/vba-static-storage.test.mjs
            web/vba-standard-modules.test.mjs
            web/vba-reference-places.test.mjs
            web/vba-paramarray.test.mjs
            web/vba-compile-storage.test.mjs
            web/vba-class-arguments.test.mjs
            web/vba-property-bindings.test.mjs
            web/vba-storage-types.test.mjs
            web/vba-array-access.test.mjs
            web/vba-default-lifetime.test.mjs
            web/vba-object-places.test.mjs
            web/vba-value-contexts.test.mjs
            web/vba-call-preparation.test.mjs
            web/vba-dispatch-arguments.test.mjs
            web/vba-declaration-syntax.test.mjs
            web/vba-constant-bounds.test.mjs
            web/vba-const-contexts.test.mjs
            web/vba-constant-types.test.mjs
            web/vba-module-initialization.test.mjs
            web/vba-project-compilation.test.mjs
            web/vba-automation-names.test.mjs
            web/vba-callbyname-binding.test.mjs
            web/vba-callbyname-references.test.mjs
            web/vba-callbyname-coercion.test.mjs
            web/vba-cell-utf16.test.mjs
            web/vba-utf16-semantics.test.mjs
            web/vba-text-extensions.test.mjs
            web/vba-byte-boundaries.test.mjs
            web/vba-byte-arrays.test.mjs
            web/vba-array-values.test.mjs
            web/vba-byte-scalars.test.mjs
            web/vba-reference-evaluation.test.mjs
            web/vba-index-contexts.test.mjs
            web/vba-udf-evaluation.test.mjs
            web/vba-dirty-calculation.test.mjs
            web/vba-calculation-state.test.mjs
            web/vba-cell-width.test.mjs
            web/vba-cell-width-controls.test.mjs
            web/vba-width-boundaries.test.mjs
            web/vba-array-argument-rank.test.mjs
            web/vba-width-coercion.test.mjs
            web/vba-width-use.test.mjs
            web/vba-width-late.test.mjs
            web/vba-nothing-receiver.test.mjs
            web/vba-nothing-errors.test.mjs
            web/vba-row-height-types.test.mjs
            web/vba-row-height-late.test.mjs
            web/vba-row-height-state.test.mjs
            web/vba-row-height-defaults.test.mjs
            web/vba-row-height-loaded.test.mjs
            web/vba-save-copy.test.mjs
            web/vba-file-downloads.test.mjs
            web/vba-external-copy-state.test.mjs
            web/vba-chart-documents.test.mjs
            web/vba-chart-persistence.test.mjs
            web/vba-document-identity.test.mjs
            web/vba-document-runtime.test.mjs
            web/vba-structural-save.test.mjs
            web/vba-unicode-modules.test.mjs
            web/vba-ole-copy-state.test.mjs
          )
          # New public VBA suites must be assigned to the same shard loop.
          for suite in web/vba*.test.mjs; do
            if [[ " ${suites[*]} " != *" $suite "* ]]; then
              echo "Missing VBA suite in CI: $suite" >&2
              exit 1
            fi
          done
          index=0
          for suite in "${suites[@]}"; do
            selected=$((index % 8 + 1))
            index=$((index + 1))
            if [ "$selected" -ne "$OXI_BROWSER_SHARD" ]; then
              continue
            fi
            echo "::group::$suite"
            if [ "$suite" = "web/vba-file-downloads.test.mjs" ]; then
              node "$suite"
            elif [ "$suite" = "web/vba-external-copy-state.test.mjs" ]; then
              node "$suite" pkg "$RUNNER_TEMP/vba-external-copy-state.json"
            elif [ "$suite" = "web/vba-ole-copy-state.test.mjs" ]; then
              node "$suite" pkg "$RUNNER_TEMP/vba-ole-copy-state.json"
              node "$suite" pkg "$RUNNER_TEMP/vba-ole-legacy-layers-state.json" tests/fixtures/vba/ole_legacy_layers_native.json . 18
              node "$suite" pkg "$RUNNER_TEMP/vba-ole-layer-operations-state.json" tests/fixtures/vba/ole_layer_operations_native.json . 33
              node "$suite" pkg "$RUNNER_TEMP/vba-group-layer-operations-state.json" tests/fixtures/vba/group_layer_operations_native.json . 58
            else
              node "$suite" pkg
            fi
            echo "::endgroup::"
          done
      - name: Preserve exact Native VBA state observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vba-external-copy-state-${{ matrix.shard }}
          path: ${{ runner.temp }}/vba-external-copy-state.json
          if-no-files-found: ignore
      - name: Preserve complete Native OLE observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vba-ole-copy-state-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/vba-ole-copy-state.json
            ${{ runner.temp }}/vba-ole-legacy-layers-state.json
            ${{ runner.temp }}/vba-ole-layer-operations-state.json
            ${{ runner.temp }}/vba-group-layer-operations-state.json
          if-no-files-found: ignore
      - name: Word vertical text rendering and WASM orientation
        if: ${{ matrix.shard == 1 }}
        run: |
          node --test web/vertical-text.test.mjs
          node web/vertical-layout.test.mjs pkg


  # Preserve the existing required check name and fail if any shard fails.
  browser:
    if: ${{ always() && github.event_name != 'push' && !inputs.font_metrics }}
    needs: browser-suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser suite
        env:
          OXI_BROWSER_RESULT: ${{ needs['browser-suites'].result }}
        run: test "$OXI_BROWSER_RESULT" = success

  font-metrics:
    if: ${{ inputs.font_metrics }}
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record font provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path font-metrics -Force | Out-Null
          Get-ComputerInfo -Property OsName,OsVersion,WindowsVersion | ConvertTo-Json | Set-Content font-metrics/os.json
          Get-ChildItem C:/Windows/Fonts -File | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content font-metrics/font-hashes.json
      - name: Extract metrics
        run: cargo run --release --manifest-path tools/font-metrics-gen/Cargo.toml -- C:/Windows/Fonts font-metrics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install catalog generator dependencies
        run: python -m pip install fonttools==4.62.0
      - name: Test complete font enumeration
        run: python -W error::ResourceWarning -m unittest discover -s tools/font-metrics-gen -p 'test*.py' -v
      - name: Export complete installed font catalog
        run: python tools/font-metrics-gen/catalog.py --output font-metrics/catalog --portable-output font-metrics/portable
      - name: Verify requested font coverage
        shell: pwsh
        run: |
          $metrics = Get-Content font-metrics/font_metrics.json -Raw | ConvertFrom-Json
          foreach ($family in @('Microsoft JhengHei Light', 'Microsoft JhengHei UI Light')) {
            if (-not ($metrics | Where-Object family -eq $family)) { throw "Missing metrics for $family" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-font-metrics
          path: font-metrics/
          retention-days: 30
