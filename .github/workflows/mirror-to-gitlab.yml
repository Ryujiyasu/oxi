name: Mirror to GitLab

# GitLab Pages serves the site at the URL that has been given out, from the
# project at gitlab.com/Ryujiyasu/oxi. Work lands on GitHub, so GitHub pushes
# `main` and the tags across and GitLab keeps no history of its own.
#
# The push no longer rebuilds the site: GitHub builds it (site.yml) and
# triggers the GitLab Pages job, which starts no job on a push.
#
# Needs a GitLab project access token with the `write_repository` scope, stored
# here as the secret GITLAB_MIRROR_TOKEN. The job fails without it rather than
# skipping — a mirror that silently stops is a site that silently goes stale,
# which is the failure this job exists to prevent.

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: GitLab is being handed the same repository, not
          # the tip of it.
          fetch-depth: 0

      - name: Push main and tags to GitLab
        env:
          TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "GITLAB_MIRROR_TOKEN is not set, so the site cannot be rebuilt." >&2
            echo "Add a GitLab project access token (write_repository) as that secret." >&2
            exit 1
          fi
          git remote add gitlab "https://oauth2:$TOKEN@gitlab.com/Ryujiyasu/oxi.git"
          # A plain push, not a force: if GitLab has moved on its own, that is
          # worth stopping for rather than overwriting.
          git push gitlab HEAD:refs/heads/main
          # Only the tags GitLab does not already carry. `--tags` refuses the
          # whole push the moment one tag is already there, which turned a
          # mirror that had just pushed `main` perfectly well into a red build.
          # A tag it already has needs nothing done to it; a tag it lacks is
          # pushed on its own, so a real failure still fails.
          held=$(git ls-remote --tags gitlab | awk '{print $2}' \
            | sed -e 's#^refs/tags/##' -e 's#\^{}$##' | sort -u)
          for tag in $(git tag); do
            if printf '%s\n' "$held" | grep -qx "$tag"; then
              continue
            fi
            git push gitlab "refs/tags/$tag"
          done
