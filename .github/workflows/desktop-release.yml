name: Desktop Release

# Builds signed Oxi Desktop installers for Windows / macOS / Linux and
# publishes them (plus the updater manifest latest.json) as a DRAFT GitHub
# Release. Publish the draft to make it live — the app's auto-updater reads
# https://github.com/Ryujiyasu/oxi/releases/latest/download/latest.json
#
# Trigger: push a tag like desktop-v0.1.1 (after bumping the version in
# crates/oxi-desktop/tauri.conf.json and Cargo.toml).

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            rust_targets: 'aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
            rust_targets: ''
          - platform: 'windows-latest'
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.platform }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # The updater key was generated with an empty password on purpose
      # (the key material itself is the secret).
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      # Where a rating goes when someone chooses to send one. Not a secret —
      # it is a public endpoint, and it ends up in the shipped page either
      # way. Set it as a repository variable; leave it unset and the rating
      # card is left out of the build entirely.
      OXI_FEEDBACK_ENDPOINT: ${{ vars.OXI_FEEDBACK_ENDPOINT }}
      # macOS refuses to open an app from an unidentified developer, and
      # unlike Windows it does not offer a way past it that an ordinary
      # person will find. These sign the app and send it to Apple to be
      # notarised. Names are Tauri's, and a wrong one does not fail the
      # build — it produces an unsigned app — so the artifact is checked
      # afterwards rather than the configuration being trusted.
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/oxi-desktop

      - name: Build and attach to a draft release
        id: build
        # Apple's timestamp service is reached over the network while the
        # app is being signed, and a runner that cannot reach it fails with
        # "A timestamp was expected but was not found". Nothing about that
        # is specific to the code — it took out the arm64 half of v0.8.2
        # while the x86_64 half of the same release signed cleanly — so it
        # is tried once more rather than costing a whole release.
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/oxi-desktop
          tauriScript: tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Oxi Desktop ${{ github.ref_name }}'
          releaseBody: 'Installers for Windows / macOS / Linux. Installed apps update automatically from this release feed.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build it again, once
        if: steps.build.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/oxi-desktop
          tauriScript: tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Oxi Desktop ${{ github.ref_name }}'
          releaseBody: 'Installers for Windows / macOS / Linux. Installed apps update automatically from this release feed.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # What was actually produced, not what was configured. An unsigned build
      # succeeds quietly and looks identical in the release list; the only way
      # to tell is to ask the app.
      - name: Check the macOS app is signed and notarised
        if: startsWith(matrix.platform, 'macos')
        run: |
          app=$(find crates/oxi-desktop/target -type d -name "*.app" -path "*/bundle/macos/*" | head -1)
          if [ -z "$app" ]; then
            echo "no .app was built, so there is nothing to check" >&2
            exit 1
          fi
          echo "checking $app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # "Notarized Developer ID" is the only source that gets past Gatekeeper
          # without a right-click. "Developer ID" alone means signed but not
          # notarised, which still stops on a machine that has never seen it.
          spctl --assess --type execute -vv "$app" 2>&1 | tee /tmp/spctl.txt
          grep -q "source=Notarized Developer ID" /tmp/spctl.txt
          xcrun stapler validate "$app"
