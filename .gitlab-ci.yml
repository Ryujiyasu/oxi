# Oxi CI on GitLab — the site, and only the site.
#
# GitLab Pages carries the demo, and the URL it serves is the one that has been
# given out, so the deploy stays here. Everything else — the unit and
# integration suite, clippy, the WebAssembly build and the browser editor's own
# suites — runs on GitHub Actions (`.github/workflows/ci.yml`).
#
# Nobody pushes here any more. GitHub is where work lands, and it pushes `main`
# across (`.github/workflows/mirror-to-gitlab.yml`). Committing here directly
# would put this copy ahead of GitHub and stop that mirror.
#
# The site itself is now built on GitHub too (`.github/workflows/site.yml`).
# This job used to build the WebAssembly engine on every push to main: about
# 14 minutes a run against GitLab's monthly compute quota, which ran out within
# the first days of each month and left every later deploy refused before it
# started (`ci_quota_exceeded`), so the site stayed weeks old without anything
# looking broken. Now GitHub builds it, publishes the tarball on its rolling
# `site` release, and triggers this pipeline with the SHA-256 the tarball must
# have. This job only downloads, checks and unpacks it.
#
# A push (the mirror) starts no job here, so it costs no minutes. A tarball
# that does not match the expected hash fails the job, and Pages keeps serving
# the previous deploy.
#
# The pixel-fidelity gates (SSIM against Word, Excel and PowerPoint's own
# renders) need a Windows machine with Microsoft Office installed and are run
# locally before a change is committed. They run in neither.

stages:
  - deploy

pages:
  stage: deploy
  image: alpine:3
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $SITE_SHA256'
  variables:
    # The repository is not needed: everything comes in the tarball.
    GIT_STRATEGY: none
    SITE_URL: "https://github.com/Ryujiyasu/oxi/releases/download/site/site.tar.gz"
  script:
    - apk add --no-cache curl
    - curl -fsSL --retry 5 --retry-delay 5 -o site.tar.gz "$SITE_URL"
    - echo "$SITE_SHA256  site.tar.gz" | sha256sum -c -
    - tar -xzf site.tar.gz
    - ls -la public/oxidocs_wasm_bg.wasm
  artifacts:
    paths:
      - public
