# Oxi CI on GitLab — the site, and only the site.
#
# GitLab Pages carries the demo, and the URL it serves is the one that has been
# given out, so the deploy stays here. Everything else — the unit and
# integration suite, clippy, the WebAssembly build and the browser editor's own
# suites — moved to GitHub Actions (`.github/workflows/ci.yml`) when GitHub
# became the place issues and pull requests arrive.
#
# The pixel-fidelity gates (SSIM against Word, Excel and PowerPoint's own
# renders) need a Windows machine with Microsoft Office installed and are run
# locally before a change is committed. They run in neither.

stages:
  - deploy

# The site is a copy of `docs/` and needs no toolchain to assemble, so it does
# not pull the Rust image the build jobs used to want.
pages:
  stage: deploy
  image: alpine:3
  needs: []
  script:
    - mkdir -p public
    - cp -r docs/* public/
  artifacts:
    paths:
      - public
  only:
    - main
