[package]
name = "oxi-xll-host"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Loads Excel XLL add-ins outside Excel: answers the Excel C API they call back into and calls the functions they register."

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
[workspace]
