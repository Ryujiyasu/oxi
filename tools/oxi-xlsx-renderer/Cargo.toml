[package]
name = "oxi-xlsx-renderer"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
oxicells-core = { path = "../../crates/oxicells-core" }
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # Excel draws its text through DirectWrite, so matching it means drawing
    # through the same engine rather than GDI.
    "Foundation_Numerics",
    "Win32_System_Com",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
] }
