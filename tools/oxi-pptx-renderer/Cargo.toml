edition = "2021"

[dependencies]
oxislides-core = { path = "../../crates/oxislides-core" }
serde_json = "1"
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
