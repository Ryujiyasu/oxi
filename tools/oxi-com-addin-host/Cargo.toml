[package]
name = "oxi-com-addin-host"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Runs an Excel COM add-in (IDTExtensibility2) outside Excel, handing it Oxi's workbook object model as its Application."

[dependencies]
serde_json = "1"
oxidocs-wasm = { path = "../../crates/oxidocs-wasm", default-features = false, features = ["suite"] }
oxivba-core = { path = "../../crates/oxivba-core" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-core = "0.58"

[workspace]
