[package]
name = "oxi-com-host"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Calls Excel COM Automation add-in functions outside Excel: creates the class by its ProgID and invokes its methods through IDispatch."

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }
windows-core = "0.58"

[workspace]
